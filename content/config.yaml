# yaml-language-server: $schema=_schema/config.schema.json
# Site-wide settings: locales, narration voices, published collections and the Cloudflare Pages file budget.
locales:
  - { id: en, lang: en, section: en }
  - { id: zh-Hans, lang: zh-Hans, section: zh, fallback: en }
  - { id: zh-Hant, lang: zh-Hant, section: zh, fallback: zh-Hans, audioFrom: zh-Hans }
narration: # audio section → default voice that reads narration lines in it
  en: narr-en
  zh: narr-zh
alternateVoices: # selectable voices per audio section in UI display order
  en: [narr-en-ava, narr-en-aria, narr-en-emma, narr-en-ana]
  zh: [narr-zh-xiaoyi, narr-zh-yunxia, narr-zh-yunxi, narr-zh-yunyang, narr-zh-tw]
voices:
  narr-en:
    provider: edge-tts
    voice: en-US-AvaMultilingualNeural
    rate: '-4%'
    label: 'Ava Multilingual (Original)'
    normalize:
      - { find: '\s*艹(?![\p{L}\p{N}_])', replace: '' }
      - { find: '\s*氵(?![\p{L}\p{N}_])', replace: '' }
      - { find: '\s*虍(?![\p{L}\p{N}_])', replace: '' }
      - { find: '\s*宀(?![\p{L}\p{N}_])', replace: '' }
      - { find: '\s*犭(?![\p{L}\p{N}_])', replace: '' }
      - { find: '\s*厂(?![\p{L}\p{N}_])', replace: '' }
      - { find: '\s*口(?![\p{L}\p{N}_])', replace: '' }
      - { find: '—', replace: ', ', literal: true }
      - { find: '…', replace: '... ', literal: true }
      - { find: '\s+', replace: ' ' }
  narr-en-ava:
    provider: edge-tts
    voice: en-US-AvaNeural
    rate: '-5%'
    label: 'Ava (Pure EN · Warm)'
    normalize:
      - { find: '\s*:\s*[\u4e00-\u9fff]+([.!?])', replace: '$1' }
      - { find: '\s*—\s*[\u4e00-\u9fff]+\s*—\s*', replace: ' ' }
      - { find: '\s*艹(?![\p{L}\p{N}_])', replace: '' }
      - { find: '\s*氵(?![\p{L}\p{N}_])', replace: '' }
      - { find: '\s*虍(?![\p{L}\p{N}_])', replace: '' }
      - { find: '\s*宀(?![\p{L}\p{N}_])', replace: '' }
      - { find: '\s*犭(?![\p{L}\p{N}_])', replace: '' }
      - { find: '\s*厂(?![\p{L}\p{N}_])', replace: '' }
      - { find: '\s*口(?![\p{L}\p{N}_])', replace: '' }
      - { find: '—', replace: ', ', literal: true }
      - { find: '…', replace: '...', literal: true }
      - { find: '\s+', replace: ' ' }
