# yaml-language-server: $schema=_schema/ui.schema.json
strings:
  tagline: { en: Where Chinese characters come from, zh-Hans: 汉字从哪里来, zh-Hant: 漢字從哪裡來 }
  prototype: { en: Prototype, zh-Hans: 演示版, zh-Hant: 演示版 }
  prototypeNote:
    en: Throwaway demo to show the plan. Art, sound and content are placeholders.
    zh-Hans: 这是展示思路的演示版，图画、声音和内容都还是草稿。
    zh-Hant: 這是展示思路的演示版，圖畫、聲音和內容都還是草稿。
  theaterTitle: { en: Evolution Theater, zh-Hans: 汉字演变剧场, zh-Hant: 漢字演變劇場 }
  theaterDesc:
    en: Watch any of the 36 characters grow from a picture into the character we write today.
    zh-Hans: 看36个汉字从一幅画，一步步变成今天的字。
    zh-Hant: 看36個漢字從一幅畫，一步步變成今天的字。
  storyTitle: { en: Story Time, zh-Hans: 故事时间, zh-Hant: 故事時間 }
  storyDesc:
    en: Characters come alive and act out a story, just like the 1984 film “Thirty-Six Characters”.
    zh-Hans: 汉字活起来演故事，就像1984年的动画片《三十六个字》。
    zh-Hant: 漢字活起來演故事，就像1984年的動畫片《三十六個字》。
  learnTitle: { en: Learn, zh-Hans: 学习, zh-Hant: 學習 }
  learnDesc: { en: "Bite-sized lessons, games, stars and stickers.", zh-Hans: 小小课程、游戏、星星和贴纸。, zh-Hant: 小小課程、遊戲、星星和貼紙。 }
  bookTitle: { en: Sticker Book, zh-Hans: 贴纸册, zh-Hant: 貼紙冊 }
  bookDesc: { en: Every character you learn becomes a sticker., zh-Hans: 每学会一个字，就得到一张贴纸。, zh-Hant: 每學會一個字，就得到一張貼紙。 }
  mascotHello:
    en: Hi, I’m Gugu! Long ago, people carved the first characters on turtle shells like mine.
    zh-Hans: 你好，我是龟龟！很久以前，人们把最早的汉字刻在像我这样的龟壳上。
    zh-Hant: 你好，我是龜龜！很久以前，人們把最早的漢字刻在像我這樣的龜殼上。
  home: { en: Home, zh-Hans: 首页, zh-Hant: 首頁 }
  soundOn: { en: Sound on, zh-Hans: 声音开, zh-Hant: 聲音開 }
  soundOff: { en: Sound off, zh-Hans: 声音关, zh-Hant: 聲音關 }
  langToggle: { en: Switch language, zh-Hans: 切换语言, zh-Hant: 切換語言 }
  scriptToggle: { en: Simplified / Traditional, zh-Hans: 简体 / 繁体, zh-Hant: 簡體 / 繁體 }
  play: { en: Play, zh-Hans: 播放, zh-Hant: 播放 }
  pause: { en: Pause, zh-Hans: 暂停, zh-Hant: 暫停 }
  replay: { en: Replay, zh-Hans: 重播, zh-Hant: 重播 }
  speed: { en: Speed, zh-Hans: 速度, zh-Hant: 速度 }
  script: { en: Script, zh-Hans: 脚本, zh-Hant: 腳本 }
  scriptNote:
    en: Every animation is generated live from a script like this. There are no video files. Steps light up as they play.
    zh-Hans: 每段动画都是由这样的脚本实时生成的，没有视频文件。正在播放的步骤会亮起来。
    zh-Hant: 每段動畫都是由這樣的腳本即時生成的，沒有影片檔案。正在播放的步驟會亮起來。
  pickChar: { en: Pick a character, zh-Hans: 选一个字, zh-Hant: 選一個字 }
  youngChar:
    en: No ancient forms are known. This is a “young” character!
    zh-Hans: 没有古老的写法——这是一个“年轻”的字！
    zh-Hant: 沒有古老的寫法——這是一個「年輕」的字！
  chapter: { en: Chapter, zh-Hans: 第, zh-Hant: 第 }
  narration: { en: Narration, zh-Hans: 旁白, zh-Hant: 旁白 }
