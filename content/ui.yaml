  quit: { en: Quit lesson, zh-Hans: 退出课程, zh-Hant: 退出課程 }
  newChar: { en: New character!, zh-Hans: 新字！, zh-Hant: 新字！ }
  qPicture: { en: Which character is this picture?, zh-Hans: 这幅画是哪个字？, zh-Hant: 這幅畫是哪個字？ }
  qAncient:
    en: This is how it was written long, long ago. Which character is it today?
    zh-Hans: 这是很久很久以前的写法。它今天是哪个字？
    zh-Hant: 這是很久很久以前的寫法。它今天是哪個字？
  qListen: { en: "Listen, then tap the character you hear.", zh-Hans: 听一听，点出你听到的字。, zh-Hant: 聽一聽，點出你聽到的字。 }
  qOrder: { en: "Put its journey in order: oldest first!", zh-Hans: 按时间排一排：最古老的在前！, zh-Hant: 按時間排一排：最古老的在前！ }
  qTrace: { en: Trace it! Follow the strokes in order., zh-Hans: 描一描！按笔顺写。, zh-Hant: 描一描！按筆順寫。 }
  qMatch: { en: Match each old character with today’s., zh-Hans: 把古文字和今天的字配对。, zh-Hant: 把古文字和今天的字配對。 }
