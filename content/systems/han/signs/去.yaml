id: 去
text: { Hans: 去, Hant: 去 }
readings: { pinyin: qù }
meaning: { en: 'to go, to leave', zh-Hans: 出去, zh-Hant: 出去 }
fact:
  en: 去 started as a person 大 standing over a 口 shape. Scholars have several ideas about what it showed, such as a person leaving a cave or a city.
  zh-Hans: “去”最早是一个人“大”站在一个“口”上面。它画的到底是什么，学者们有好几种说法，比如一个人离开山洞或一座城。
  zh-Hant: 「去」最早是一個人「大」站在一個「口」上面。它畫的到底是什麼，學者們有好幾種說法，比如一個人離開山洞或一座城。
story:
  topic: { en: Off to the Beach, zh-Hans: 去海边玩, zh-Hant: 去海邊玩 }
  hook: { en: 'All packed! Buckets, spades and towels go into the car, and off the family drives to the beach.', zh-Hans: 都装好啦！小桶、小铲子和毛巾都放进了汽车，一家人开车去海边啦！, zh-Hant: 都裝好囉！小桶、小鏟子和毛巾都放進了汽車，一家人開車去海邊囉！ }
  turn: { en: "Bit by bit, the person on top was simplified to 土 and the 口 below to 厶. That's today's 去!", zh-Hans: 慢慢地，上面的人简化成了“土”，下面的“口”简化成了“厶”，就成了今天的“去”！, zh-Hant: 慢慢地，上面的人簡化成了「土」，下面的「口」簡化成了「厶」，就成了今天的「去」！ }
  closer: { en: "土 on top, 厶 below, and off you go: that's 去, to go!", zh-Hans: 上面“土”，下面“厶”，说走就走，这就是出去的“去”！, zh-Hant: 上面「土」，下面「厶」，說走就走，這就是出去的「去」！ }
journey: default
origin:
  type: compound-ideogram
  parts:
    - { char: 大, role: meaning, gloss: { en: person, zh-Hans: 人, zh-Hant: 人 } }
    - { char: 口, role: meaning, gloss: { en: 'mouth, object', zh-Hans: 嘴巴、物体, zh-Hant: 嘴巴、物體 } }
status: draft
sources:
