id: 钟-鐘
text: { Hans: 钟, Hant: 鐘 }
readings: { pinyin: zhōng }
meaning: { en: bell; clock, zh-Hans: 闹钟, zh-Hant: 鬧鐘 }
fact:
  en: 钟 (鐘) has 金 (metal) for the meaning and 童 for the sound. It names a bell, including the big bronze bells used in ceremonies in ancient China.
  zh-Hans: 繁体字里，左边的“金”表示金属，右边的“童”表示读音。它指的是钟，包括古代中国举行仪式时用的青铜大钟。
  zh-Hant: 「鐘」左邊的「金」表示金屬，右邊的「童」表示讀音。它指的是鐘，包括古代中國舉行儀式時用的青銅大鐘。
story:
  topic: { en: The Bell Tower at Noon, zh-Hans: 中午的钟楼, zh-Hant: 中午的鐘樓 }
  hook: { en: 'Dong… dong… dong! At noon, the great bell in the old tower rings twelve times over the rooftops.', zh-Hans: 当——当——当！中午到了，古老钟楼里的大钟在屋顶上空敲了十二下。, zh-Hant: 噹——噹——噹！中午到了，古老鐘樓裡的大鐘在屋頂上空敲了十二下。 }
  turn: { en: 'Simplified 钟 swaps 童 for 中, which is simpler and sounds just like zhōng. That same 钟 also stands for another traditional character, 鍾.', zh-Hans: 简化字“钟”把“童”换成了更简单的“中”，“中”和“钟”都读 zhōng。简化字“钟”还同时代替了另一个繁体字“鍾”。, zh-Hant: 簡化字把「童」換成了更簡單的「中」，「中」和「鐘」都讀 zhōng。這個簡化字還同時代替了另一個繁體字「鍾」。 }
  closer: { en: 'Metal for the meaning, a sound part beside it: 钟 (鐘) is a bell, and a clock too!', zh-Hans: 金字旁表示金属，旁边的部分管读音，这就是大钟和闹钟的“钟”！, zh-Hant: 「金」表示金屬，「童」管讀音，這就是大鐘和鬧鐘的「鐘」！ }
journey: default
origin:
