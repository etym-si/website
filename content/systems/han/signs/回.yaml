id: 回
text: { Hans: 回, Hant: 回 }
readings: { pinyin: huí }
meaning: { en: 'to return, to go back', zh-Hans: 回家, zh-Hant: 回家 }
fact:
  en: 回 started as a spiral, a picture of something turning round and round. Today it means to go back, as in 回家 (go home).
  zh-Hans: “回”最早画的是一个螺旋，表示不停地转圈。今天它是回去的意思，比如“回家”。
  zh-Hant: 「回」最早畫的是一個螺旋，表示不停地轉圈。今天它是回去的意思，比如「回家」。
story:
  topic: { en: Heading Home After School, zh-Hans: 放学回家, zh-Hant: 放學回家 }
  hook: { en: 'Brrring! The school bell rings, and you skip all the way home, where dinner already smells delicious.', zh-Hans: 叮铃铃！放学铃响了，你一路蹦蹦跳跳地回家，饭菜的香味早就飘出来了。, zh-Hant: 叮鈴鈴！放學鈴響了，你一路蹦蹦跳跳地回家，飯菜的香味早就飄出來了。 }
  early: { en: 'The oldest 回 is a spiral, curling round and round.', zh-Hans: 最古老的“回”是一个螺旋，一圈一圈地绕着。, zh-Hant: 最古老的「回」是一個螺旋，一圈一圈地繞著。 }
  turn: { en: Today the spiral has squared off into a small box inside a big one., zh-Hans: 到了今天，螺旋变成了方方正正的样子：大框里套着一个小框。, zh-Hant: 到了今天，螺旋變成了方方正正的樣子：大框裡套著一個小框。 }
  closer: { en: "Round and round and back again: that's 回, to return!", zh-Hans: 转呀转，又转回原来的地方，这就是回家的“回”！, zh-Hant: 轉呀轉，又轉回原來的地方，這就是回家的「回」！ }
journey: default
origin:
