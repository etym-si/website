id: 自
text: { Hans: 自, Hant: 自 }
readings: { pinyin: zì }
meaning: { en: self; from, zh-Hans: 自己, zh-Hant: 自己 }
fact:
  en: 自 was first a picture of a nose! Later it was borrowed for its sound to mean oneself, as in 自己.
  zh-Hans: “自”最早画的是一个鼻子！后来，人们借用它的读音，表示自己。
  zh-Hant: 「自」最早畫的是一個鼻子！後來，人們借用它的讀音，表示自己。
story:
  topic: { en: No Help Needed, zh-Hans: 不用帮忙, zh-Hant: 不用幫忙 }
  hook: { en: 'Look, no help needed! This morning you peeled your own egg and poured your own milk.', zh-Hans: 看，不用帮忙！今天早上，你自己剥了鸡蛋，还自己倒了牛奶。, zh-Hant: 看，不用幫忙！今天早上，你自己剝了雞蛋，還自己倒了牛奶。 }
  early: { en: 'The oldest 自 is a nose, the original form of 鼻 (nose), which still has 自 on top.', zh-Hans: 最古老的“自”是一个鼻子，它就是“鼻”最早的写法，今天“鼻”的上面还是“自”。, zh-Hant: 最古老的「自」是一個鼻子，它就是「鼻」最早的寫法，今天「鼻」的上面還是「自」。 }
  turn: { en: 'Later it was borrowed for its sound to mean oneself, and today the nose is written 鼻.', zh-Hans: 后来它被借用读音，表示自己；今天的鼻子就写成“鼻”了。, zh-Hant: 後來它被借用讀音，表示自己；今天的鼻子就寫成「鼻」了。 }
  closer: { en: "A nose picture borrowed to mean me, myself: that's 自! Put 自 and 己 together and you get 自己.", zh-Hans: 鼻子的图画被借来表示自己，这就是“自”！“自”和“己”合起来，就是“自己”。, zh-Hant: 鼻子的圖畫被借來表示自己，這就是「自」！「自」和「己」合起來，就是「自己」。 }
