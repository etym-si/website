id: 叫
text: { Hans: 叫, Hant: 叫 }
readings: { pinyin: jiào }
meaning: { en: to call; to be called, zh-Hans: 叫做, zh-Hant: 叫做 }
fact:
  en: 叫 has 口 (mouth) on the left for meaning and 丩 on the right for sound. The Shuowen dictionary says it first meant 'to shout'.
  zh-Hans: “叫”左边的“口”表示意思，右边的“丩”表示读音。《说文解字》说，它最早的意思是“大声呼喊”。
  zh-Hant: 「叫」左邊的「口」表示意思，右邊的「丩」表示讀音。《說文解字》說，它最早的意思是「大聲呼喊」。
story:
  topic: { en: The Kitten on the Bookshelf, zh-Hans: 书架上的小猫, zh-Hant: 書架上的小貓 }
  hook: { en: "Meow, meow! The kitten on top of the bookshelf calls and calls: she's too scared to jump down!", zh-Hans: 喵，喵！书架顶上的小猫叫个不停，原来它不敢跳下来了！, zh-Hant: 喵，喵！書架頂上的小貓叫個不停，原來牠不敢跳下來了！ }
  closer: { en: 'Cats meow, roosters crow, and you say 我叫… for your name: calling out and naming are both 叫!', zh-Hans: 小猫喵喵叫，公鸡喔喔叫，你说“我叫……”的时候，也用“叫”！, zh-Hant: 小貓喵喵叫，公雞喔喔叫，你說「我叫……」的時候，也用「叫」！ }
