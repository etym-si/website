id: 脸
text: { Hans: 脸, Hant: 臉 }
readings: { pinyin: liǎn }
meaning: { en: face, zh-Hans: 笑脸, zh-Hant: 笑臉 }
fact:
  en: 脸 (臉) has ⺼, a sign for body parts, on the left and 佥 (僉) on the right for sound. In old-style writing, 脸 can mean just the cheek.
  zh-Hans: “脸”左边的“月（肉）”表示身体部位，右边的“佥”表示读音。在文言里，“脸”也可以只指脸颊。
  zh-Hant: 「臉」左邊的「月（肉）」表示身體部位，右邊的「僉」表示讀音。在文言裡，「臉」也可以只指臉頰。
story:
  topic: { en: Silly Faces in the Mirror, zh-Hans: 对着镜子做鬼脸, zh-Hant: 對著鏡子扮鬼臉 }
  hook: { en: 'Silly-face time! Yaya puffs out her cheeks, crosses her eyes and sticks out her tongue at the mirror.', zh-Hans: 做鬼脸啦！丫丫对着镜子鼓起腮帮子、斗鸡眼，还吐出了舌头。, zh-Hant: 扮鬼臉囉！丫丫對著鏡子鼓起腮幫子、鬥雞眼，還吐出了舌頭。 }
  closer: { en: "Happy face, sleepy face, silly face: they're all 脸 (臉)!", zh-Hans: 开心的脸、困困的脸、调皮的鬼脸，都是“脸”！, zh-Hant: 開心的臉、睏睏的臉、調皮的鬼臉，都是「臉」！ }
journey: []
origin:
  type: phono-semantic
  parts:
    - { char: ⺼, role: meaning, gloss: { en: body part, zh-Hans: 身体部位, zh-Hant: 身體部位 } }
    - { char: 僉, role: sound }
status: draft
