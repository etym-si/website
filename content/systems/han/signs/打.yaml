id: 打
text: { Hans: 打, Hant: 打 }
readings: { pinyin: dǎ }
meaning: { en: to hit; to play (a ball game), zh-Hans: 打球, zh-Hant: 打球 }
fact:
  en: 打 has 扌 (hand) on the left for meaning and 丁 on the right for sound. 扌 is how 手 (hand) looks when it squeezes onto the left side.
  zh-Hans: “打”左边的“扌”表示意思，右边的“丁”表示读音。“扌”就是“手”站到左边时的样子。
  zh-Hant: 「打」左邊的「扌」表示意思，右邊的「丁」表示讀音。「扌」就是「手」站到左邊時的樣子。
story:
  topic: { en: Grandma's Sneaky Spin, zh-Hans: 奶奶的旋转球, zh-Hant: 奶奶的旋轉球 }
  hook: { en: 'Ping, pong! The ball zips over the net, and Grandma hits it back with a sneaky spin.', zh-Hans: 乒，乓！小球飞过球网，奶奶一拍打回去，还带着旋转呢！, zh-Hant: 乒，乓！小球飛過球網，奶奶一拍打回去，還帶著旋轉呢！ }
  closer: { en: 'Hit a ball, beat a drum, make a phone call: a hand 扌 and 丁 make 打!', zh-Hans: 打球、打鼓、打电话，手“扌”加上“丁”，就是“打”！, zh-Hant: 打球、打鼓、打電話，手「扌」加上「丁」，就是「打」！ }
