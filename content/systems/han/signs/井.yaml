id: 井
text: { Hans: 井, Hant: 井 }
readings: { pinyin: jǐng }
meaning: { en: well, zh-Hans: 水井, zh-Hant: 水井 }
fact:
  en: Many scholars see 井 as a square well, with supports framing all four sides. Others think it was first used to write 形 (shape) and 型 (mold).
  zh-Hans: 很多学者认为，“井”画的是一口方方的井，四边都有支架。也有学者认为，它是“形”和“型”最早的写法。
  zh-Hant: 很多學者認為，「井」畫的是一口方方的井，四邊都有支架。也有學者認為，它是「形」和「型」最早的寫法。
story:
  topic: { en: Water from the Old Well, zh-Hans: 老井打水, zh-Hant: 老井打水 }
  hook: { en: 'Creak, creak! You crank the handle and pull a bucket of cool, fresh water up from the old well.', zh-Hans: 吱扭吱扭！你摇着把手，从老井里提上来一桶清凉的井水。, zh-Hant: 吱扭吱扭！你搖著把手，從老井裡提上來一桶清涼的井水。 }
  early: { en: 'Some old forms of 井 even have a stone inside the well, like 丼.', zh-Hans: 有些古老的“井”字，井里还有一块石头，就像“丼”。, zh-Hant: 有些古老的「井」字，井裡還有一塊石頭，就像「丼」。 }
  closer: { en: 'Four supports around a square opening: that is 井, a well — as in 水井!', zh-Hans: 方方的井口，四边围着支架：这就是水井的“井”！, zh-Hant: 方方的井口，四邊圍著支架：這就是水井的「井」！ }
journey: default
origin:
  type: pictogram
status: draft
sources:
