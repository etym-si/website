id: 才
text: { Hans: 才, Hant: 才 }
readings: { pinyin: cái }
meaning: { en: 'talent, ability', zh-Hans: 天才, zh-Hant: 天才 }
fact:
  en: 才 was first a picture of a sharp peg. Very early on it was borrowed for its sound to mean talent, as in 天才 (genius).
  zh-Hans: “才”最早画的是一根尖尖的小桩子。很早以前，它就被借用读音，表示才能，比如“天才”。
  zh-Hant: 「才」最早畫的是一根尖尖的小樁子。很早以前，它就被借用讀音，表示才能，比如「天才」。
story:
  topic: { en: The School Talent Show, zh-Hans: 学校才艺表演, zh-Hant: 學校才藝表演 }
  hook: { en: 'At the school talent show, Lily juggles three oranges and the whole hall cheers.', zh-Hans: 学校才艺表演上，莉莉一口气抛起三个橘子，全场都欢呼起来。, zh-Hant: 學校才藝表演上，莉莉一口氣拋起三顆橘子，全場都歡呼起來。 }
  early: { en: 'The oldest 才 is a sharp peg, the same as 弋. An old dictionary thought it was a sprout poking up from the ground, but that was a mistake.', zh-Hans: 最古老的“才”是一根尖尖的小桩子，和“弋”是同一个字。一本古老的字典以为它是从地里冒出来的嫩芽，不过那是弄错了。, zh-Hant: 最古老的「才」是一根尖尖的小樁子，和「弋」是同一個字。一本古老的字典以為它是從地裡冒出來的嫩芽，不過那是弄錯了。 }
  closer: { en: "A sharp little peg borrowed to mean talent: that's 才, as in 天才!", zh-Hans: 一根尖尖的小桩子，借来表示才能，这就是天才的“才”！, zh-Hant: 一根尖尖的小樁子，借來表示才能，這就是天才的「才」！ }
