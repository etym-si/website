  closer: { en: 'Big is 大; add one dot and you get 太: too big, too funny, 太好了!', zh-Hans: “大”加一点就是“太”：太大了！太好笑了！太好了！, zh-Hant: 「大」加一點就是「太」：太大了！太好笑了！太好了！ }
