# yaml-language-server: $schema=../../../_schema/sign.schema.json
id: 门
status: reviewed
text: { Hans: 门, Hant: 門 }
readings: { pinyin: mén }
meaning: { en: gate, zh-Hans: 大门, zh-Hant: 大門 }
fact:
  en: 門 is a picture of a gate with two doors. The simplified 门 comes from a quick, flowing way of writing it.
  zh-Hans: “門”画的是一扇有两块门板的大门。简化字“门”来自它快速连笔的写法。
  zh-Hant: 「門」畫的是一扇有兩塊門板的大門。簡化字「门」來自它快速連筆的寫法。
story:
  topic: { en: Swing Open the Double Gate, zh-Hans: 推开两扇木大门, zh-Hant: 推開兩扇木大門 }
  hook:
    en: Creak… We reach the front courtyard! Two tall wooden door-leaves hang on side posts, ready to swing open.
    zh-Hans: 吱呀——走到自家院子前啦！两扇高大的木门挂在左右的门柱上，正等着我们推开。
    zh-Hant: 吱呀——走到自家院子前啦！兩扇高大的木門掛在左右的門柱上，正等著我們推開。
  turn:
    en: "Look at the Hu ding bronze rubbing: 門 has two tall side posts and two paneled doors facing each other."
    zh-Hans: 看曶鼎青铜拓片上的“門”：左右两根长长的门柱，中间两扇带方格的门板面对面合拢。
    zh-Hant: 看曶鼎青銅拓片上的「門」：左右兩根長長的門柱，中間兩扇帶方格的門板面對面合攏。
  closer:
    en: Traditional 門 still shows both swinging doors, while simplified 门 traces the whole doorway in three quick strokes!
    zh-Hans: 繁体“門”依然画着对称的两扇门板，简体“门”则吸收了草书连笔，三笔就勾出了门框！
    zh-Hant: 繁體「門」依然畫著對稱的兩扇門板，簡體「门」則吸收了草書連筆，三筆就勾出了門框！
