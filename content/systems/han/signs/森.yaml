id: 森
text: { Hans: 森, Hant: 森 }
readings: { pinyin: sēn }
meaning: { en: thick forest, zh-Hans: 森林, zh-Hant: 森林 }
fact:
  en: 森 is three trees 木 stacked together. Three is a way of saying “lots”, so 森 is a forest packed with trees.
  zh-Hans: “森”是三个“木”叠在一起。三表示“很多”，所以“森”就是长满大树的森林。
  zh-Hant: 「森」是三個「木」疊在一起。三表示「很多」，所以「森」就是長滿大樹的森林。
story:
  topic: { en: Deep in the Forest, zh-Hans: 森林深处, zh-Hant: 森林深處 }
  hook: { en: 'Crunch, crunch! Deep in the forest, the trees grow so close together that sunlight can barely peek through.', zh-Hans: 沙沙，沙沙！走进森林深处，大树一棵挨着一棵，阳光都快照不进来了。, zh-Hant: 沙沙，沙沙！走進森林深處，大樹一棵挨著一棵，陽光都快照不進來了。 }
  closer: { en: "So many trees squeezed together that one picture needs three: that's 森, the thick forest!", zh-Hans: 大树多得要画三棵才够——这就是茂密森林的“森”！, zh-Hant: 大樹多得要畫三棵才夠——這就是茂密森林的「森」！ }
