id: 考
text: { Hans: 考, Hant: 考 }
readings: { pinyin: kǎo }
meaning: { en: 'to test, to examine', zh-Hans: 考试, zh-Hant: 考試 }
fact:
  en: '考 and 老 are close cousins: both picture an old man with long hair, bent over. In 考, he leans on a walking cane 丂.'
  zh-Hans: “考”和“老”是一对近亲：都画着一位长头发、弯着腰的老人。在“考”里，老人拄着一根拐杖“丂”。
  zh-Hant: 「考」和「老」是一對近親：都畫著一位長頭髮、彎著腰的老人。在「考」裡，老人拄著一根拐杖「丂」。
story:
  topic: { en: The Quiet Math Quiz, zh-Hans: 安静的数学小测验, zh-Hant: 安靜的數學小考 }
  hook: { en: Pencils ready! The classroom goes quiet as everyone flips over the math quiz., zh-Hans: 拿好铅笔！教室里一下子安静下来，大家翻开了数学小测验。, zh-Hant: 拿好鉛筆！教室裡一下子安靜下來，大家翻開了數學小考。 }
  turn: { en: 'At first the cane was drawn like 匕, just like the bottom of 老. Later 考 got its own cane shape, 丂.', zh-Hans: 一开始，拐杖画得像“匕”，跟“老”字下面一样。后来，“考”才有了自己的拐杖“丂”。, zh-Hant: 一開始，拐杖畫得像「匕」，跟「老」字下面一樣。後來，「考」才有了自己的拐杖「丂」。 }
  closer: { en: '考 started as an old man with a cane, and today it means to test: good luck on your 考试!', zh-Hans: “考”原来是拄着拐杖的老人，今天它是考试的“考”，祝你考出好成绩！, zh-Hant: 「考」原來是拄著拐杖的老人，今天它是考試的「考」，祝你考出好成績！ }
journey: default
origin:
  type: compound-ideogram
  parts:
    - { char: 耂, role: meaning, gloss: { en: old man with long hair, zh-Hans: 长发老人, zh-Hant: 長髮老人 } }
    - { char: 丂, role: meaning, gloss: { en: walking cane, zh-Hans: 拐杖, zh-Hant: 拐杖 } }
