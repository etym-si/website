id: 男
text: { Hans: 男, Hant: 男 }
readings: { pinyin: nán }
meaning: { en: 'man, boy, male', zh-Hans: 男孩, zh-Hant: 男孩 }
fact:
  en: '男 has 田 (a field) on top and 力 (strength) below: someone using his strength to work in the fields.'
  zh-Hans: “男”上面是“田”（田地），下面是“力”（力气）：在田里出力气干活的人。
  zh-Hant: 「男」上面是「田」（田地），下面是「力」（力氣）：在田裡出力氣做工的人。
story:
  topic: { en: Bo Waters the Bean Field, zh-Hans: 小波去浇地, zh-Hant: 小波去澆地 }
  hook: { en: 'Slosh, slosh! Bo carries two heavy buckets of water across the field to the thirsty bean plants.', zh-Hans: 咣当，咣当！小波提着两桶沉甸甸的水，穿过田地去浇口渴的豆苗。, zh-Hant: 哐噹，哐噹！小波提著兩桶沉甸甸的水，穿過田地去澆口渴的豆苗。 }
  closer: { en: "Field 田 plus strength 力: that's 男, a man or a boy!", zh-Hans: “田”加上“力”，就是男孩的“男”！, zh-Hant: 「田」加上「力」，就是男孩的「男」！ }
journey: default
origin:
  type: compound-ideogram
  parts:
