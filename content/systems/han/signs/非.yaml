id: 非
text: { Hans: 非, Hant: 非 }
readings: { pinyin: fēi }
meaning: { en: not; wrong, zh-Hans: 是非, zh-Hant: 是非 }
fact:
  en: 非 is a picture of two wings spread in opposite directions. Today it means not.
  zh-Hans: “非”画的是一对朝着相反方向张开的翅膀。今天它表示“不是”。
  zh-Hant: 「非」畫的是一對朝著相反方向張開的翅膀。今天它表示「不是」。
story:
  topic: { en: 'Not This, Not That', zh-Hans: 不是这个，也不是那个, zh-Hant: 不是這個，也不是那個 }
  hook: { en: "Guess what's in the box: is it a fish? No, and it's not a bird either!", zh-Hans: 猜猜看：盒子里的东西是鱼吗？不是，也不是鸟！, zh-Hant: 猜猜看：盒子裡的東西是魚嗎？不是，也不是鳥！ }
  early: { en: 'The oldest 非 shows a pair of wings, one pointing one way and one the other.', zh-Hans: 最古老的“非”画的是一对翅膀，一只朝这边，一只朝那边。, zh-Hant: 最古老的「非」畫的是一對翅膀，一隻朝這邊，一隻朝那邊。 }
  turn: { en: 'An old dictionary says its meaning shifted to leaving or disobeying; later, perhaps borrowed for its sound, it came to mean not.', zh-Hans: 一本古老的字典说，它的意思后来变成了离开、违背；再后来，它可能是被借用了读音，有了“不是”的意思。, zh-Hant: 一本古老的字典說，它的意思後來變成了離開、違背；再後來，它可能是被借用了讀音，有了「不是」的意思。 }
  closer: { en: "Two wings pointing away from each other: that's 非, not!", zh-Hans: 两只翅膀背对背张开，这就是“非”，也就是“不是”！, zh-Hant: 兩隻翅膀背對背張開，這就是「非」，也就是「不是」！ }
