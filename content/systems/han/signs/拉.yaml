id: 拉
text: { Hans: 拉, Hant: 拉 }
readings: { pinyin: lā }
meaning: { en: to pull, zh-Hans: 拉链, zh-Hant: 拉鍊 }
fact:
  en: 拉 has 扌 (a hand, 手) on the left for meaning and 立 on the right for sound.
  zh-Hans: “拉”左边的“扌”（手）表示意思，右边的“立”表示读音。
  zh-Hant: 「拉」左邊的「扌」（手）表示意思，右邊的「立」表示讀音。
story:
  topic: { en: 'Come On, Peanut!', zh-Hans: 走啦，花生！, zh-Hant: 走啦，花生！ }
  hook: { en: "Come on, Peanut! Leilei pulls on the leash, but the puppy plops down and won't take a single step.", zh-Hans: 走啦，花生！蕾蕾拉着狗绳，可是小狗一屁股坐下，怎么也不肯走。, zh-Hant: 走啦，花生！蕾蕾拉著狗繩，可是小狗一屁股坐下，怎麼也不肯走。 }
  closer: { en: "Pull it toward you: that's 拉! Leashes, ropes and 拉链 (zippers) all get a 拉.", zh-Hans: 往自己这边用力，就是“拉”！拉狗绳、拉拉链，都用“拉”！, zh-Hant: 往自己這邊用力，就是「拉」！拉狗繩、拉拉鍊，都用「拉」！ }
journey: default
origin:
  type: phono-semantic
  parts:
    - { char: 手, role: meaning, gloss: { en: hand, zh-Hans: 手, zh-Hant: 手 } }
    - { char: 立, role: sound }
