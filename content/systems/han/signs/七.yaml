id: 七
text: { Hans: 七, Hant: 七 }
readings: { pinyin: qī }
meaning: { en: seven, zh-Hans: 七彩, zh-Hant: 七彩 }
fact:
  en: '七 was first a cross: one vertical and one horizontal stroke cutting through each other. It is the original character for 切, to cut.'
  zh-Hans: “七”最早是一个十字：一竖一横互相切开。它是“切”最早的写法。
  zh-Hant: 「七」最早是一個十字：一豎一橫互相切開。它是「切」最早的寫法。
story:
  topic: { en: Seven Notes on the Xylophone, zh-Hans: 木琴上的七个音, zh-Hant: 木琴上的七個音 }
  hook: { en: 'Do, re, mi, fa, sol, la, ti! You tap all seven notes on your little xylophone.', zh-Hans: 哆、来、咪、发、嗦、啦、西！你在小木琴上敲出了全部七个音。, zh-Hant: Do、Re、Mi、Fa、Sol、La、Si！你在小木琴上敲出了全部七個音。 }
  early: { en: The oldest 七 is a vertical stroke and a horizontal stroke crossing right through each other., zh-Hans: 最古老的“七”是一竖和一横，正好从中间互相穿过。, zh-Hant: 最古老的「七」是一豎和一橫，正好從中間互相穿過。 }
  closer: { en: "Write the flat stroke first, then one long stroke down and sweeping right: that's 七, seven!", zh-Hans: 先写一横，再一笔往下、往右拐，这就是“七”！, zh-Hant: 先寫一橫，再一筆往下、往右拐，這就是「七」！ }
journey: default
origin:
