id: 忙
text: { Hans: 忙, Hant: 忙 }
readings: { pinyin: máng }
meaning: { en: busy, zh-Hans: 忙碌, zh-Hant: 忙碌 }
fact:
  en: '忙 has the heart part 忄 (心) on the left for the meaning and 亡 on the right for the sound. Put 亡 on top of 心 instead and you get 忘 (to forget): the two are related words!'
  zh-Hans: “忙”左边的“忄”就是“心”，表示意思；右边的“亡”表示读音。把“亡”放到“心”上面，就成了“忘”——它们是一对亲戚字！
  zh-Hant: 「忙」左邊的「忄」就是「心」，表示意思；右邊的「亡」表示讀音。把「亡」放到「心」上面，就成了「忘」——它們是一對親戚字！
story:
  topic: { en: The Busy Bees, zh-Hans: 忙碌的小蜜蜂, zh-Hant: 忙碌的小蜜蜂 }
  hook: { en: "Buzz, buzz! From sunrise to sunset, the little bees zip from flower to flower without a moment's rest.", zh-Hans: 嗡——嗡——！从早到晚，小蜜蜂在花丛中飞来飞去，一刻也不停。, zh-Hant: 嗡——嗡——！從早到晚，小蜜蜂在花叢中飛來飛去，一刻也不停。 }
  closer: { en: "忄 on the left, 亡 on the right: that's 忙, busy as a bee!", zh-Hans: 左边“忄”，右边“亡”，这就是像小蜜蜂一样忙碌的“忙”！, zh-Hant: 左邊「忄」，右邊「亡」，這就是像小蜜蜂一樣忙碌的「忙」！ }
