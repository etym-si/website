# yaml-language-server: $schema=../../../_schema/sign.schema.json
id: 鸟
status: reviewed
text: { Hans: 鸟, Hant: 鳥 }
readings: { pinyin: niǎo }
meaning: { en: bird, zh-Hans: 小鸟, zh-Hant: 小鳥 }
fact:
  en: Find the beak, the eye, the wing and the tail! The ancient 鸟 is a bird standing sideways.
  zh-Hans: 找一找鸟嘴、眼睛、翅膀和尾巴！古代的“鸟”是一只侧身站着的小鸟。
  zh-Hant: 找一找鳥嘴、眼睛、翅膀和尾巴！古代的「鳥」是一隻側身站著的小鳥。
story:
  topic: { en: The Songbird on the Branch, zh-Hans: 枝头唱歌的小鸟, zh-Hant: 枝頭唱歌的小鳥 }
  hook:
    en: Chirp, chirp! A little songbird perches sideways so you can see its pointed beak, round eye, folded wing, and tail feathers.
    zh-Hans: 叽叽喳喳！一只小鸟侧身站在枝头，尖尖的嘴、圆圆的眼、收起的翅膀和翘起的尾羽全都看得清清楚楚。
    zh-Hant: 嘰嘰喳喳！一隻小鳥側身站在枝頭，尖尖的嘴、圓圓的眼、收起的翅膀和翹起的尾羽全都看得清清楚楚。
  early:
    en: In oracle bone and bronze scripts, the bird stands proudly with its crest raised and claws gripping tight.
    zh-Hans: 在甲骨文和金文里，小鸟昂着头冠，小爪子稳稳地抓着树枝。
    zh-Hant: 在甲骨文和金文裡，小鳥昂著頭冠，小爪子穩穩地抓著樹枝。
  turn:
    en: In regular script 鳥, the eye became a dot inside the head, and the four little strokes at the bottom show its tail feathers and claws.
    zh-Hans: 到了楷书“鳥”，眼睛变成了头里的一点，底下的四个点则是它的尾羽和爪子。
    zh-Hant: 到了楷書「鳥」，眼睛變成了頭裡的一點，底下的四個點則是它的尾羽和爪子。
  closer:
    en: Whether written 鳥 or simplified 鸟, that little dot in the head is still the bird’s bright eye!
    zh-Hans: 不管是繁体的“鳥”还是简体的“鸟”，脑袋里那一点，依然是小鸟亮晶晶的眼睛！
    zh-Hant: 不管是繁體的「鳥」還是簡體的「鳥」，腦袋裡那一點，依然是小鳥亮晶晶的眼睛！
