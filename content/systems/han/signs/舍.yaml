id: 舍
status: reviewed
text: { Hans: 舍, Hant: 舍 }
readings: { pinyin: shè }
meaning: { en: hut, zh-Hans: 房舍, zh-Hant: 房舍 }
fact:
  en: "舍 is a simple hut: a pointed roof on top, a post in the middle and a base below."
  zh-Hans: “舍”是一座简单的小屋：上面是尖尖的屋顶，中间是柱子，下面是地基。
  zh-Hant: 「舍」是一座簡單的小屋：上面是尖尖的屋頂，中間是柱子，下面是地基。
story:
  topic: { en: A Cozy Thatched Hut, zh-Hans: 尖顶休憩的小屋, zh-Hant: 尖頂休憩的小屋 }
  hook:
    en: Safe and sound! At the edge of the field stands a welcoming cottage with a peaked roof, a center post, and a raised floor.
    zh-Hans: 安全啦！田边立着一座温暖的小屋：上面是遮风挡雨的尖屋顶，中间是立柱，下面是地基。
    zh-Hant: 安全啦！田邊立著一座溫暖的小屋：上面是遮風擋雨的尖屋頂，中間是立柱，下面是地基。
  turn:
    en: From bronze vessels to the monk Zhiyong’s 1,400-year-old calligraphy scroll, 舍 kept its pointed roof 人 on top and square room 口 at the base.
    zh-Hans: 从青铜器一直到1400年前智永禅师写的《千字文》，“舍”始终顶着尖屋顶、立在方地基上。
    zh-Hant: 從青銅器一直到1400年前智永禪師寫的《千字文》，「舍」始終頂著尖屋頂、立在方地基上。
  closer:
    en: "Pointed roof on top, pillar in the middle, room below: that is 舍, a house to rest in!"
    zh-Hans: 上面人字屋顶，中间支柱，下面方屋：这就是供人歇息的“舍”！
    zh-Hant: 上面人字屋頂，中間支柱，下面方屋：這就是供人歇息的「舍」！
journey: [ bronze, seal ]
