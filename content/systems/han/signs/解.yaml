id: 解
text: { Hans: 解, Hant: 解 }
readings: { pinyin: jiě }
meaning: { en: 'to untie, to solve', zh-Hans: 解开, zh-Hant: 解開 }
fact:
  en: '解 is a horn 角, a knife 刀 and a cow 牛: a knife separating the horn from a cow, to cut up an ox.'
  zh-Hans: “解”由“角”（牛角）、“刀”和“牛”组成：用刀把牛角从牛身上分开。
  zh-Hant: 「解」由「角」（牛角）、「刀」和「牛」組成：用刀把牛角從牛身上分開。
story:
  topic: { en: The Tricky Knot, zh-Hans: 解开绳结, zh-Hant: 解開繩結 }
  hook: { en: What a tricky knot! Nell picks at the balloon string bit by bit until it finally comes loose., zh-Hans: 这个结好难解！小奈一点一点地抠，终于把气球绳上的结解开了。, zh-Hant: 這個結好難解！小奈一點一點地摳，終於把氣球繩上的結解開了。 }
  closer: { en: "Horn 角, knife 刀 and cow 牛 take things apart: that's 解, to untie and to solve!", zh-Hans: “角”“刀”“牛”合在一起，把东西分开——这就是解开的“解”！, zh-Hant: 「角」「刀」「牛」合在一起，把東西分開——這就是解開的「解」！ }
journey: default
origin:
  type: compound-ideogram
  parts:
    - { char: 角, role: meaning, gloss: { en: horn, zh-Hans: 牛角, zh-Hant: 牛角 } }
    - { char: 刀, role: meaning, gloss: { en: knife, zh-Hans: 刀子, zh-Hant: 刀子 } }
    - { char: 牛, role: meaning, gloss: { en: cow, zh-Hans: 牛, zh-Hant: 牛 } }
