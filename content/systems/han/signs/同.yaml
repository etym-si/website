id: 同
text: { Hans: 同, Hant: 同 }
readings: { pinyin: tóng }
meaning: { en: same; together, zh-Hans: 同学, zh-Hant: 同學 }
fact:
  en: 同 started out as a picture of a pipe, the old form of 筒 (tube). Today it means the same or together, as in 同学 (classmate).
  zh-Hans: “同”最早画的是一根管子，是“筒”的古老写法。今天它表示相同、一起，比如“同学”。
  zh-Hant: 「同」最早畫的是一根管子，是「筒」的古老寫法。今天它表示相同、一起，比如「同學」。
story:
  topic: { en: 'Same Raincoat, Same Smile', zh-Hans: 一样的雨衣, zh-Hant: 一樣的雨衣 }
  hook: { en: Ha! You and your best friend show up at school wearing the exact same yellow raincoat., zh-Hans: 哈哈！你和好朋友竟然穿着一模一样的黄雨衣来上学。, zh-Hant: 哈哈！你和好朋友竟然穿著一模一樣的黃雨衣來上學。 }
  early: { en: 'The oldest 同 is a picture of a pipe. You can still find 同 inside 筒, the character for a tube.', zh-Hans: 最古老的“同”画的是一根管子。今天在“筒”字里，还能找到它。, zh-Hant: 最古老的「同」畫的是一根管子。今天在「筒」字裡，還能找到它。 }
  closer: { en: "Same coat, same class, same giggle: that's 同, the same!", zh-Hans: 一样的雨衣，一样的班级，一样的笑声，这就是相同的“同”！, zh-Hant: 一樣的雨衣，一樣的班級，一樣的笑聲，這就是相同的「同」！ }
journey: default
