id: 卖
text: { Hans: 卖, Hant: 賣 }
readings: { pinyin: mài }
meaning: { en: to sell, zh-Hans: 卖东西, zh-Hant: 賣東西 }
fact:
  en: 卖 (賣) was built from 出, 'to go out', and 買, 'to buy', which also gave the sound. When you sell, your things go out to the buyer!
  zh-Hans: “卖”的繁体字“賣”由“出”（出去）和“買”（买）组成，“買”还表示读音。卖东西，就是让东西从你手里出去！
  zh-Hant: 「賣」由「出」（出去）和「買」（購買）組成，「買」還表示讀音。賣東西，就是讓東西從你手裡出去！
story:
  topic: { en: The School Bake Sale, zh-Hans: 学校义卖会, zh-Hant: 學校義賣會 }
  hook: { en: 'Cupcakes for sale! At the school bake sale, a boy hands a cupcake to a customer and drops her coin into the jar.', zh-Hans: 卖蛋糕啦！学校义卖会上，小男孩把一个纸杯蛋糕递给客人，再把硬币丢进罐子里。, zh-Hant: 賣蛋糕囉！學校義賣會上，小男孩把一個杯子蛋糕遞給客人，再把硬幣丟進罐子裡。 }
  turn: { en: 'Later the 出 on top shrank into 士, which has nothing to do with going out. Simplified 卖 also writes its 買 part as 买.', zh-Hans: 后来，上面的“出”简化成了毫不相干的“士”。简化字“卖”又把下面的“買”写成了“买”。, zh-Hant: 後來，上面的「出」簡化成了毫不相干的「士」。簡化字則把下面的「買」也一起簡化了。 }
  closer: { en: "买 is to buy, 卖 is to sell: the extra piece on top of 卖 (賣) once meant 'go out'!", zh-Hans: “买”是买进来，“卖”是卖出去：“卖”头上多出来的那部分，原来就是“出”！, zh-Hant: 「買」是買進來，「賣」是賣出去：「賣」頭上多出來的那部分，原來就是「出」！ }
journey: default
origin:
