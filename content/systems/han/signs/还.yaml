id: 还
text: { Hans: 还, Hant: 還 }
readings: { pinyin: hái }
meaning: { en: still; also, zh-Hans: 还有, zh-Hant: 還有 }
fact:
  en: 還 (还) has the walking part 辶 for the meaning and 睘 for the sound, and it was built to mean 'to go back'. Read huán, it still means to return; read hái, it means 'still' or 'also'.
  zh-Hans: 繁体字里，“辶”表示走路，“睘”表示读音，本来是“回去”的意思。读 huán 时是“归还”的意思，读 hái 时表示“仍然”或者“也”。
  zh-Hant: 「還」的「辶」表示走路，「睘」表示讀音，本來是「回去」的意思。讀 huán 時是「歸還」的意思，讀 hái 時表示「仍然」或者「也」。
story:
  topic: { en: Is the Snowman Still There?, zh-Hans: 雪人还在吗？, zh-Hant: 雪人還在嗎？ }
  hook: { en: 'First thing in the morning, Anna runs to the window. Is her snowman still standing in the yard?', zh-Hans: 一大早，安娜就跑到窗前：她堆的雪人还站在院子里吗？, zh-Hant: 一大早，安娜就跑到窗前：她堆的雪人還站在院子裡嗎？ }
  closer: { en: "Yes, he's still there, carrot nose and all! 还 (hái) means still or also, and read huán it means to give back.", zh-Hans: 还在！连胡萝卜鼻子也还在。“还”读 hái 是“仍然、还有”，读 huán 就是“归还”。, zh-Hant: 還在！連紅蘿蔔鼻子也還在。「還」讀 hái 是「仍然、還有」，讀 huán 就是「歸還」。 }
journey: default
origin:
