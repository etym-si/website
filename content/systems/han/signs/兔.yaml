id: 兔
text: { Hans: 兔, Hant: 兔 }
readings: { pinyin: tù }
meaning: { en: rabbit, zh-Hans: 兔子, zh-Hant: 兔子 }
fact:
  en: 兔 began as a picture of a rabbit, and it still means rabbit or hare today.
  zh-Hans: “兔”最早就是一只兔子的图画，今天它的意思还是兔子。
  zh-Hant: 「兔」最早就是一隻兔子的圖畫，今天它的意思還是兔子。
story:
  topic: { en: The Carrot Nibbler, zh-Hans: 啃胡萝卜的小白兔, zh-Hant: 啃紅蘿蔔的小白兔 }
  hook: { en: 'Hop, hop, stop! A white rabbit pauses in the garden, twitches its nose and nibbles a carrot.', zh-Hans: 蹦蹦跳跳，停！一只小白兔在菜园里停下来，动动鼻子，啃起了胡萝卜。, zh-Hant: 蹦蹦跳跳，停！一隻小白兔在菜園裡停下來，動動鼻子，啃起了紅蘿蔔。 }
  closer: { en: 'Long ears and a quick hop: that is 兔, as in 兔子!', zh-Hans: 长长的耳朵，轻快地一蹦：这就是兔子的“兔”！, zh-Hant: 長長的耳朵，輕快地一蹦：這就是兔子的「兔」！ }
journey: default
origin:
  type: pictogram
status: draft
sources:
