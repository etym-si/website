id: 来
text: { Hans: 来, Hant: 來 }
readings: { pinyin: lái }
meaning: { en: to come, zh-Hans: 过来, zh-Hant: 過來 }
fact:
  en: 来 (來) began as a picture of wheat. It was already borrowed to mean to come on the oracle bones.
  zh-Hans: “来”最早画的是一株小麦。在甲骨文里，它就已经被借来表示“来”。
  zh-Hant: 「來」最早畫的是一株小麥。在甲骨文裡，它就已經被借來表示「來」。
story:
  topic: { en: Come Over and Play!, zh-Hans: 快过来玩！, zh-Hant: 快過來玩！ }
  hook: { en: 'Knock, knock! Your best friend waves from the gate and calls, ‘Come over and play!’', zh-Hans: 咚咚咚！好朋友在门口向你招手，大声喊：“快过来玩！”, zh-Hant: 咚咚咚！好朋友在門口向你招手，大聲喊：「快過來玩！」 }
  early: { en: 'In the oldest form of 来, the middle line is the ear of wheat, the two lines pointing up are leaves, and the lines pointing down are the stem and roots.', zh-Hans: 在最古老的“来”里，中间那一笔是麦穗，向上的两笔是叶子，向下的几笔是茎和根。, zh-Hant: 在最古老的「來」裡，中間那一筆是麥穗，向上的兩筆是葉子，向下的幾筆是莖和根。 }
  turn: { en: "To tell the two meanings apart, writers sometimes added a foot (止) to come, but the extra part didn't stick.", zh-Hans: 为了把两个意思分开，古人有时会给“来”加上表示脚的“止”，不过这个部件后来没有留下来。, zh-Hant: 為了把兩個意思分開，古人有時會給「來」加上表示腳的「止」，不過這個部件後來沒有留下來。 }
  closer: { en: "A stalk of wheat that now means come here: that's 来 (來)!", zh-Hans: 一株麦子，后来表示“过来”，这就是“来”！, zh-Hant: 一株麥子，後來表示「過來」，這就是「來」！ }
