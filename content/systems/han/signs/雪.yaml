id: 雪
text: { Hans: 雪, Hant: 雪 }
readings: { pinyin: xuě }
meaning: { en: snow, zh-Hans: 雪花, zh-Hant: 雪花 }
fact:
  en: '雪 is an ancient shortened form of 䨮: 雨 (rain) on top for meaning and 彗 below for sound. Today only the bottom of 彗 is left under the 雨.'
  zh-Hans: “雪”是古人对“䨮”的简写：上面的“雨”表示意思，下面的“彗”表示读音。今天的“雪”只留下了“彗”最下面的一部分。
  zh-Hant: 「雪」是古人對「䨮」的簡寫：上面的「雨」表示意思，下面的「彗」表示讀音。今天的「雪」只留下了「彗」最下面的一部分。
story:
  topic: { en: Snowball Fight!, zh-Hans: 打雪仗！, zh-Hant: 打雪仗！ }
  hook: { en: "Whoosh, splat! Tutu's snowball lands right on big brother's hat, and snow sprinkles everywhere.", zh-Hans: 嗖——啪！图图的雪球正好打中了哥哥的帽子，雪花撒了一地。, zh-Hant: 咻——啪！圖圖的雪球正好打中了哥哥的帽子，雪花撒了一地。 }
  closer: { en: 'Rain on top, a little piece of 彗 below: soft white 雪, snow!', zh-Hans: 上面是“雨”，下面是一小截“彗”，轻飘飘、白茫茫，这就是“雪”！, zh-Hant: 上面是「雨」，下面是一小截「彗」，輕飄飄、白茫茫，這就是「雪」！ }
