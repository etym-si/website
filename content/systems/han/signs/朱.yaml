id: 朱
text: { Hans: 朱, Hant: 朱 }
readings: { pinyin: zhū }
meaning: { en: 'bright red, vermilion', zh-Hans: 朱红, zh-Hant: 朱紅 }
fact:
  en: 朱 is a tree 木 with a dot-like mark in the middle, pointing to the tree's core. Today it means a bright red color.
  zh-Hans: “朱”是在“木”的中间加了一个像点一样的记号，指出树干的中心。现在它表示鲜艳的红色。
  zh-Hant: 「朱」是在「木」的中間加了一個像點一樣的記號，指出樹幹的中心。現在它表示鮮豔的紅色。
story:
  topic: { en: Bright Red Persimmons, zh-Hans: 鲜红的柿子, zh-Hant: 鮮紅的柿子 }
  hook: { en: Look up! Bright red persimmons hang on the bare branches like a hundred little lanterns., zh-Hans: 抬头看！鲜红的柿子挂在光秃秃的树枝上，像一百盏小灯笼。, zh-Hant: 抬頭看！鮮紅的柿子掛在光禿禿的樹枝上，像一百盞小燈籠。 }
  closer: { en: 'Roots 本, tip 末, middle 朱: one tree, three pointing marks! And 朱 is the color bright red.', zh-Hans: 根是“本”，梢是“末”，中间是“朱”：一棵树，三个记号！“朱”就是朱红色的“朱”。, zh-Hant: 根是「本」，梢是「末」，中間是「朱」：一棵樹，三個記號！「朱」就是朱紅色的「朱」。 }
