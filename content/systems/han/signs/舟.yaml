id: 舟
status: reviewed
text: { Hans: 舟, Hant: 舟 }
readings: { pinyin: zhōu }
meaning: { en: boat, zh-Hans: 小船, zh-Hant: 小船 }
fact:
  en: 舟 is a small wooden boat. The lines across it are its planks.
  zh-Hans: “舟”是一条小木船，中间的横线是一块块木板。
  zh-Hant: 「舟」是一條小木船，中間的橫線是一塊塊木板。
story:
  topic: { en: The Little Wooden Boat, zh-Hans: 木板拼成的小船, zh-Hant: 木板拼成的小船 }
  hook:
    en: Push off from the shore! A narrow wooden boat glides onto the water, its curved hull held together by cross-planks.
    zh-Hans: 撑船离岸喽！一叶窄窄的小木船滑入水中，弯弯的船身中间横着几块木板。
    zh-Hant: 撐船離岸囉！一葉窄窄的小木船滑入水中，彎彎的船身中間橫著幾塊木板。
  turn:
    en: Drawn upright on bone and bronze, the boat looks like a tiny ladder with curved ends — the bow at the top and stern at the bottom.
    zh-Hans: 竖着刻在甲骨和铜器上时，小船像一架两头微翘的小梯子——船头朝上，船尾朝下。
    zh-Hant: 豎著刻在甲骨和銅器上時，小船像一架兩頭微翹的小梯子——船頭朝上，船尾朝下。
  closer:
    en: Today 舟 still keeps its arched hull and cross-ribs — and sits on the left of boat words like 船 and 航!
    zh-Hans: 今天的“舟”依然保留着船身和横木，还常常用作“船”和“航”的偏旁！
    zh-Hant: 今天的「舟」依然保留著船身和橫木，還常常用作「船」和「航」的偏旁！
journey: [ oracle, bronze, seal ]
