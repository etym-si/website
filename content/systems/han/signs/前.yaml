id: 前
text: { Hans: 前, Hant: 前 }
readings: { pinyin: qián }
meaning: { en: 'front, ahead', zh-Hans: 前面, zh-Hant: 前面 }
fact:
  en: '前 began as 歬: a foot 止 on a boat 舟, moving forward.'
  zh-Hans: “前”最早写作“歬”：小船“舟”上有一只脚“止”，一起往前进。
  zh-Hant: 「前」最早寫作「歬」：小船「舟」上有一隻腳「止」，一起往前進。
story:
  topic: { en: Front Row at the Puppet Show, zh-Hans: 木偶戏的第一排, zh-Hant: 布袋戲的第一排 }
  hook: { en: "Front row! A girl sits right at the front of the puppet show, so close she can see the puppets' painted eyelashes.", zh-Hans: 坐第一排！小女孩坐在木偶戏台的最前面，近得能看清木偶画上去的睫毛。, zh-Hant: 坐第一排！小女孩坐在布袋戲台的最前面，近得能看清戲偶畫上去的睫毛。 }
  turn: { en: "In today's 前, the foot became 䒑 on top and the boat became 月. The knife 刂 on the right comes from a form that first meant 剪, 'to cut'.", zh-Hans: 今天的“前”里，脚变成了上面的“䒑”，船变成了“月”。右边的“刂”（刀）来自一个本来表示“剪”的写法。, zh-Hant: 今天的「前」裡，腳變成了上面的「䒑」，船變成了「月」。右邊的「刂」（刀）來自一個本來表示「剪」的寫法。 }
  closer: { en: "A foot on a boat, sailing ahead: that's 前, front!", zh-Hans: 脚踏小船向前进，这就是前面的“前”！, zh-Hant: 腳踏小船向前進，這就是前面的「前」！ }
journey: default
origin:
  type: compound-ideogram
  parts:
    - { char: 止, role: meaning, gloss: { en: foot, zh-Hans: 脚, zh-Hant: 腳 } }
    - { char: 舟, role: meaning, gloss: { en: boat, zh-Hans: 小船, zh-Hant: 小船 } }
status: draft
sources:
