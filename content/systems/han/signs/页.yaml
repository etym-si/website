id: 页
text: { Hans: 页, Hant: 頁 }
readings: { pinyin: yè }
meaning: { en: page, zh-Hans: 书页, zh-Hant: 書頁 }
fact:
  en: 页 (頁) began as a picture meaning 'head'. Later it was used in place of 葉 (leaf) to mean a page of paper.
  zh-Hans: “页”最早是一幅图画，意思是“头”。后来人们用它来代替“叶”字，表示纸张的一页。
  zh-Hant: 「頁」最早是一幅圖畫，意思是「頭」。後來人們用它來代替「葉」字，表示紙張的一頁。
story:
  topic: { en: Hunting for the Dragon Page, zh-Hans: 寻找画着龙的那一页, zh-Hant: 尋找畫著龍的那一頁 }
  hook: { en: 'Flip, flip, flip! You turn the pages of a picture book, hunting for the one with the dragon.', zh-Hans: 翻呀翻！你一页一页地翻着图画书，寻找画着龙的那一页。, zh-Hant: 翻呀翻！你一頁一頁地翻著圖畫書，尋找畫著龍的那一頁。 }
  early: { en: "The oldest 頁 is a kneeling person with a big head on top. It meant 'head', just like 首.", zh-Hans: 最早的“页”是一个跪着的人，上面顶着一个大脑袋。它的意思是“头”，和“首”一样。, zh-Hant: 最早的「頁」是一個跪著的人，上面頂著一個大腦袋。它的意思是「頭」，和「首」一樣。 }
  turn: { en: Simplified 页 comes from the quick cursive way of writing 頁., zh-Hans: 简体的“页”来自“頁”的草书写法。, zh-Hant: 簡體字是從「頁」的草書寫法變來的。 }
  closer: { en: "From a kneeling person's big head to a page in your book: that is 页 (頁)! The old 'head' meaning still hides in 頭, head.", zh-Hans: 从跪着的人的大脑袋，到书里的一页纸：这就是“页”！“头”的繁体字“頭”里，还藏着它“脑袋”的老意思呢。, zh-Hant: 從跪著的人的大腦袋，到書裡的一頁紙：這就是「頁」！「頭」字裡還藏著它「腦袋」的老意思呢。 }
