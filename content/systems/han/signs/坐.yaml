id: 坐
text: { Hans: 坐, Hant: 坐 }
readings: { pinyin: zuò }
meaning: { en: to sit, zh-Hans: 坐下, zh-Hant: 坐下 }
fact:
  en: '坐 joins two ideas: 留, “to stay”, and 土, “the ground”. Staying put on the ground means sitting!'
  zh-Hans: “坐”由两个意思合成：“留”（留下）和“土”（地面）。留在地上不动，就是坐！
  zh-Hant: 「坐」由兩個意思合成：「留」（留下）和「土」（地面）。留在地上不動，就是坐！
story:
  topic: { en: Riding the Merry-Go-Round, zh-Hans: 坐旋转木马, zh-Hant: 坐旋轉木馬 }
  hook: { en: Hold on tight! Zoe sits on a painted horse on the merry-go-round and waves every time she passes Mom., zh-Hans: 坐稳啦！佐伊坐在旋转木马的彩色小马上，每次转到妈妈面前都挥挥手。, zh-Hant: 坐穩囉！佐伊坐在旋轉木馬的彩色小馬上，每次轉到媽媽面前都揮揮手。 }
  closer: { en: "Stay (留) down on the ground (土): that's 坐, to sit!", zh-Hans: 留在地上不走了，就是坐下的“坐”！, zh-Hant: 留在地上不走了，就是坐下的「坐」！ }
journey: default
origin:
  type: compound-ideogram
  parts:
    - { char: 留, role: meaning, gloss: { en: to stay, zh-Hans: 留下, zh-Hant: 留下 } }
    - { char: 土, role: meaning, gloss: { en: ground, zh-Hans: 地面, zh-Hant: 地面 } }
status: draft
sources:
