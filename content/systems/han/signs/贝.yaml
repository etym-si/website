id: 贝
text: { Hans: 贝, Hant: 貝 }
readings: { pinyin: bèi }
meaning: { en: shell, zh-Hans: 贝壳, zh-Hant: 貝殼 }
fact:
  en: 贝 (貝) is a picture of a cowrie shell. In ancient China, these shells were used as money!
  zh-Hans: “贝”画的是一枚贝壳。在古代中国，这种贝壳被当作钱来用！
  zh-Hant: 「貝」畫的是一枚貝殼。在古代中國，這種貝殼被當作錢來用！
story:
  topic: { en: The Hermit Crab's Borrowed Home, zh-Hans: 寄居蟹借来的家, zh-Hant: 寄居蟹借來的家 }
  hook: { en: 'Hello, little crab! Your pet hermit crab pokes its legs out of its borrowed shell and scuttles across its tank.', zh-Hans: 你好呀，小螃蟹！你养的寄居蟹从借来的贝壳里伸出小脚，在饲养箱里爬来爬去。, zh-Hant: 你好呀，小螃蟹！你養的寄居蟹從借來的貝殼裡伸出小腳，在飼養箱裡爬來爬去。 }
  turn: { en: 'Simplified 贝 comes from the quick, flowing cursive way of writing 貝.', zh-Hans: 简体的“贝”来自“貝”的草书写法。, zh-Hant: 簡體字是從「貝」的草書寫法變來的。 }
  closer: { en: 'A shiny shell that people once spent like coins: that is 贝 (貝), as in 贝壳!', zh-Hans: 一枚曾经被当作钱来用的小贝壳：这就是贝壳的“贝”！, zh-Hant: 一枚曾經被當作錢來用的小貝殼：這就是貝殼的「貝」！ }
journey: default
