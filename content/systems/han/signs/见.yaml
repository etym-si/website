id: 见
text: { Hans: 见, Hant: 見 }
readings: { pinyin: jiàn }
meaning: { en: to see; to meet, zh-Hans: 再见, zh-Hant: 再見 }
fact:
  en: '見 is a kneeling person with a big eye 目 for a head: someone who sees!'
  zh-Hans: 繁体字“見”是一个跪着的人，头是一只大大的“目”（眼睛）——一个正在看的人！
  zh-Hant: 「見」是一個跪著的人，頭是一隻大大的「目」（眼睛）——一個正在看的人！
story:
  topic: { en: Seeing Grandma Again, zh-Hans: 在机场见到奶奶, zh-Hant: 在機場見到奶奶 }
  hook: { en: 'There she is! After a whole year apart, Annie sees Grandma coming through the airport gate and runs to hug her.', zh-Hans: 她来了！分开了一整年，安妮终于在机场出口看见了奶奶，飞奔过去抱住了她。, zh-Hant: 她來了！分開了一整年，安妮終於在機場出口看見了奶奶，飛奔過去抱住了她。 }
  turn: { en: 'Simplified 见 comes from the quick, flowing cursive way of writing 見.', zh-Hans: 简体字“见”是从“見”的草书写法简化来的。, zh-Hant: 簡體字「见」是從「見」的草書寫法簡化來的。 }
  closer: { en: "A big eye on a kneeling person: that's 见 (見), to see!", zh-Hans: 跪着的人顶着一只大眼睛，就是看见的“见”！, zh-Hant: 跪著的人頂著一隻大眼睛，就是看見的「見」！ }
journey: default
origin:
  type: compound-ideogram
  parts:
    - { char: 目, role: meaning, gloss: { en: eye, zh-Hans: 眼睛, zh-Hant: 眼睛 } }
    - { char: 卩, role: meaning, gloss: { en: kneeling person, zh-Hans: 跪着的人, zh-Hant: 跪著的人 } }
status: draft
sources:
