id: 家
text: { Hans: 家, Hant: 家 }
readings: { pinyin: jiā }
meaning: { en: 'home, family', zh-Hans: 回家, zh-Hant: 回家 }
fact:
  en: 家 means home. It has a roof 宀 on top for the meaning, and the part underneath was chosen for its sound.
  zh-Hans: “家”的意思是家。上面的“宀”是屋顶，表示意思；下面的部分是用来表示读音的。
  zh-Hant: 「家」的意思是家。上面的「宀」是屋頂，表示意思；下面的部分是用來表示讀音的。
story:
  topic: { en: Home Sweet Home, zh-Hans: 回家真好, zh-Hant: 回家真好 }
  hook: { en: "Click! After a long trip, Ivy unlocks the front door, kicks off her shoes, and shouts, “We're home!”", zh-Hans: 咔嗒！出门旅行了好几天，艾薇终于打开家门，踢掉鞋子大喊：“我们到家啦！”, zh-Hant: 喀嗒！出門旅行了好幾天，艾薇終於打開家門，踢掉鞋子大喊：「我們到家啦！」 }
  turn: { en: 'That sound part was first a sign for a boar, a male pig, but over time it was miswritten as 豕 (pig).', zh-Hans: 这个表示读音的部分，原来是一个表示公猪的字，后来被写走了样，变成了“豕”（猪）。, zh-Hant: 這個表示讀音的部分，原來是一個表示公豬的字，後來被寫走了樣，變成了「豕」（豬）。 }
  closer: { en: "A roof overhead and the people you love underneath: that's 家, home!", zh-Hans: 头上有屋顶，屋里有爱你的人——这就是“家”！, zh-Hant: 頭上有屋頂，屋裡有愛你的人——這就是「家」！ }
journey: default
origin:
  type: phono-semantic
  parts:
    - { char: 宀, role: meaning, gloss: { en: roof, zh-Hans: 屋顶, zh-Hant: 屋頂 } }
    - { char: 𢑓, role: sound }
status: draft
sources:
  - { title: 'Wiktionary: 家', url: 'https://en.wiktionary.org/wiki/%E5%AE%B6' }
