id: 衣
text: { Hans: 衣, Hant: 衣 }
readings: { pinyin: yī }
meaning: { en: clothes, zh-Hans: 衣服, zh-Hant: 衣服 }
fact:
  en: '衣 is a picture of a top, the kind of clothing that covers your chest. It can even split open to hold another part: in 裹, you can spot 果 tucked inside 衣!'
  zh-Hans: “衣”画的是一件上衣，就是穿在胸前的衣服。它还能从中间分开，把别的部件夹在里面：看看“裹”字，“果”就藏在“衣”的中间！
  zh-Hant: 「衣」畫的是一件上衣，就是穿在胸前的衣服。它還能從中間分開，把別的部件夾在裡面：看看「裹」字，「果」就藏在「衣」的中間！
story:
  topic: { en: A Cozy Top for a Chilly Morning, zh-Hans: 冷天里的暖上衣, zh-Hant: 冷天裡的暖上衣 }
  hook: { en: 'Brrr! On a chilly morning, Mom holds up a cozy top, and you wriggle your arms into the sleeves.', zh-Hans: 好冷呀！凉飕飕的早晨，妈妈拿来一件暖和的上衣，你把两只胳膊伸进了袖子里。, zh-Hant: 好冷呀！涼颼颼的早晨，媽媽拿來一件暖和的上衣，你把兩隻手臂伸進了袖子裡。 }
  early: { en: 'The oldest 衣 is the outline of a top: the piece of clothing that covers your chest.', zh-Hans: 最古老的“衣”是一件上衣的轮廓，也就是盖住胸口的那件衣服。, zh-Hant: 最古老的「衣」是一件上衣的輪廓，也就是蓋住胸口的那件衣服。 }
  closer: { en: "A top that keeps your chest warm: that's 衣, clothes!", zh-Hans: 暖暖护住胸口的上衣，就是衣服的“衣”！, zh-Hant: 暖暖護住胸口的上衣，就是衣服的「衣」！ }
