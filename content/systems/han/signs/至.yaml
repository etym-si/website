id: 至
text: { Hans: 至, Hant: 至 }
readings: { pinyin: zhì }
meaning: { en: 'to arrive, to reach', zh-Hans: 至今, zh-Hant: 至今 }
fact:
  en: 至 means to arrive. Its oldest form shows an arrow that has come down and stuck into the ground.
  zh-Hans: “至”的意思是到达。最早的“至”画的是一支落下来、插在地上的箭。
  zh-Hant: 「至」的意思是到達。最早的「至」畫的是一支落下來、插在地上的箭。
story:
  topic: { en: The Message in a Bottle, zh-Hans: 漂流瓶到啦, zh-Hant: 漂流瓶到啦 }
  hook: { en: 'Bob, bob, bob… After floating for weeks, a little message in a bottle finally reaches a faraway beach.', zh-Hans: 漂呀漂……在海上漂了好几个星期，一个装着信的漂流瓶终于到达了遥远的海滩。, zh-Hant: 漂呀漂……在海上漂了好幾個星期，一個裝著信的漂流瓶終於到達了遙遠的海灘。 }
  closer: { en: "When the arrow hits the ground, it has arrived: that's 至!", zh-Hans: 箭落了地，就是到了——这就是到达的“至”！, zh-Hant: 箭落了地，就是到了——這就是到達的「至」！ }
journey: default
