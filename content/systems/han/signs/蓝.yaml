id: 蓝
text: { Hans: 蓝, Hant: 藍 }
readings: { pinyin: lán }
meaning: { en: blue, zh-Hans: 蓝天, zh-Hant: 藍天 }
fact:
  en: 蓝 (藍) has 艹 (grass) on top for the meaning and 監 below for the sound. 蓝 is also the name of a plant used to make indigo, a blue dye.
  zh-Hans: “蓝”上面的草字头“艹”表示意思，下面的“监”表示读音。“蓝”也是一种植物的名字，可以用来做蓝色的染料。
  zh-Hant: 「藍」上面的草字頭「艹」表示意思，下面的「監」表示讀音。「藍」也是一種植物的名字，可以用來做藍色的染料。
story:
  topic: { en: Blueberry Fingers, zh-Hans: 蓝莓小手指, zh-Hant: 藍莓小手指 }
  hook: { en: "Look at my fingers! After picking blueberries all morning, Zoe's hands are stained bright blue.", zh-Hans: 看我的手指！摘了一上午蓝莓，佐伊的手都被染成了蓝色。, zh-Hant: 看我的手指！摘了一上午藍莓，佐伊的手都被染成了藍色。 }
  turn: { en: Simplified 蓝 writes the sound part 監 as 监., zh-Hans: 简化字把读音部分“監”写成了“监”。, zh-Hant: 簡化字把讀音部分「監」寫成了「监」。 }
  closer: { en: 'A grass part on top and 監 for the sound: 蓝 (藍) is blue, like the sky and blueberries!', zh-Hans: 草字头加上“监”，就是蓝天、蓝莓的“蓝”！, zh-Hant: 草字頭加上「監」，就是藍天、藍莓的「藍」！ }
