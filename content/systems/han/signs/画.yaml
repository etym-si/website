id: 画
text: { Hans: 画, Hant: 畫 }
readings: { pinyin: huà }
meaning: { en: to draw; picture, zh-Hans: 画画, zh-Hant: 畫畫 }
fact:
  en: You can spot a 田 (field) inside 画, but the oldest forms show no field at all! Some scholars think it's 聿 (a brush) plus 规 (規, a compass) for the sound.
  zh-Hans: “画”里面好像有个“田”，可是古老的写法里根本没有田！有学者认为，它是“聿”（毛笔）加上表示读音的“规”（圆规）。
  zh-Hant: 「畫」裡面好像有個「田」，可是古老的寫法裡根本沒有田！有學者認為，它是「聿」（毛筆）加上表示讀音的「規」（圓規）。
story:
  topic: { en: The Purple Whale, zh-Hans: 紫色的鲸鱼, zh-Hant: 紫色的鯨魚 }
  hook: { en: 'Scribble, scribble! With a fat crayon, Duoduo draws a purple whale splashing across the whole page.', zh-Hans: 沙沙沙！朵朵拿着胖胖的蜡笔，画了一头在整张纸上扑腾的紫色鲸鱼。, zh-Hant: 沙沙沙！朵朵拿著胖胖的蠟筆，畫了一頭在整張紙上撲騰的紫色鯨魚。 }
  early: { en: 'Some scholars read the oracle-bone form as 聿 (a brush) beside a little cross like 乂: an early picture of 规 (規, a compass).', zh-Hans: 有学者认为，甲骨文里的“画”是“聿”（毛笔）加上一个像“乂”的小叉，那是“规”（圆规）最早的样子。, zh-Hant: 有學者認為，甲骨文裡的「畫」是「聿」（毛筆）加上一個像「乂」的小叉，那是「規」（圓規）最早的樣子。 }
  turn: { en: 'On bronzes, 周 was added. For a long time people explained the box as a field (田), but the ancient forms never show one.', zh-Hans: 到了金文，又加上了“周”。很长时间里，人们都说中间的方框是田地，可是古老的字形里从来没有田。, zh-Hant: 到了金文，又加上了「周」。很長時間裡，人們都說中間的方框是田地，可是古老的字形裡從來沒有田。 }
  closer: { en: "Grab a brush and let your picture out: that's 画 (畫), to draw!", zh-Hans: 拿起画笔，把心里的图画画出来，这就是画画的“画”！, zh-Hant: 拿起畫筆，把心裡的圖畫畫出來，這就是畫畫的「畫」！ }
