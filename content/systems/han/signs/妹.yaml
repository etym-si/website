id: 妹
text: { Hans: 妹, Hant: 妹 }
readings: { pinyin: mèi }
meaning: { en: younger sister, zh-Hans: 妹妹, zh-Hant: 妹妹 }
fact:
  en: 妹 has 女, a girl, on the left for the meaning and 未 on the right for the sound.
  zh-Hans: “妹”左边的“女”表示意思，右边的“未”表示读音。
  zh-Hant: 「妹」左邊的「女」表示意思，右邊的「未」表示讀音。
story:
  topic: { en: Little Sister's First Word, zh-Hans: 妹妹的第一个词, zh-Hant: 妹妹的第一個詞 }
  hook: { en: 'Ge-ge! Little sister says her very first word, and her big brother beams from ear to ear.', zh-Hans: 哥哥！小妹妹说出了她的第一个词，哥哥笑得合不拢嘴。, zh-Hant: 哥哥！小妹妹說出了她的第一個詞，哥哥笑得合不攏嘴。 }
  closer: { en: "Little, sweet and always close by: that's 妹, as in 妹妹, little sister!", zh-Hans: 小小的、甜甜的，总跟在身边，这就是妹妹的“妹”！, zh-Hant: 小小的、甜甜的，總跟在身邊，這就是妹妹的「妹」！ }
journey: default
origin:
  type: phono-semantic
  parts:
    - { char: 女, role: meaning, gloss: { en: 'girl, woman', zh-Hans: 女孩, zh-Hant: 女孩 } }
    - { char: 未, role: sound }
