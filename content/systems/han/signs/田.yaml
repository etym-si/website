id: 田
status: reviewed
text: { Hans: 田, Hant: 田 }
readings: { pinyin: tián }
meaning: { en: field, zh-Hans: 田地, zh-Hant: 田地 }
fact:
  en: 田 is a field seen from above, divided by little paths into neat plots.
  zh-Hans: “田”是从天上往下看的农田，被小路分成一块一块的。
  zh-Hant: 「田」是從天上往下看的農田，被小路分成一塊一塊的。
story:
  topic: { en: A Bird’s-Eye View of Farmland, zh-Hans: 从山顶俯瞰农田, zh-Hant: 從山頂俯瞰農田 }
  hook:
    en: "Climb to the top of a hill and look down at the valley: farmers have divided the flat earth into neat square plots crossed by ditches and footpaths."
    zh-Hans: 爬到山顶往下看：农夫们用田埂和水渠，把平平整整的土地分成了一块块方格。
    zh-Hant: 爬到山頂往下看：農夫們用田埂和水渠，把平平整整的土地分成了一塊塊方格。
  early:
    en: On oracle bone No. 6057, 田 is carved as a crisp rectangle divided into four plots — and on the Da Yu ding bronze, it appears again!
    zh-Hans: 在6057号甲骨上，“田”被刻成分成四格的方框；在大盂鼎的青铜铭文上，也能找到它！
    zh-Hant: 在6057號甲骨上，「田」被刻成分成四格的方框；在大盂鼎的青銅銘文上，也能找到它！
  turn:
    en: In three thousand years, this character barely changed at all — an outer boundary with a cross of paths inside.
    zh-Hans: 三千年过去了，这个字几乎一点儿也没变——外面一圈田界，中间十字田埂。
    zh-Hant: 三千年過去了，這個字幾乎一點兒也沒變——外面一圈田界，中間十字田埂。
  closer:
    en: "Four little squares inside one big square: that is 田, field!"
    zh-Hans: 大口里面加十字，分成四块小方格，这就是农田的“田”！
    zh-Hant: 大口裡面加十字，分成四塊小方格，這就是農田的「田」！
