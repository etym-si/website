id: 道
text: { Hans: 道, Hant: 道 }
readings: { pinyin: dào }
meaning: { en: road; path; way, zh-Hans: 道路, zh-Hant: 道路 }
fact:
  en: 道 means a road or path. You can still spot 首 (head) inside it, a part it has had from the very start.
  zh-Hans: “道”的意思是道路。今天还能在它里面找到“首”（头），这个部件从一开始就有了。
  zh-Hant: 「道」的意思是道路。今天還能在它裡面找到「首」（頭），這個部件從一開始就有了。
story:
  topic: { en: The Path Through the Bamboo, zh-Hans: 竹林里的小路, zh-Hant: 竹林裡的小路 }
  hook: { en: 'A narrow path winds through the bamboo forest, and Sam follows it to see where it leads.', zh-Hans: 一条窄窄的小路弯弯曲曲地穿过竹林，小山顺着它往前走，想看看它通向哪里。, zh-Hant: 一條窄窄的小路彎彎曲曲地穿過竹林，小山順著它往前走，想看看它通向哪裡。 }
  early: { en: 'On early bronze vessels, 道 was made of 行, a road, together with 首, a head.', zh-Hans: 早期青铜器上的“道”，由“行”（道路）和“首”（头）组成。, zh-Hant: 早期青銅器上的「道」，由「行」（道路）和「首」（頭）組成。 }
  turn: { en: "Later, more parts were added and the right half of 行 dropped away; by seal script, the leftover pieces had joined into 辵, today's walking part 辶.", zh-Hans: 后来又加了别的部件，“行”右边的一半消失了；到了篆书，剩下的部分合成了“辵”，也就是今天的“辶”。, zh-Hant: 後來又加了別的部件，「行」右邊的一半消失了；到了篆書，剩下的部分合成了「辵」，也就是今天的「辶」。 }
  closer: { en: "From a road and a head to 辶 and 首: that's 道, the way to go!", zh-Hans: 从“行”加“首”，到“辶”加“首”，这就是道路的“道”！, zh-Hant: 從「行」加「首」，到「辶」加「首」，這就是道路的「道」！ }
journey: default
origin:
  type: compound-ideogram
  parts:
    - { char: 行, role: meaning, gloss: { en: road, zh-Hans: 道路, zh-Hant: 道路 } }
    - { char: 首, role: meaning, gloss: { en: head, zh-Hans: 头, zh-Hant: 頭 } }
status: draft
sources:
