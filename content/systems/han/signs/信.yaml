id: 信
text: { Hans: 信, Hant: 信 }
readings: { pinyin: xìn }
meaning: { en: letter; to believe, zh-Hans: 写信, zh-Hant: 寫信 }
fact:
  en: '信 has 亻 (person) on the left and 言 (words) on the right: 言 gives the meaning and 人 gives the sound. The Shuowen dictionary, though, read both parts for their meaning.'
  zh-Hans: “信”左边是“亻”（人），右边是“言”（话语）：“言”表示意思，“人”表示读音。不过《说文解字》认为，两部分都是表示意思的。
  zh-Hant: 「信」左邊是「亻」（人），右邊是「言」（話語）：「言」表示意思，「人」表示讀音。不過《說文解字》認為，兩部分都是表示意思的。
story:
  topic: { en: A Postcard from Far Away, zh-Hans: 远方寄来的明信片, zh-Hant: 遠方寄來的明信片 }
  hook: { en: "A letter for me? Toby tears open the envelope: it's a postcard from his pen pal in Canada!", zh-Hans: 有我的信？托比撕开信封：是加拿大的笔友寄来的明信片！, zh-Hant: 有我的信？托比撕開信封：是加拿大的筆友寄來的明信片！ }
  closer: { en: 'Letters you send and words you can trust: both use 信!', zh-Hans: 寄出去的信，说到做到的诚信，都有一个“信”！, zh-Hant: 寄出去的信，說到做到的誠信，都有一個「信」！ }
journey: []
origin:
  type: phono-semantic
  parts:
    - { char: 言, role: meaning, gloss: { en: words, zh-Hans: 话语, zh-Hant: 話語 } }
    - { char: 人, role: sound }
