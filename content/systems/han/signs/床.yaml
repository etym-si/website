id: 床
text: { Hans: 床, Hant: 床 }
readings: { pinyin: chuáng }
meaning: { en: bed, zh-Hans: 起床, zh-Hant: 起床 }
fact:
  en: '床 is 广, a house, with 木, wood, inside: a wooden piece of furniture in the house, a bed!'
  zh-Hans: “床”是“广”（房屋）里面放着“木”（木头）：屋子里的木头家具——床！
  zh-Hant: 「床」是「广」（房屋）裡面放著「木」（木頭）：屋子裡的木頭家具——床！
story:
  topic: { en: One More Bounce!, zh-Hans: 在床上蹦一蹦, zh-Hant: 在床上蹦一蹦 }
  hook: { en: Sproing! The twins sneak in one more bounce on the bed before Mom turns off the light., zh-Hans: 蹦，蹦！关灯之前，双胞胎偷偷在床上又蹦了一下。, zh-Hant: 蹦，蹦！關燈之前，雙胞胎偷偷在床上又蹦了一下。 }
  turn: { en: 床 began as an unusual way of writing 牀; now it's the everyday form., zh-Hans: “床”原本是“牀”的一种不太正规的写法，现在却成了大家天天用的写法。, zh-Hant: 「床」原本是「牀」的一種不太正規的寫法，現在卻成了大家天天用的寫法。 }
  closer: { en: "Wood 木 inside a house 广: that's 床, a bed! Now, lights out.", zh-Hans: 屋子里的木头家具，就是“床”！好啦，关灯睡觉。, zh-Hant: 屋子裡的木頭家具，就是「床」！好啦，關燈睡覺。 }
journey: []
origin:
  type: compound-ideogram
  parts:
    - { char: 广, role: meaning, gloss: { en: house, zh-Hans: 房屋, zh-Hant: 房屋 } }
    - { char: 木, role: meaning, gloss: { en: wood, zh-Hans: 木头, zh-Hant: 木頭 } }
