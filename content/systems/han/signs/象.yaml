id: 象
status: reviewed
text: { Hans: 象, Hant: 象 }
readings: { pinyin: xiàng }
meaning: { en: elephant, zh-Hans: 大象, zh-Hant: 大象 }
fact:
  en: See the long trunk at the top? Long ago, wild elephants lived in China, so people knew them well.
  zh-Hans: 看到顶上长长的鼻子了吗？很久以前，中国也有野生大象，所以古人很熟悉它们。
  zh-Hant: 看到頂上長長的鼻子了嗎？很久以前，中國也有野生大象，所以古人很熟悉牠們。
story:
  topic: { en: The Giant with a Curling Trunk, zh-Hans: 长鼻弯弯的大象, zh-Hant: 長鼻彎彎的大象 }
  hook:
    en: Three thousand years ago, wild elephants roamed the Yellow River valley! Their most famous feature was that long, curling trunk.
    zh-Hans: 三千年前，黄河流域还生活着野生大象！大象最醒目的标志，就是那根又长又弯的鼻子。
    zh-Hant: 三千年前，黃河流域還生活著野生大象！大象最醒目的標誌，就是那根又長又彎的鼻子。
  rotate:
    en: Oracle bones were carved in narrow vertical columns — so the big elephant stood up on its hind legs, trunk pointing to the sky!
    zh-Hans: 因为甲骨文是一列一列竖着刻的，大象只好后腿站立、把长鼻子高高举向天空！
    zh-Hant: 因為甲骨文是一列一列豎著刻的，大象只好後腿站立、把長鼻子高高舉向天空！
  early:
    en: "Look at the top of the carving: that hooked curve is the elephant’s trunk, above its heavy body and four legs."
    zh-Hans: 看刻字的最顶上：那道弯弯的钩就是象鼻，下面是圆滚滚的身子和四条粗腿。
    zh-Hant: 看刻字的最頂上：那道彎彎的鉤就是象鼻，下面是圓滾滾的身子和四條粗腿。
  turn:
    en: As centuries passed, the curling trunk stayed right at the top of 象, while the legs fanned out into sweeping strokes below.
    zh-Hans: 几千年过去，“象”字最顶上依然保留着弯弯的象鼻，下面的象腿则化作了舒展的笔画。
    zh-Hant: 幾千年過去，「象」字最頂上依然保留著彎彎的象鼻，下面的象腿則化作了舒展的筆畫。
  closer:
    en: "Look at the top of 象 today: you can still spot the elephant’s curling trunk!"
    zh-Hans: 今天再看“象”字的最上面，你还能一眼认出大象弯弯的长鼻子！
    zh-Hant: 今天再看「象」字的最上面，你還能一眼認出大象彎彎的長鼻子！
