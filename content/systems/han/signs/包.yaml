id: 包
text: { Hans: 包, Hant: 包 }
readings: { pinyin: bāo }
meaning: { en: to wrap; bag, zh-Hans: 书包, zh-Hant: 書包 }
fact:
  en: "包 is a picture of a baby wrapped up snug: either a baby inside its mother's tummy, or a newborn bundled in a blanket. An old dictionary gives both ideas."
  zh-Hans: “包”画的是被裹得暖暖的小宝宝：可能是妈妈肚子里的胎儿，也可能是裹在小被子里的婴儿。古老的字典两种说法都有。
  zh-Hant: 「包」畫的是被裹得暖暖的小寶寶：可能是媽媽肚子裡的胎兒，也可能是裹在小被子裡的嬰兒。古老的字典兩種說法都有。
story:
  topic: { en: Wrapping a Present, zh-Hans: 包礼物, zh-Hant: 包禮物 }
  hook: { en: 'Crinkle, crinkle! You fold shiny paper around a present and stick a big red bow on top.', zh-Hans: 窸窸窣窣！你用亮晶晶的包装纸把礼物包起来，再在上面贴一个大红蝴蝶结。, zh-Hant: 窸窸窣窣！你用亮晶晶的包裝紙把禮物包起來，再在上面貼一個大紅蝴蝶結。 }
  early: { en: "In 包, the curved 勹 hugs the little 巳 inside, like a mother's tummy around her baby.", zh-Hans: 在“包”字里，弯弯的“勹”抱住里面的小“巳”，就像妈妈的肚子护着小宝宝。, zh-Hant: 在「包」字裡，彎彎的「勹」抱住裡面的小「巳」，就像媽媽的肚子護著小寶寶。 }
  closer: { en: "Something snug inside, something wrapped around it: that's 包, to wrap!", zh-Hans: 里面藏着宝贝，外面紧紧裹住，这就是包裹的“包”！, zh-Hant: 裡面藏著寶貝，外面緊緊裹住，這就是包裹的「包」！ }
