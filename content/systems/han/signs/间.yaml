id: 间
text: { Hans: 间, Hant: 間 }
readings: { pinyin: jiān }
meaning: { en: 'between, in the middle', zh-Hans: 中间, zh-Hant: 中間 }
fact:
  en: 间 (間) is a door 门 (門) with a sun 日 inside. 間 is another way of writing 閒, “a gap”, with the moon 月 swapped for the sun 日.
  zh-Hans: “间”是一扇“门”，里面有个“日”。它的繁体字“間”是“閒”（空隙）的另一种写法，只是把“閒”里的“月”换成了“日”。
  zh-Hant: 「間」是一扇「門」，裡面有個「日」。它是「閒」（空隙）的另一種寫法，只是把「月」換成了「日」。
story:
  topic: { en: Coco Naps in the Middle, zh-Hans: 可可睡在中间, zh-Hant: 可可睡在中間 }
  hook: { en: 'Two fluffy cushions sit on the sofa, and Coco the cat squeezes into the narrow gap between them for a nap.', zh-Hans: 沙发上放着两个软软的靠垫，小猫可可钻进它们中间的窄缝里睡午觉。, zh-Hant: 沙發上放著兩個軟軟的靠墊，小貓可可鑽進它們中間的窄縫裡睡午覺。 }
  closer: { en: "A door 门 with 日 inside: that's 间 (間), in between!", zh-Hans: “门”里面有个“日”，就是中间的“间”！, zh-Hant: 「門」裡面有個「日」，就是中間的「間」！ }
