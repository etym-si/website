id: 铁
text: { Hans: 铁, Hant: 鐵 }
readings: { pinyin: tiě }
meaning: { en: iron, zh-Hans: 钢铁, zh-Hant: 鋼鐵 }
fact:
  en: 鐵 (铁) has 金 (metal) on the left for the meaning and a sound part on the right. In simplified 铁, the metal part is written 钅.
  zh-Hans: “铁”左边的“钅”就是“金”，表示金属；繁体字右边那一大块是表示读音的部分。
  zh-Hant: 「鐵」左邊的「金」表示金屬，右邊那一大塊是表示讀音的部分。
story:
  topic: { en: The Magic Magnet, zh-Hans: 神奇的磁铁, zh-Hant: 神奇的磁鐵 }
  hook: { en: 'Tick, tick, tick! Ella holds a magnet over a pile of nails, and one by one they leap up and cling to it.', zh-Hans: 嗒、嗒、嗒！艾拉把磁铁伸到一堆钉子上面，钉子一根接一根跳起来，紧紧吸在上面。, zh-Hant: 嗒、嗒、嗒！艾拉把磁鐵伸到一堆釘子上面，釘子一根接一根跳起來，緊緊吸在上面。 }
  closer: { en: "Strong, hard and pulled by magnets: that's the metal 铁 (鐵), iron!", zh-Hans: 又硬又结实，还会被磁铁吸住，这就是钢铁的“铁”！, zh-Hant: 又硬又結實，還會被磁鐵吸住，這就是鋼鐵的「鐵」！ }
