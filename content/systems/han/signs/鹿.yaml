# yaml-language-server: $schema=../../../_schema/sign.schema.json
id: 鹿
status: reviewed
text: { Hans: 鹿, Hant: 鹿 }
readings: { pinyin: lù }
meaning: { en: deer, zh-Hans: 小鹿, zh-Hant: 小鹿 }
fact:
  en: "Look at the branching antlers on top: that’s how you know it’s a deer!"
  zh-Hans: 看顶上分叉的鹿角，一看就知道是“鹿”！
  zh-Hant: 看頂上分叉的鹿角，一看就知道是「鹿」！
story:
  topic: { en: The Crown of Antlers, zh-Hans: 头顶分叉角的梅花鹿, zh-Hant: 頭頂分叉角的梅花鹿 }
  hook:
    en: Stepping lightly through the mist comes a graceful deer, crowned with a pair of branching antlers.
    zh-Hans: 薄雾中轻轻走来一头梅花鹿，头顶立着一对漂亮的枝形鹿角。
    zh-Hant: 薄霧中輕輕走來一頭梅花鹿，頭頂立著一對漂亮的枝形鹿角。
  turn:
    en: In every single stage — oracle bone, bronze, and seal — those proud branching antlers sit right on top of the deer’s head.
    zh-Hans: 不管是甲骨文、金文还是篆书，那对分叉的大鹿角始终高高立在鹿头顶上。
    zh-Hant: 不管是甲骨文、金文還是篆書，那對分叉的大鹿角始終高高立在鹿頭頂上。
  closer:
    en: In 鹿 today, the top roof and grid come from its head and antlers, and 比 at the bottom comes from its slender legs!
    zh-Hans: 今天的“鹿”字，上半部来自鹿头和鹿角，底下的“比”则是它修长的四条腿！
    zh-Hant: 今天的「鹿」字，上半部來自鹿頭和鹿角，底下的「比」則是牠修長的四條腿！
journey: [ oracle, bronze, seal ]
