id: 走
text: { Hans: 走, Hant: 走 }
readings: { pinyin: zǒu }
meaning: { en: to walk, zh-Hans: 走路, zh-Hant: 走路 }
fact:
  en: 走 means to walk, but its picture began as a person running!
  zh-Hans: “走”的意思是走路，可它最早画的却是一个正在奔跑的人！
  zh-Hant: 「走」的意思是走路，可是它最早畫的卻是一個正在奔跑的人！
story:
  topic: { en: Baby's First Steps, zh-Hans: 小妹妹学走路, zh-Hant: 小妹妹學走路 }
  hook: { en: 'Left foot, right foot! Your baby sister wobbles across the room on her very first steps.', zh-Hans: 左脚，右脚！小妹妹摇摇晃晃地走出了人生的第一步。, zh-Hant: 左腳，右腳！小妹妹搖搖晃晃地走出了人生的第一步。 }
  turn: { en: 'Later a foot, 止, was added underneath. Today the runner on top looks like 土, even though it has nothing to do with soil!', zh-Hans: 后来，下面加上了一只脚“止”。今天上面奔跑的人变得像“土”，其实它和泥土一点关系也没有！, zh-Hant: 後來，下面加上了一隻腳「止」。今天上面奔跑的人變得像「土」，其實它和泥土一點關係也沒有！ }
  closer: { en: 'A runner up top, a foot down below: that is 走, to walk!', zh-Hans: 上面是奔跑的人，下面是一只脚：这就是走路的“走”！, zh-Hant: 上面是奔跑的人，下面是一隻腳：這就是走路的「走」！ }
journey: default
origin:
  type: pictogram
status: draft
sources:
