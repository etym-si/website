id: 动
text: { Hans: 动, Hant: 動 }
readings: { pinyin: dòng }
meaning: { en: to move, zh-Hans: 运动, zh-Hant: 運動 }
fact:
  en: 動 (动) has 力 (strength) for the meaning and 重 for the sound. 重 also hints at a heavy bag, waiting for someone to move it.
  zh-Hans: 繁体字里，“力”表示力气，是意思部分；“重”表示读音，还让人想到一个等着人去搬动的重袋子。
  zh-Hant: 「動」的「力」表示力氣，是意思部分；「重」表示讀音，還讓人想到一個等著人去搬動的重袋子。
story:
  topic: { en: Moving the Big Sofa, zh-Hans: 推动大沙发, zh-Hant: 推動大沙發 }
  hook: { en: 'Push, push, push! Ming and Hong lean on the big sofa with all their might until, at last, it starts to slide.', zh-Hans: 推呀推！小明和小红使出全身力气推大沙发，沙发终于动起来了。, zh-Hant: 推呀推！小明和小紅使出全身力氣推大沙發，沙發終於動起來了。 }
  turn: { en: Simplified 动 swaps 重 for the much shorter 云., zh-Hans: 简化字“动”把“重”换成了笔画少得多的“云”。, zh-Hant: 簡化字把「重」換成了筆畫少得多的「云」。 }
  closer: { en: 'Something heavy plus lots of strength: 重 and 力 make 動 (动), to move!', zh-Hans: 重重的东西，加上大大的力气，就是动起来的“动”！, zh-Hant: 重重的東西，加上大大的力氣，「重」和「力」合起來就是動起來的「動」！ }
journey: default
origin:
  type: phono-semantic
  parts:
    - { char: 力, role: meaning, gloss: { en: strength, zh-Hans: 力气, zh-Hant: 力氣 } }
    - { char: 重, role: sound }
status: draft
