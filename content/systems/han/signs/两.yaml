id: 两
text: { Hans: 两, Hant: 兩 }
readings: { pinyin: liǎng }
meaning: { en: two (of something); both, zh-Hans: 两个, zh-Hant: 兩個 }
fact:
  en: '两 (兩) means two of something, like 两只手 (two hands). Scholars explain its old shape in different ways: an old dictionary says 一 plus 㒳, while others see two 丙 joined together.'
  zh-Hans: “两”表示两个，比如“两只手”。学者们对它古老的样子有不同的解释：一本古老的字典说是“一”加“㒳”，也有人认为是两个“丙”连在一起。
  zh-Hant: 「兩」表示兩個，比如「兩隻手」。學者們對它古老的樣子有不同的解釋：一本古老的字典說是「一」加「㒳」，也有人認為是兩個「丙」連在一起。
story:
  topic: { en: A Two-Armed Hug, zh-Hans: 两只手臂的拥抱, zh-Hant: 兩隻手臂的擁抱 }
  hook: { en: Squeeze! You throw both arms around your little brother in a giant hug., zh-Hans: 抱抱！你张开两只胳膊，给弟弟一个大大的拥抱。, zh-Hant: 抱抱！你張開兩隻手臂，給弟弟一個大大的擁抱。 }
  early: { en: 'In the old forms, some scholars see two 丙 shapes joined side by side, and some link it to an old picture of two chariots and a whip.', zh-Hans: 在古老的写法里，有学者看到两个“丙”并排连在一起，也有人把它和一幅画着两辆车和一根鞭子的古老图画联系起来。, zh-Hant: 在古老的寫法裡，有學者看到兩個「丙」並排連在一起，也有人把它和一幅畫著兩輛車和一根鞭子的古老圖畫聯繫起來。 }
  closer: { en: "Two hands, two shoes, two of anything: that's 两 (兩)!", zh-Hans: 两只手、两只鞋，成双成对，这就是“两”！, zh-Hant: 兩隻手、兩隻鞋，成雙成對，這就是「兩」！ }
journey: [ { stage: bronze, form: 两 }, { stage: seal, form: 两 } ]
