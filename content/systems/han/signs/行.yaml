id: 行
text: { Hans: 行, Hant: 行 }
readings: { pinyin: xíng }
meaning: { en: 'to walk, to go', zh-Hans: 行人, zh-Hant: 行人 }
fact:
  en: 行 began as a picture of a crossroads, where streets meet. Later it was borrowed for its sound to write 'to go'.
  zh-Hans: “行”最早画的是一个十字路口，几条路在这里交会。后来借它的读音，表示“走”的意思。
  zh-Hant: 「行」最早畫的是一個十字路口，幾條路在這裡交會。後來借它的讀音，表示「走」的意思。
story:
  topic: { en: Crossing with Little Brother, zh-Hans: 牵着弟弟过马路, zh-Hant: 牽著弟弟過馬路 }
  hook: { en: The little green walking man lights up! You hold your little brother's hand and walk across the intersection together., zh-Hans: 绿色的小人亮了！你牵着弟弟的手，一起走过十字路口。, zh-Hant: 小綠人亮了！你牽著弟弟的手，一起走過十字路口。 }
  early: { en: 'The oldest 行 is a crossroads, perfectly balanced on both sides.', zh-Hans: 最早的“行”是一个十字路口，左右两边完全对称。, zh-Hant: 最早的「行」是一個十字路口，左右兩邊完全對稱。 }
  turn: { en: 'Over time it grew lopsided: now the left half is 彳 and the right half is 亍, though it was never really made of two parts.', zh-Hans: 后来它变得不对称了：现在左半边是“彳”，右半边是“亍”，可它原本并不是两个部分拼成的。, zh-Hant: 後來它變得不對稱了：現在左半邊是「彳」，右半邊是「亍」，可是它原本並不是兩個部分拼成的。 }
  closer: { en: "A crossroads that came to mean 'go': that is 行 — so off you go!", zh-Hans: 一个十字路口，后来表示“走”：这就是行人的“行”——我们走吧！, zh-Hant: 一個十字路口，後來表示「走」：這就是行人的「行」——我們走吧！ }
journey: default
