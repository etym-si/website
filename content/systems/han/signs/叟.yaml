id: 叟
status: reviewed
text: { Hans: 叟, Hant: 叟 }
readings: { pinyin: sǒu }
meaning: { en: old man, zh-Hans: 老人, zh-Hant: 老人 }
fact:
  en: "The ancient 叟 showed a hand holding a torch inside a house: searching! Later it came to mean “old man”, and 搜 took over the job of “search”."
  zh-Hans: 古代的“叟”是屋子里一只举着火把的手——在找东西！后来它被借来表示“老人”，“找”的意思就交给了“搜”。
  zh-Hant: 古代的「叟」是屋子裡一隻舉著火把的手——在找東西！後來它被借來表示「老人」，「找」的意思就交給了「搜」。
story:
  topic: { en: Grandpa with a Torch, zh-Hans: 举着火把的老人家, zh-Hant: 舉著火把的老人家 }
  hook:
    en: "Who is keeping watch over the farmyard at dusk? A wise old grandfather: 叟!"
    zh-Hans: 傍晚时分，是谁在照看农家小院呢？是一位慈祥又勇敢的老爷爷：“叟”！
    zh-Hant: 傍晚時分，是誰在照看農家小院呢？是一位慈祥又勇敢的老爺爺：「叟」！
  closer:
    en: Its earliest form showed a hand (又) holding a torch inside a room to search in the dark — and later came to mean an elder, 叟!
    zh-Hans: 它最初的意思是手里（又）举着火把在屋里找东西，后来专门用来称呼智慧的长辈——“叟”！
    zh-Hant: 它最初的意思是手裡（又）舉著火把在屋裡找東西，後來專門用來稱呼智慧的長輩——「叟」！
