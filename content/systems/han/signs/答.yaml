id: 答
text: { Hans: 答, Hant: 答 }
readings: { pinyin: dá }
meaning: { en: to answer, zh-Hans: 回答, zh-Hant: 回答 }
fact:
  en: 答 has 竹 (bamboo) on top and 合 below for sound, but that bamboo top is really a mistake!
  zh-Hans: “答”上面是“竹”，下面的“合”表示读音。不过，这个竹字头其实是写错的！
  zh-Hant: 「答」上面是「竹」，下面的「合」表示讀音。不過，這個竹字頭其實是寫錯的！
story:
  topic: { en: Five! Says Rosie, zh-Hans: 萝西抢答, zh-Hant: 蘿西搶答 }
  hook: { en: "'What's two plus three?' asks the teacher. Ten hands shoot up, and Rosie answers first: 'Five!'", zh-Hans: 老师问：“二加三等于几？”十只小手一齐举起来，萝西第一个回答：“五！”, zh-Hant: 老師問：「二加三等於幾？」十隻小手一齊舉起來，蘿西第一個回答：「五！」 }
  turn: { en: 'It began as 荅, with 艸 (grass) on top. Later the grass was mistakenly swapped for bamboo, and the mix-up stuck!', zh-Hans: 它原来写作“荅”，上面是“艸”（草）。后来草字头被错写成了竹字头，就这样一直用到今天！, zh-Hant: 它原來寫作「荅」，上面是「艸」（草）。後來草字頭被錯寫成了竹字頭，就這樣一直用到今天！ }
  closer: { en: "Someone asks, you reply: that's 答, to answer!", zh-Hans: 有人问，你来答，这就是回答的“答”！, zh-Hant: 有人問，你來答，這就是回答的「答」！ }
