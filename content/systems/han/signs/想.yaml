id: 想
text: { Hans: 想, Hant: 想 }
readings: { pinyin: xiǎng }
meaning: { en: to think; to want, zh-Hans: 想一想, zh-Hant: 想一想 }
fact:
  en: 'In 想, 相 on top gives the sound (xiāng is a lot like xiǎng), and 心, the heart and mind, gives the meaning: to think.'
  zh-Hans: “想”上面的“相”（xiāng）表示读音，和“想”（xiǎng）读起来很像；下面的“心”代表心思，表示意思：动脑筋想一想。
  zh-Hant: 「想」上面的「相」（xiāng）表示讀音，和「想」（xiǎng）讀起來很像；下面的「心」代表心思，表示意思：動腦筋想一想。
story:
  topic: { en: Dreaming Up a Dream Pet, zh-Hans: 想象中的宠物, zh-Hant: 想像中的寵物 }
  hook: { en: 'Hmm… if you could have any pet in the world, what would it be? Tom closes his eyes and pictures a tiny dragon.', zh-Hans: 嗯……如果可以养世界上任何一种宠物，你会选什么？汤姆闭上眼睛，想象出一条小小的龙。, zh-Hant: 嗯……如果可以養世界上任何一種寵物，你會選什麼？湯姆閉上眼睛，想像出一條小小的龍。 }
  closer: { en: "Whenever your mind starts dreaming up ideas, that's 想: 相 for the sound, 心 for the thinking heart.", zh-Hans: 脑袋里冒出各种点子的时候，就是在“想”啦：“相”管读音，“心”管思考！, zh-Hant: 腦袋裡冒出各種點子的時候，就是在「想」啦：「相」管讀音，「心」管思考！ }
