id: 楼
text: { Hans: 楼, Hant: 樓 }
readings: { pinyin: lóu }
meaning: { en: building; floor, zh-Hans: 大楼, zh-Hant: 大樓 }
fact:
  en: 樓 (楼) has 木 (tree) on the left for the meaning and 婁 (lóu) on the right for the sound, the very same sound as 楼 (lóu).
  zh-Hans: “楼”左边的“木”表示意思，右边的“娄”（lóu）表示读音，和“楼”的读音一模一样。
  zh-Hant: 「樓」左邊的「木」表示意思，右邊的「婁」（lóu）表示讀音，和「樓」的讀音一模一樣。
story:
  topic: { en: Up the Stairs to the Tenth Floor, zh-Hans: 爬到十楼, zh-Hant: 爬到十樓 }
  hook: { en: 'Step, step, step! Jack counts each floor as he climbs the stairs, all the way up to the tenth.', zh-Hans: 一步，一步，又一步！杰克一边爬楼梯一边数楼层，一直爬到了十楼。, zh-Hant: 一步，一步，又一步！傑克一邊爬樓梯一邊數樓層，一直爬到了十樓。 }
  turn: { en: 'Simplified 楼 writes 婁 as 娄, which is still read lóu.', zh-Hans: 简化字把繁体的“婁”写成了“娄”，读音还是 lóu。, zh-Hant: 簡化字把「婁」寫成了「娄」，讀音還是 lóu。 }
  closer: { en: "Floor after floor, stacked up high: that's 楼 (樓), a building!", zh-Hans: 一层一层叠得高高的，这就是大楼的“楼”！, zh-Hant: 一層一層疊得高高的，這就是大樓的「樓」！ }
journey: []
origin:
  type: phono-semantic
  parts:
    - { char: 木, role: meaning, gloss: { en: tree, zh-Hans: 树木, zh-Hant: 樹木 } }
    - { char: 婁, role: sound }
status: draft
sources:
