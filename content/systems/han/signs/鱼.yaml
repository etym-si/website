# yaml-language-server: $schema=../../../_schema/sign.schema.json
id: 鱼
status: reviewed
text: { Hans: 鱼, Hant: 魚 }
readings: { pinyin: yú }
meaning: { en: fish, zh-Hans: 小鱼, zh-Hant: 小魚 }
fact:
  en: "Head at the top, tail at the bottom: the ancient 鱼 is a fish swimming upward. The four dots at the bottom of 魚 were once its tail!"
  zh-Hans: 头在上，尾巴在下：古代的“鱼”是一条往上游的鱼。繁体“魚”下面的四个点，原来是鱼尾巴！
  zh-Hant: 頭在上，尾巴在下：古代的「魚」是一條往上游的魚。「魚」下面的四個點，原來是魚尾巴！
story:
  topic: { en: The Leaping River Fish, zh-Hans: 跃出水面的小鱼, zh-Hant: 躍出水面的小魚 }
  hook:
    en: Plop! A silver fish leaps straight up out of the river — pointed head at the top, scaly body in the middle, and forked tail at the bottom.
    zh-Hans: 扑通！一条银亮的小鱼跃出水面——尖尖的鱼头朝上，带鳞的身子居中，分叉的鱼尾朝下。
    zh-Hant: 撲通！一條銀亮的小魚躍出水面——尖尖的魚頭朝上，帶鱗的身子居中，分叉的魚尾朝下。
  turn:
    en: In seal and regular script 魚, the scaly body became a checkered 田 shape, and the forked tail split into four little dots.
    zh-Hans: 到了篆书和楷书“魚”，带鳞的鱼身变成了“田”字格，分叉的鱼尾变成了底下的四个点。
    zh-Hant: 到了篆書和楷書「魚」，帶鱗的魚身變成了「田」字格，分叉的魚尾變成了底下的四個點。
  closer:
    en: In simplified 鱼, those four tail-dots join into one smooth horizontal bar at the bottom!
    zh-Hans: 到了简化字“鱼”，底下的四点鱼尾又连成了一道稳稳的横画！
    zh-Hant: 到了簡化字「鱼」，底下的四點魚尾又連成了一道穩穩的橫畫！
journey: [ oracle, bronze, seal ]
