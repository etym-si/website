id: 习
text: { Hans: 习, Hant: 習 }
readings: { pinyin: xí }
meaning: { en: 'to practice, to review', zh-Hans: 练习, zh-Hant: 練習 }
fact:
  en: '习 (習) began as wings 羽 and the sun 日: a bird practicing flying, flap after flap! Some scholars think the top was 彗, there for its sound, instead.'
  zh-Hans: “习”的繁体字“習”最早由翅膀“羽”和太阳“日”组成：小鸟在练习飞，一次又一次！也有学者认为，上面本来是表示读音的“彗”。
  zh-Hant: 「習」最早由翅膀「羽」和太陽「日」組成：小鳥在練習飛，一次又一次！也有學者認為，上面本來是表示讀音的「彗」。
story:
  topic: { en: The Baby Bird's Flying Lesson, zh-Hans: 小鸟学飞, zh-Hant: 小鳥學飛 }
  hook: { en: 'Hop, wobble, flutter! A baby bird practices on the branch, beating its tiny wings again and again until, whoosh, it lifts off.', zh-Hans: 蹦一蹦，晃一晃，扑棱棱！小鸟在树枝上练习，一遍又一遍地拍着小翅膀，呼——终于飞起来了！, zh-Hant: 蹦一蹦，晃一晃，撲稜稜！小鳥在樹枝上練習，一遍又一遍地拍著小翅膀，呼——終於飛起來了！ }
  turn: { en: 'Later the sun 日 turned into 白, so 習 became 羽 over 白. Simplified 习 drops 白 and shrinks 羽 to just 习.', zh-Hans: 后来，“日”变成了“白”，“習”就成了上“羽”下“白”。简化字“习”去掉了“白”，把“羽”也简化成了“习”。, zh-Hant: 後來，「日」變成了「白」，「習」就成了上「羽」下「白」。簡化字去掉了「白」，連「羽」也一起簡化了。 }
  closer: { en: "Wings flapping again and again: that's 习 (習), to practice!", zh-Hans: 翅膀拍了一遍又一遍，这就是练习的“习”！, zh-Hant: 翅膀拍了一遍又一遍，這就是練習的「習」！ }
journey: default
origin:
  type: compound-ideogram
  parts:
    - { char: 羽, role: meaning, gloss: { en: wings, zh-Hans: 翅膀, zh-Hant: 翅膀 } }
    - { char: 日, role: meaning, gloss: { en: sun, zh-Hans: 太阳, zh-Hant: 太陽 } }
