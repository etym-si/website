id: 周
text: { Hans: 周, Hant: 周 }
readings: { pinyin: zhōu }
meaning: { en: all around; circle, zh-Hans: 四周, zh-Hant: 四周 }
fact:
  en: 周 began as a picture of a piece of jade with carved patterns. Today it means all the way around, as in 四周 (all around).
  zh-Hans: “周”最早画的是一块刻着花纹的玉器。今天它表示一圈、周围，比如“四周”。
  zh-Hant: 「周」最早畫的是一塊刻著花紋的玉器。今天它表示一圈、周圍，比如「四周」。
story:
  topic: { en: Fireflies All Around, zh-Hans: 四周的萤火虫, zh-Hant: 四周的螢火蟲 }
  hook: { en: 'Blink, blink! At dusk, tiny fireflies glow all around you in the garden.', zh-Hans: 一闪，一闪！傍晚的花园里，小萤火虫在你的四周亮了起来。, zh-Hant: 一閃，一閃！傍晚的花園裡，小螢火蟲在你的四周亮了起來。 }
  early: { en: 'On oracle bones, 周 is a piece of jade with patterns carved into it.', zh-Hans: 在甲骨文里，“周”是一块刻着花纹的玉器。, zh-Hant: 在甲骨文裡，「周」是一塊刻著花紋的玉器。 }
  turn: { en: 'When 周 was borrowed as the name of a country, a 口 was added to mark the difference, and the top slowly came to look like 用.', zh-Hans: 后来“周”被借去当国家的名字，人们就加上一个“口”来区分，上面的部分也慢慢变得像“用”。, zh-Hant: 後來「周」被借去當國家的名字，人們就加上一個「口」來區分，上面的部分也慢慢變得像「用」。 }
  closer: { en: "Look left, right, in front and behind, all the way round: that's 周!", zh-Hans: 往左看，往右看，前前后后转一圈，这就是四周的“周”！, zh-Hant: 往左看，往右看，前前後後轉一圈，這就是四周的「周」！ }
