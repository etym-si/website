id: 块
text: { Hans: 块, Hant: 塊 }
readings: { pinyin: kuài }
meaning: { en: piece; chunk, zh-Hans: 冰块, zh-Hant: 冰塊 }
fact:
  en: 塊 (块) has 土 (earth) for the meaning and 鬼 for the sound, and it first meant a clod of dirt. Don't worry, the 鬼 (ghost) is only there for its sound!
  zh-Hans: 繁体字里，左边的“土”表示意思，右边的“鬼”表示读音，原来指一块泥土。别怕，这个“鬼”只是来帮忙表示读音的！
  zh-Hant: 「塊」左邊的「土」表示意思，右邊的「鬼」表示讀音，原來指一塊泥土。別怕，這個「鬼」只是來幫忙表示讀音的！
story:
  topic: { en: Brick by Brick, zh-Hans: 一块一块砌砖墙, zh-Hant: 一塊一塊砌磚牆 }
  hook: { en: 'Slap, scrape, plop! The builder lays brick after brick, and the garden wall grows taller and taller.', zh-Hans: 抹一抹，放一放！工人叔叔把砖一块接一块地砌上去，花园的墙越来越高。, zh-Hant: 抹一抹，放一放！工人叔叔把磚一塊接一塊地砌上去，花園的牆越來越高。 }
  turn: { en: 'Simplified 块 swapped 鬼 for 夬, the same part you see in 快 (fast).', zh-Hans: 简化字“块”把“鬼”换成了“夬”，就是快乐的“快”右边那个部分。, zh-Hant: 簡化字把「鬼」換成了「夬」，就是快樂的「快」右邊那個部分。 }
  closer: { en: 'From a lump of dirt to a sturdy red brick: 块 (塊) means a piece or a chunk!', zh-Hans: 从一块泥土，到一块结实的红砖，“块”就是一块一块的“块”！, zh-Hant: 從一塊泥土，到一塊結實的紅磚，「塊」就是一塊一塊的「塊」！ }
journey: default
origin:
  type: phono-semantic
  parts:
    - { char: 土, role: meaning, gloss: { en: earth; dust, zh-Hans: 泥土, zh-Hant: 泥土 } }
    - { char: 鬼, role: sound }
status: draft
