id: 会
text: { Hans: 会, Hant: 會 }
readings: { pinyin: huì }
meaning: { en: 'to meet; meeting, gathering', zh-Hans: 运动会, zh-Hant: 運動會 }
fact:
  en: 會 uses 合, “to meet”, for the meaning, plus another part chosen for its sound.
  zh-Hans: 繁体字“會”用“合”（会合）表示意思，再加上一个表示读音的部分。
  zh-Hant: 「會」用「合」（會合）表示意思，再加上一個表示讀音的部分。
story:
  topic: { en: The Class Meeting, zh-Hans: 班会投票, zh-Hant: 班會投票 }
  hook: { en: 'Hands up! At the class meeting, everyone votes on the class trip: the beach or the mountains?', zh-Hans: 举手！班会上，大家投票决定班级旅行去哪里：海边还是山上？, zh-Hant: 舉手！班會上，大家投票決定班級旅行去哪裡：海邊還是山上？ }
  closer: { en: "合 for meeting, plus a sound part: that's 会 (會), a meeting, as in 班会, the class meeting!", zh-Hans: “合”表示聚在一起，再加上表示读音的部分——这就是班会的“会”！, zh-Hant: 「合」表示聚在一起，再加上表示讀音的部分——這就是班會的「會」！ }
journey: default
origin:
  type: phono-semantic
  parts:
    - { char: 合, role: meaning, gloss: { en: to meet, zh-Hans: 会合, zh-Hant: 會合 } }
    - { char: 𡆧, role: sound }
status: draft
sources:
