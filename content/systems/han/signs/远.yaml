id: 远
text: { Hans: 远, Hant: 遠 }
readings: { pinyin: yuǎn }
meaning: { en: far, zh-Hans: 远方, zh-Hant: 遠方 }
fact:
  en: 遠 (远) pairs the walking part 辶, for the meaning, with 袁 (yuán), whose sound is close to yuǎn.
  zh-Hans: “远”的“辶”表示走路，是意思部分；“元”（yuán）表示读音，和“远”（yuǎn）读起来很像。
  zh-Hant: 「遠」的「辶」表示走路，是意思部分；「袁」（yuán）表示讀音，和「遠」（yuǎn）讀起來很像。
story:
  topic: { en: Mountains on the Horizon, zh-Hans: 天边的远山, zh-Hant: 天邊的遠山 }
  hook: { en: 'Through her binoculars, Mei spots tiny blue mountains far, far away, where the sky meets the land.', zh-Hans: 美美举起望远镜，看见远远的地方有一排小小的蓝色山峰，那里天和地连在了一起。, zh-Hant: 美美舉起望遠鏡，看見遠遠的地方有一排小小的藍色山峰，那裡天和地連在了一起。 }
  turn: { en: 'Simplified 远 swaps 袁 for the simpler 元, which also reads yuán. This handy form already appeared in old printed copies of classic novels before it became the official simplified character.', zh-Hans: 繁体字原来的读音部分是“袁”，简化字换成了更简单的“元”，读音一样。这个写法早就出现在古代印刷的小说里，后来才成为正式的简化字。, zh-Hant: 簡化字把「袁」換成了更簡單的「元」，讀音一樣。這個寫法早就出現在古代印刷的小說裡，後來才成為正式的簡化字。 }
  closer: { en: "So far that you would have to walk and walk to get there: that's 远, far!", zh-Hans: 要走好久好久才能走到，这就是遥远的“远”！, zh-Hant: 要走好久好久才能走到，這就是遙遠的「遠」！ }
journey: default
origin:
  type: phono-semantic
  parts:
    - { char: 辵, role: meaning, gloss: { en: walk, zh-Hans: 走路, zh-Hant: 走路 } }
    - { char: 袁, role: sound }
status: draft
