id: 了
text: { Hans: 了, Hant: 了 }
readings: { pinyin: le }
meaning: { en: 'particle: done, changed', zh-Hans: 好了, zh-Hant: 好了 }
fact:
  en: 了 is a little word that tells you something is done or has changed, as in 好了 (all ready). An old dictionary says it is a picture of a baby without arms; compare 子, where the arms show.
  zh-Hans: “了”是一个小小的字，表示事情做完了或者有了变化，比如“好了”。一本古老的字典说，它画的是没有手臂的小宝宝；比一比“子”，“子”是有手臂的。
  zh-Hant: 「了」是一個小小的字，表示事情做完了或者有了變化，比如「好了」。一本古老的字典說，它畫的是沒有手臂的小寶寶；比一比「子」，「子」是有手臂的。
story:
  topic: { en: The Tower Is Finished!, zh-Hans: 高塔搭好了！, zh-Hant: 高塔堆好了！ }
  hook: { en: 'Wobble, wobble, steady! You set the last block on top of your tower and shout, ‘Done!’', zh-Hans: 晃一晃，稳住！你把最后一块积木放到高塔顶上，大喊：“好了！”, zh-Hant: 晃一晃，穩住！你把最後一塊積木放到高塔頂上，大喊：「好了！」 }
  early: { en: 'An old dictionary describes 了 as a baby with no arms showing, and also as legs crossed at the shins.', zh-Hans: 一本古老的字典说，“了”是一个看不见手臂的小宝宝，又说它表示小腿交叉在一起。, zh-Hant: 一本古老的字典說，「了」是一個看不見手臂的小寶寶，又說它表示小腿交叉在一起。 }
  turn: { en: No one knows for sure how it came to mean finished; most likely it was borrowed for its sound., zh-Hans: 它怎么会有“完了”的意思，谁也说不准；最可能是借用了它的读音。, zh-Hant: 它怎麼會有「完了」的意思，誰也說不準；最可能是借用了它的讀音。 }
  closer: { en: "Done, finished, all changed: that's 了!", zh-Hans: 做好了、做完了、变样了，都用“了”！, zh-Hant: 做好了、做完了、變樣了，都用「了」！ }
