id: 冰
text: { Hans: 冰, Hant: 冰 }
readings: { pinyin: bīng }
meaning: { en: ice, zh-Hans: 冰块, zh-Hant: 冰塊 }
fact:
  en: 冰 is 冫 plus 水 (water). 冫 was the very first sign for ice, and now it gives the sound.
  zh-Hans: “冰”是“冫”加上“水”。“冫”原本就是“冰”最早的字，现在它负责表示读音。
  zh-Hant: 「冰」是「冫」加上「水」。「冫」原本就是「冰」最早的字，現在它負責表示讀音。
story:
  topic: { en: Ice Cubes in the Lemonade, zh-Hans: 柠檬水里的冰块, zh-Hant: 檸檬水裡的冰塊 }
  hook: { en: 'What a hot day! Mom drops ice cubes into the lemonade, and tiny drops of water bead up on the outside of the glass.', zh-Hans: 好热的天！妈妈往柠檬水里放了几块冰，杯子外面马上冒出一颗颗小水珠。, zh-Hant: 好熱的天！媽媽往檸檬水裡放了幾塊冰，杯子外面馬上冒出一顆顆小水珠。 }
  turn: { en: "Later 水 (water) was added next to 冫, and together they became today's 冰.", zh-Hans: 后来，人们在“冫”旁边加上了“水”，合起来就是今天的“冰”。, zh-Hant: 後來，人們在「冫」旁邊加上了「水」，合起來就是今天的「冰」。 }
  closer: { en: 'Water that freezes hard: 冫 plus 水 make 冰, ice!', zh-Hans: 水冻得硬邦邦的，“冫”加“水”，就是冰块的“冰”！, zh-Hant: 水凍得硬邦邦的，「冫」加「水」，就是冰塊的「冰」！ }
