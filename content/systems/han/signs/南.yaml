id: 南
text: { Hans: 南, Hant: 南 }
readings: { pinyin: nán }
meaning: { en: south, zh-Hans: 南边, zh-Hant: 南邊 }
fact:
  en: 南 began as a picture of a tube-shaped container with a lid. It was borrowed for its sound to mean south.
  zh-Hans: “南”最早画的是一个带盖子的筒形容器。后来人们借用它的读音，表示南边。
  zh-Hant: 「南」最早畫的是一個帶蓋子的筒形容器。後來人們借用它的讀音，表示南邊。
story:
  topic: { en: Geese Flying South, zh-Hans: 大雁往南飞, zh-Hant: 大雁往南飛 }
  hook: { en: 'Honk, honk! A V of wild geese flaps across the autumn sky, heading south for the winter.', zh-Hans: 嘎嘎！一群大雁排成“人”字，拍着翅膀飞过秋天的天空，到南方去过冬。, zh-Hant: 嘎嘎！一群大雁排成「人」字，拍著翅膀飛過秋天的天空，到南方去過冬。 }
  early: { en: 'On oracle bones, 南 is a lidded tube, sometimes with little strokes inside, probably showing what it held.', zh-Hans: 在甲骨文里，“南”是一个带盖的筒形容器，有时里面还有几笔，大概表示装着的东西。, zh-Hant: 在甲骨文裡，「南」是一個帶蓋的筒形容器，有時裡面還有幾筆，大概表示裝著的東西。 }
  turn: { en: 'In bronze writing, the tube part later changed into 用.', zh-Hans: 到了金文，筒形的部分后来变成了“用”。, zh-Hant: 到了金文，筒形的部分後來變成了「用」。 }
  closer: { en: "A lidded tube, borrowed for its sound to mean south: that's 南!", zh-Hans: 一个带盖的筒子，被借来表示南边，这就是“南”！, zh-Hant: 一個帶蓋的筒子，被借來表示南邊，這就是「南」！ }
journey: default
origin:
  type: loan
status: draft
sources:
