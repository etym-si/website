id: 难
text: { Hans: 难, Hant: 難 }
readings: { pinyin: nán }
meaning: { en: hard; difficult, zh-Hans: 难题, zh-Hant: 難題 }
fact:
  en: "难 (難) first named a kind of bird: see 隹 (bird) on the right of 難! Later its sound was borrowed for other meanings, like 'hard'."
  zh-Hans: “难”的繁体是“難”，它本来是一种鸟的名字，右边的“隹”就是鸟！后来它的读音被借去表示别的意思，比如困难的“难”。
  zh-Hant: 「難」本來是一種鳥的名字，右邊的「隹」就是鳥！後來它的讀音被借去表示別的意思，比如困難的「難」。
story:
  topic: { en: Halfway Up the Rope, zh-Hans: 爬到一半的绳子, zh-Hant: 爬到一半的繩子 }
  hook: { en: "Halfway up the climbing rope in gym class, Nina's arms start to shake. This is hard!", zh-Hans: 体育课上爬绳子，妮娜爬到一半，手臂就开始发抖：好难啊！, zh-Hant: 體育課上爬繩子，妮娜爬到一半，手臂就開始發抖：好難啊！ }
  turn: { en: Simplified 难 swaps the whole left side of 難 for a quick little 又., zh-Hans: 简体字“难”把“難”左边一大块换成了简单的“又”。, zh-Hant: 簡體字「难」把「難」左邊一大塊換成了簡單的「又」。 }
  closer: { en: "A bird's name that got borrowed: 难 (難) now means hard. Keep practicing, and hard things get easier!", zh-Hans: 鸟的名字被借走啦，“难”现在表示困难。多练习，难事也会变容易！, zh-Hant: 鳥的名字被借走啦，「難」現在表示困難。多練習，難事也會變容易！ }
journey: []
origin:
  type: loan
  parts:
    - { char: 隹, role: meaning, gloss: { en: bird, zh-Hans: 鸟, zh-Hant: 鳥 } }
    - { char: 暵, role: sound }
