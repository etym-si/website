# yaml-language-server: $schema=../../../_schema/sign.schema.json
id: 木
status: reviewed
text: { Hans: 木, Hant: 木 }
readings: { pinyin: mù }
meaning: { en: tree, zh-Hans: 树木, zh-Hant: 樹木 }
fact:
  en: "木 is a tree: branches reaching up on top, roots spreading out below."
  zh-Hans: “木”是一棵树：上面是伸向天空的树枝，下面是向四周伸展的树根。
  zh-Hant: 「木」是一棵樹：上面是伸向天空的樹枝，下面是向四周伸展的樹根。
story:
  topic: { en: "Branches Above, Roots Below", zh-Hans: 上伸枝丫、下扎树根, zh-Hant: 上伸枝丫、下扎樹根 }
  hook:
    en: "A single tree stands by the riverbank: green branches reaching up for sunlight, and roots gripping the soil underground."
    zh-Hans: 河岸边立着一棵树：树枝向上迎着阳光，树根向下紧紧抓住泥土。
    zh-Hant: 河岸邊立著一棵樹：樹枝向上迎著陽光，樹根向下緊緊抓住泥土。
  early:
    en: "Even without leaves, the carved shape is unmistakable: a trunk in the middle, two branches curving up, and two roots curving down."
    zh-Hans: 就算不画树叶，刻出来的样子也一目了然：中间是树干，上面两根分叉是树枝，下面两根分叉是树根。
    zh-Hant: 就算不畫樹葉，刻出來的樣子也一目了然：中間是樹幹，上面兩根分叉是樹枝，下面兩根分叉是樹根。
  turn:
    en: Later, the upward branches flattened into a clean crossbar, while the roots swept out left and right.
    zh-Hans: 后来，向上的树枝变成了一道平平的横画，下面的树根化作了舒展的撇和捺。
    zh-Hant: 後來，向上的樹枝變成了一道平平的橫畫，下面的樹根化作了舒展的撇和捺。
  closer:
    en: That is 木, tree and wood — the building block for hundreds of plant and forest characters!
    zh-Hans: 这就是树木的“木”——许许多多和植物、木材有关的字，都是由它搭出来的！
    zh-Hant: 這就是樹木的「木」——許許多多和植物、木材有關的字，都是由它搭出來的！
