id: 课
text: { Hans: 课, Hant: 課 }
readings: { pinyin: kè }
meaning: { en: lesson; class, zh-Hans: 上课, zh-Hant: 上課 }
fact:
  en: 课 (課) has 言 (to say) for meaning and 果 for sound. It started out meaning 'to assess, to test'.
  zh-Hans: “课”的“讠”（言）表示意思，“果”表示读音。它最早的意思是“考核、检查”。
  zh-Hant: 「課」左邊的「言」表示意思，右邊的「果」表示讀音。它最早的意思是「考核、檢查」。
story:
  topic: { en: My First Piano Lesson, zh-Hans: 第一节钢琴课, zh-Hant: 第一堂鋼琴課 }
  hook: { en: "Plink, plonk! At her very first piano lesson, Xinxin learns to play 'Twinkle, Twinkle, Little Star'.", zh-Hans: 叮叮咚咚！第一节钢琴课上，欣欣学会了弹《小星星》。, zh-Hant: 叮叮咚咚！第一堂鋼琴課上，欣欣學會了彈〈小星星〉。 }
  closer: { en: 'Piano, math, art: every lesson is a 课 (課)! Ready for class?', zh-Hans: 钢琴课、数学课、美术课……每一节都是“课”！准备好上课了吗？, zh-Hant: 鋼琴課、數學課、美術課……每一堂都是「課」！準備好上課了嗎？ }
