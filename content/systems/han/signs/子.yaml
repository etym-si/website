id: 子
status: reviewed
text: { Hans: 子, Hant: 子 }
readings: { pinyin: zǐ }
meaning: { en: child, zh-Hans: 孩子, zh-Hant: 孩子 }
fact:
  en: 子 is a baby with a big head and waving arms, its legs wrapped up in a blanket.
  zh-Hans: “子”是一个大脑袋、挥着小手的婴儿，腿裹在襁褓里。
  zh-Hant: 「子」是一個大腦袋、揮著小手的嬰兒，腿裹在襁褓裡。
story:
  topic: { en: The Waving Baby, zh-Hans: 挥着小手的胖娃娃, zh-Hant: 揮著小手的胖娃娃 }
  hook:
    en: Inside the warm house, a happy baby waves both little arms in the air while its legs are tucked snugly in a swaddling blanket.
    zh-Hans: 温暖的屋子里，一个胖娃娃裹在襁褓里，正开心地挥舞着两只小手。
    zh-Hant: 溫暖的屋子裡，一個胖娃娃裹在襁褓裡，正開心地揮舞著兩隻小手。
  turn:
    en: In oracle bone, bronze, and seal scripts, you can see the baby’s round head on top, two outstretched arms in the middle, and wrapped legs below.
    zh-Hans: 在甲骨文、金文和篆书里，顶上是圆圆的小脑袋，中间一横是张开的双臂，下面是裹在一起的双腿。
    zh-Hant: 在甲骨文、金文和篆書裡，頂上是圓圓的小腦袋，中間一橫是張開的雙臂，下面是裹在一起的雙腿。
  closer:
    en: "Round head, open arms, swaddled legs: that is 子, child!"
    zh-Hans: 大脑袋、张开的小手、裹着的襁褓：这就是孩子的“子”！
    zh-Hant: 大腦袋、張開的小手、裹著的襁褓：這就是孩子的「子」！
journey: default
