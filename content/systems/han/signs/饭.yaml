id: 饭
text: { Hans: 饭, Hant: 飯 }
readings: { pinyin: fàn }
meaning: { en: cooked rice; meal, zh-Hans: 米饭, zh-Hant: 米飯 }
fact:
  en: '饭 (飯) has 食 (food) on the left, written 饣 in simplified, and 反 on the right for sound: 反 (fǎn) sounds a lot like 饭 (fàn).'
  zh-Hans: “饭”左边的“饣”就是“食”（食物），表示意思；右边的“反”表示读音，“反”（fǎn）和“饭”（fàn）读起来很像。
  zh-Hant: 「飯」左邊的「食」（食物）表示意思，右邊的「反」表示讀音，「反」（fǎn）和「飯」（fàn）讀起來很像。
story:
  topic: { en: Fluffy White Rice, zh-Hans: 香喷喷的白米饭, zh-Hant: 香噴噴的白米飯 }
  hook: { en: 'Steam puffs out as Mom lifts the rice cooker lid, and the smell of fluffy white rice fills the kitchen.', zh-Hans: 妈妈一掀开电饭锅的盖子，白白的热气就冒了出来，满屋都是米饭香。, zh-Hant: 媽媽一掀開電鍋的蓋子，白白的熱氣就冒了出來，滿屋子都是米飯香。 }
  closer: { en: "A bowl of fluffy rice, a whole family meal: that's 饭 (飯)!", zh-Hans: 一碗香喷喷的米饭，一桌热乎乎的饭菜，都是“饭”！, zh-Hant: 一碗香噴噴的米飯，一桌熱騰騰的飯菜，都是「飯」！ }
journey: default
origin:
  type: phono-semantic
  parts:
    - { char: 食, role: meaning, gloss: { en: food, zh-Hans: 食物, zh-Hant: 食物 } }
    - { char: 反, role: sound }
