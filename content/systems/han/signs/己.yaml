id: 己
text: { Hans: 己, Hant: 己 }
readings: { pinyin: jǐ }
meaning: { en: 'self, oneself', zh-Hans: 自己, zh-Hant: 自己 }
fact:
  en: 己 began as a picture of a silk rope for tying things up; it is the original form of 纪. Today it means self, as in 自己.
  zh-Hans: “己”最早画的是一根用来捆东西的丝绳，它是“纪”最早的写法。今天它表示自己。
  zh-Hant: 「己」最早畫的是一根用來捆東西的絲繩，它是「紀」最早的寫法。今天它表示自己。
story:
  topic: { en: My Very Own Name Tag, zh-Hans: 我自己的名牌, zh-Hant: 我自己的名牌 }
  hook: { en: 'On the first day of school, you carefully write your own name on your name tag, stroke by stroke.', zh-Hans: 开学第一天，你在名牌上一笔一画地写下自己的名字。, zh-Hant: 開學第一天，你在名牌上一筆一畫地寫下自己的名字。 }
  early: { en: The oldest 己 is a silk rope for tying things together., zh-Hans: 最古老的“己”是一根用来把东西捆在一起的丝绳。, zh-Hant: 最古老的「己」是一根用來把東西捆在一起的絲繩。 }
  closer: { en: 'Watch out: 己, 已 and 巳 look almost the same! 己 is the one in 自己, yourself.', zh-Hans: 小心：“己”“已”“巳”长得几乎一样！“己”是自己的“己”。, zh-Hant: 小心：「己」「已」「巳」長得幾乎一樣！「己」是自己的「己」。 }
journey: default
origin:
  type: pictogram
