id: 众
text: { Hans: 众, Hant: 眾 }
readings: { pinyin: zhòng }
meaning: { en: 'crowd, many people', zh-Hans: 观众, zh-Hant: 觀眾 }
fact:
  en: '众 is three people 人 together: a crowd! The traditional 眾 also has a part on top that was once a sun.'
  zh-Hans: “众”是三个“人”聚在一起——一大群人！繁体字“眾”上面还有一部分，最早是一个太阳。
  zh-Hant: 「眾」下面是三個人，聚在一起就是一大群人！它上面的部分，最早是一個太陽。
story:
  topic: { en: Doing the Wave, zh-Hans: 体育场的人浪, zh-Hant: 體育場的人浪 }
  hook: { en: 'Under the bright sun, the whole stadium crowd jumps up and does the wave, row after row!', zh-Hans: 灿烂的阳光下，整个体育场的观众一排接一排站起来，掀起了人浪！, zh-Hant: 燦爛的陽光下，整個體育場的觀眾一排接一排站起來，掀起了人浪！ }
  early: { en: 'On oracle bones, it shows a sun 日 above three people: a crowd gathered or working under the sun.', zh-Hans: 在甲骨文里，它画的是太阳“日”下面有三个人：一群人在太阳底下聚集或干活。, zh-Hant: 在甲骨文裡，它畫的是太陽「日」下面有三個人：一群人在太陽底下聚集或做工。 }
  turn: { en: 'In bronze writing the sun turned into a sideways eye, so people read it as “a crowd being watched”; today that top looks like 罒. Simplified 众 keeps just the three people.', zh-Hans: 到了金文，太阳变成了一只横着的眼睛，人们就把它理解成“被人看着的一群人”，现在这部分写得像“罒”。简体字“众”只留下了三个人。, zh-Hant: 到了金文，太陽變成了一隻橫著的眼睛，人們就把它理解成「被人看著的一群人」，現在這部分寫得像「罒」。簡體字「众」只留下了三個人。 }
  closer: { en: 'One person is 人, and three together make 众 (眾), a crowd!', zh-Hans: 一个人是“人”，三个人聚在一起，就是观众的“众”！, zh-Hant: 一個人是「人」，三個人聚在一起，就成了一大群——這就是觀眾的「眾」！ }
