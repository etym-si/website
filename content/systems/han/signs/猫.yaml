id: 猫
text: { Hans: 猫, Hant: 貓 }
readings: { pinyin: māo }
meaning: { en: cat, zh-Hans: 小猫, zh-Hant: 小貓 }
fact:
  en: In 猫, the dog part 犭 gives the meaning and 苗 gives the sound. The traditional 貓 has 豸 on the left instead.
  zh-Hans: “猫”左边的“犭”表示意思，右边的“苗”表示读音。繁体字的左边写的是“豸”。
  zh-Hant: 「貓」左邊的「豸」表示意思，右邊的「苗」表示讀音；簡化字的左邊則寫成「犭」。
story:
  topic: { en: A Nap in the Sunshine, zh-Hans: 晒太阳的猫咪, zh-Hant: 曬太陽的貓咪 }
  hook: { en: 'Purr, purr! A fluffy cat curls up in a warm patch of sunshine on the windowsill and closes its eyes.', zh-Hans: 呼噜，呼噜！一只毛茸茸的猫咪蜷在窗台上暖洋洋的阳光里，眯起了眼睛。, zh-Hant: 呼嚕，呼嚕！一隻毛茸茸的貓咪蜷在窗臺上暖洋洋的陽光裡，瞇起了眼睛。 }
  closer: { en: 'Meow! 犭 plus 苗 makes 猫, the cat (written 貓 in traditional characters).', zh-Hans: 喵！“犭”加上“苗”，就是小猫的“猫”。, zh-Hant: 喵！「豸」加上「苗」，就是小貓的「貓」。 }
journey: default
origin:
  type: phono-semantic
  parts:
    - { char: 犬, role: meaning, gloss: { en: dog, zh-Hans: 狗, zh-Hant: 狗 } }
    - { char: 苗, role: sound }
