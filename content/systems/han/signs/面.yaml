id: 面
text: { Hans: 面, Hant: 面 }
readings: { pinyin: miàn }
meaning: { en: face; side, zh-Hans: 面具, zh-Hant: 面具 }
fact:
  en: 面 means face. In simplified Chinese it also writes 'noodles', which is 麵 in traditional!
  zh-Hans: “面”就是脸。在简体字里，它还代表面条的“面”，繁体写作“麵”！
  zh-Hant: 「面」就是臉。在簡體字裡，「面」也用來寫麵條的「麵」！
story:
  topic: { en: 'Peekaboo, Little Sister!', zh-Hans: 躲猫猫的小妹妹, zh-Hant: 躲貓貓的小妹妹 }
  hook: { en: 'Peekaboo! Little sister hides her face behind her hands, then pops out with a giggle.', zh-Hans: 躲猫猫！小妹妹用小手捂住脸，然后咯咯笑着把小脸露了出来。, zh-Hant: 躲貓貓！小妹妹用小手摀住臉，然後咯咯笑著把小臉露了出來。 }
  early: { en: "The oldest 面 is a face with one eye drawn extra big, as if it's staring right at you.", zh-Hans: 最早的“面”是一张脸，眼睛画得特别大，好像正盯着你看。, zh-Hant: 最早的「面」是一張臉，眼睛畫得特別大，好像正盯著你看。 }
  turn: { en: "Later a flat stroke was added on top, giving us today's 面.", zh-Hans: 后来，上面又加了一横，就成了今天的“面”。, zh-Hant: 後來，上面又加了一橫，就成了今天的「面」。 }
  closer: { en: 'A face with a big, staring eye: that is 面, face — peekaboo, I see you!', zh-Hans: 一张瞪着大眼睛的脸：这就是“面”——躲猫猫，看见你啦！, zh-Hant: 一張瞪著大眼睛的臉：這就是「面」——躲貓貓，看到你囉！ }
