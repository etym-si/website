id: 公
text: { Hans: 公, Hant: 公 }
readings: { pinyin: gōng }
meaning: { en: 'public, shared, fair', zh-Hans: 公园, zh-Hant: 公園 }
fact:
  en: 'No one is completely sure how 公 was made. One old idea says it is 八, “turning away from”, plus 厶, “private”: the opposite of private, which is public!'
  zh-Hans: “公”到底是怎么造出来的，没有人能完全确定。一种古老的说法是：“八”表示“相背”，“厶”表示“私”，和“私”相反，就是“公”！
  zh-Hant: 「公」到底是怎麼造出來的，沒有人能完全確定。一種古老的說法是：「八」表示「相背」，「厶」表示「私」，和「私」相反，就是「公」！
story:
  topic: { en: A Bus for Everyone, zh-Hans: 大家的公交车, zh-Hant: 大家的公車 }
  hook: { en: 'Hop on! The city bus is for everyone: grandmas with shopping bags, kids with backpacks, even a man with a tuba!', zh-Hans: 上车喽！公交车是大家的：提着菜篮子的奶奶、背着书包的小朋友，还有一位抱着大号的叔叔！, zh-Hant: 上車囉！公車是大家的：提著菜籃子的奶奶、背著書包的小朋友，還有一位抱著低音號的叔叔！ }
  early: { en: 'Other scholars think it shows dividing things up equally, or even a picture of a big round jar!', zh-Hans: 也有学者认为，它表示把东西平均分给大家；还有人认为，它原本画的是一个圆圆的大罐子！, zh-Hant: 也有學者認為，它表示把東西平均分給大家；還有人認為，它原本畫的是一個圓圓的大罐子！ }
  closer: { en: "Not just mine, not just yours, but everyone's: that's 公, public!", zh-Hans: 不只是我的，也不只是你的，而是大家的——这就是公共的“公”！, zh-Hant: 不只是我的，也不只是你的，而是大家的——這就是公共的「公」！ }
