id: 须
text: { Hans: 须, Hant: 須 }
readings: { pinyin: xū }
meaning: { en: 'must, have to', zh-Hans: 必须, zh-Hant: 必須 }
fact:
  en: "须 (須) began as a picture of a head with hair along its side: a beard! Today it mostly means 'must', as in 必须."
  zh-Hans: “须”最早画的是一个脑袋，旁边长着毛——就是胡须！今天它常用来表示“必须”。
  zh-Hant: 「須」最早畫的是一個腦袋，旁邊長著毛——就是鬍鬚！今天它常用來表示「必須」。
story:
  topic: { en: Dad's Morning Shave, zh-Hans: 爸爸早上刮胡子, zh-Hant: 爸爸早上刮鬍子 }
  hook: { en: 'Bzzz! Every morning, Dad has to shave his scratchy whiskers before work.', zh-Hans: 嗡嗡嗡！每天早上，爸爸上班前都必须把扎人的胡子刮干净。, zh-Hant: 嗡嗡嗡！每天早上，爸爸上班前都必須把刺刺的鬍子刮乾淨。 }
  early: { en: 'The oldest 須 is one single picture: a head with hair growing along its side.', zh-Hans: 最早的“须”是一幅完整的图画：一个脑袋，旁边长着毛。, zh-Hant: 最早的「須」是一幅完整的圖畫：一個腦袋，旁邊長著毛。 }
  turn: { en: 'In seal script, the picture split into two parts: 彡 (hair) and 页 (頁, head).', zh-Hans: 到了篆书，这幅图拆成了两部分：表示毛发的“彡”和表示头的“页”。, zh-Hant: 到了篆書，這幅圖拆成了兩部分：表示毛髮的「彡」和表示頭的「頁」。 }
  closer: { en: "Hair 彡 beside a head 页: that is 须 — once a beard, now the 'must' in 必须!", zh-Hans: “彡”是毛发，“页”是脑袋：这就是“须”——从前是胡须，现在是必须的“须”！, zh-Hant: 「彡」是毛髮，「頁」是腦袋：這就是「須」！它原本畫的是鬍鬚，現在是必須的「須」。 }
