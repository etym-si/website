id: 灰
text: { Hans: 灰, Hant: 灰 }
readings: { pinyin: huī }
meaning: { en: ash; gray, zh-Hans: 灰色, zh-Hant: 灰色 }
fact:
  en: "灰 is a hand 又 and fire 火: fire you can touch with your hand. That's ash!"
  zh-Hans: “灰”由手“又”和火“火”组成：能用手去摸的火，就是灰烬！
  zh-Hant: 「灰」由手「又」和火「火」組成：能用手去摸的火，就是灰燼！
story:
  topic: { en: When the Campfire Goes Out, zh-Hans: 篝火熄灭以后, zh-Hant: 營火熄滅以後 }
  hook: { en: 'Crackle, pop, hush! The campfire slowly burns down until only soft gray ash is left in the ring of stones.', zh-Hans: 劈啪，劈啪……篝火慢慢烧完了，石头围成的圈里只剩下软软的灰。, zh-Hant: 劈啪，劈啪……營火慢慢燒完了，石頭圍成的圈裡只剩下軟軟的灰。 }
  turn: { en: 'Later the hand 又 took a new shape, the same one hiding in 友 (friend) and 右 (right).', zh-Hans: 后来，手“又”换了个样子，跟“友”和“右”里藏着的手一模一样。, zh-Hant: 後來，手「又」換了個樣子，跟「友」和「右」裡藏著的手一模一樣。 }
  closer: { en: "Fire you can touch with your hand: that's 灰, ash!", zh-Hans: 能用手摸的火，就是灰烬的“灰”！, zh-Hant: 能用手摸的火，就是灰燼的「灰」！ }
journey: default
origin:
  type: compound-ideogram
  parts:
    - { char: 又, role: meaning, gloss: { en: hand, zh-Hans: 手, zh-Hant: 手 } }
    - { char: 火, role: meaning, gloss: { en: fire, zh-Hans: 火, zh-Hant: 火 } }
