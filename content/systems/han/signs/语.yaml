id: 语
text: { Hans: 语, Hant: 語 }
readings: { pinyin: yǔ }
meaning: { en: language, zh-Hans: 语言, zh-Hant: 語言 }
fact:
  en: '语 (語) has 言 for meaning and 吾 for sound. The Shuowen dictionary explains: saying something straight out is 言, while discussing and debating is 语 (語).'
  zh-Hans: “语”的“讠”（言）表示意思，“吾”表示读音。《说文解字》说：直接说出来是“言”，和别人讨论、辩论是“语”。
  zh-Hant: 「語」的「言」表示意思，「吾」表示讀音。《說文解字》說：直接說出來是「言」，和別人討論、辯論是「語」。
story:
  topic: { en: Hello in Five Languages, zh-Hans: 五种语言说你好, zh-Hant: 五種語言說你好 }
  hook: { en: 'Bonjour, hola, 你好! At the world culture fair, Sam learns to say hello in five languages.', zh-Hans: Bonjour、Hola、你好！在世界文化节上，小山学会了用五种语言打招呼。, zh-Hant: Bonjour、Hola、你好！在世界文化節上，小山學會了用五種語言打招呼。 }
  closer: { en: '汉语, 英语, 法语: every language has a 语 (語) in its name!', zh-Hans: 汉语、英语、法语……每一种语言，都有一个“语”！, zh-Hant: 華語、英語、法語……每一種語言，都有一個「語」！ }
