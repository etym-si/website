id: 日
status: reviewed
text: { Hans: 日, Hant: 日 }
readings: { pinyin: rì }
meaning: { en: sun, zh-Hans: 太阳, zh-Hant: 太陽 }
fact:
  en: "The first 日 was a circle with a dot: the shining sun. Later the circle became a square, because squares are easier to carve and write."
  zh-Hans: 最早的“日”是一个圆圈，中间有一个点，就像发光的太阳。后来圆圈变成了方框，因为方框更容易刻，也更容易写。
  zh-Hant: 最早的「日」是一個圓圈，中間有一個點，就像發光的太陽。後來圓圈變成了方框，因為方框更容易刻，也更容易寫。
story:
  topic: { en: Catching the Morning Sun, zh-Hans: 留住清晨的太阳, zh-Hant: 留住清晨的太陽 }
  hook:
    en: Roosters crow! Up in the morning sky shines a warm, round ball of light.
    zh-Hans: 公鸡喔喔叫！清晨的天空上，挂着一轮暖洋洋的圆太阳。
    zh-Hant: 公雞喔喔叫！清晨的天空上，掛著一輪暖洋洋的圓太陽。
  early:
    en: Carving a round circle on hard bone with a knife was tricky, so carvers made an outline with a bright mark in the middle.
    zh-Hans: 拿小刀在坚硬的骨头上刻圆圈可不容易，于是刻字的人刻出边框，中间加上代表光芒的一笔。
    zh-Hant: 拿小刀在堅硬的骨頭上刻圓圈可不容易，於是刻字的人刻出邊框，中間加上代表光芒的一筆。
  turn:
    en: When brushes replaced knives, the round sun squared off into a neat window with one horizontal bar inside.
    zh-Hans: 后来毛笔代替了刻刀，圆圆的太阳就变成了方方正正的框，中间留着一横。
    zh-Hant: 後來毛筆代替了刻刀，圓圓的太陽就變成了方方正正的框，中間留著一橫。
  closer:
    en: That bright sky-window is 日, the sun — and also a whole day from sunrise to sunset!
    zh-Hans: 这扇装满阳光的小窗户就是“日”——既是太阳，也代表从早到晚的一整天！
    zh-Hant: 這扇裝滿陽光的小窗戶就是「日」——既是太陽，也代表從早到晚的一整天！
