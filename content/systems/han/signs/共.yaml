id: 共
text: { Hans: 共, Hant: 共 }
readings: { pinyin: gòng }
meaning: { en: 'together, in all', zh-Hans: 一共, zh-Hant: 一共 }
fact:
  en: 共 shows two hands 廾 holding up an object 口. Here the 口 isn't a mouth, just a thing!
  zh-Hans: “共”画的是两只手“廾”捧着一样东西“口”。这里的“口”不是嘴巴，而是一样东西！
  zh-Hant: 「共」畫的是兩隻手「廾」捧著一樣東西「口」。這裡的「口」不是嘴巴，而是一樣東西！
story:
  topic: { en: One Pizza for Everyone, zh-Hans: 大家一起分比萨, zh-Hant: 大家一起分披薩 }
  hook: { en: "One, two, three… eight! Eight friends share one giant pizza, so that's eight slices in all.", zh-Hans: 一、二、三……八！八个好朋友一起分一个大比萨，一共八块。, zh-Hant: 一、二、三……八！八個好朋友一起分一個大披薩，一共八塊。 }
  turn: { en: 'Over time the object 口 came to be written 廿, and it fused with the hands 廾 into the 共 we write today.', zh-Hans: 后来，那个“口”被写成了“廿”，又和两只手“廾”合在一起，变成了今天的“共”。, zh-Hant: 後來，那個「口」被寫成了「廿」，又和兩隻手「廾」合在一起，變成了今天的「共」。 }
  closer: { en: "Two hands lifting something up: that's 共, as in 一共, all together!", zh-Hans: 两只手把东西捧起来——这就是一共的“共”！, zh-Hant: 兩隻手把東西捧起來——這就是一共的「共」！ }
journey: default
origin:
  type: compound-ideogram
  parts:
    - { char: 廾, role: meaning, gloss: { en: two hands, zh-Hans: 两只手, zh-Hant: 兩隻手 } }
    - { char: 口, role: meaning, gloss: { en: an object, zh-Hans: 东西, zh-Hant: 東西 } }
status: draft
sources:
