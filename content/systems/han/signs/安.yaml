id: 安
text: { Hans: 安, Hant: 安 }
readings: { pinyin: ān }
meaning: { en: 'safe, calm', zh-Hans: 平安, zh-Hant: 平安 }
fact:
  en: 安 has a roof 宀 on top for the meaning, and under it a woman 女 seated on a cushion for the sound. It first meant “to sit at ease”.
  zh-Hans: “安”上面的“宀”是屋顶，表示意思；下面是一位坐在垫子上的女子“女”，表示读音。它最早的意思是“安安稳稳地坐着”。
  zh-Hant: 「安」上面的「宀」是屋頂，表示意思；下面是一位坐在墊子上的女子「女」，表示讀音。它最早的意思是「安安穩穩地坐著」。
story:
  topic: { en: A Peaceful Hammock, zh-Hans: 吊床上真安静, zh-Hant: 吊床上真安靜 }
  hook: { en: 'Ahh… Dad sways gently in the hammock, calm and peaceful, while the birds sing softly above.', zh-Hans: 啊……爸爸躺在吊床上轻轻地摇呀摇，安安静静的，只听见头顶的小鸟在轻声歌唱。, zh-Hant: 啊……爸爸躺在吊床上輕輕地搖呀搖，安安靜靜的，只聽見頭頂的小鳥在輕聲歌唱。 }
  closer: { en: "A roof 宀 on top, a seated 女 below: that's 安, safe and calm!", zh-Hans: 上面是屋顶“宀”，下面坐着“女”——这就是平安的“安”！, zh-Hant: 上面是屋頂「宀」，下面坐著「女」——這就是平安的「安」！ }
