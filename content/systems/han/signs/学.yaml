id: 学
text: { Hans: 学, Hant: 學 }
readings: { pinyin: xué }
meaning: { en: 'to learn, to study', zh-Hans: 学习, zh-Hant: 學習 }
fact:
  en: No one is completely sure how 学 (學) began. It may have started as 爻 and 六, both there for the sound; later two hands and a child 子 were added.
  zh-Hans: “学”的繁体字“學”是怎么来的，还没有定论。它可能最早只是“爻”和“六”，都用来表示读音；后来又加上了两只手和一个孩子“子”。
  zh-Hant: 「學」是怎麼來的，還沒有定論。它可能最早只是「爻」和「六」，都用來表示讀音；後來又加上了兩隻手和一個孩子「子」。
story:
  topic: { en: Learning to Hula-Hoop, zh-Hans: 学转呼啦圈, zh-Hant: 學轉呼拉圈 }
  hook: { en: 'Wiggle, wiggle, whirl! After a hundred tries, a girl finally learns to keep the hula hoop spinning.', zh-Hans: 扭一扭，转一转！试了一百次，小女孩终于学会让呼啦圈一直转下去了。, zh-Hant: 扭一扭，轉一轉！試了一百次，小女孩終於學會讓呼拉圈一直轉下去了。 }
  turn: { en: "In today's traditional 學, the 六 has turned into a cover 冖, and the two hands around 爻 are joined to it. The child 子 still sits at the bottom.", zh-Hans: 在今天的繁体字“學”里，“六”变成了“冖”，围着“爻”的两只手也和它连在了一起。孩子“子”还坐在最下面。, zh-Hant: 在今天的「學」裡，「六」變成了「冖」，圍著「爻」的兩隻手也和它連在了一起。孩子「子」還坐在最下面。 }
  closer: { en: "A child 子 sitting down to learn: that's 学 (學), to learn and study!", zh-Hans: 下面坐着一个用功的孩子，这就是学习的“学”！, zh-Hant: 下面坐著一個用功的孩子，這就是學習的「學」！ }
