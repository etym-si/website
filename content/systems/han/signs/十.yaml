id: 十
text: { Hans: 十, Hant: 十 }
readings: { pinyin: shí }
meaning: { en: ten, zh-Hans: 十个, zh-Hant: 十個 }
fact:
  en: 'On oracle bones, 十 is mostly one standing-up stroke: one lying-down line is one, and one standing line is ten! Later a flat stroke was added, making the cross we write today.'
  zh-Hans: 在甲骨文里，“十”大多只是一竖：躺着的一横是一，站着的一竖就是十！后来又加上一横，成了今天的十字形。
  zh-Hant: 在甲骨文裡，「十」大多只是一豎：躺著的一橫是一，站著的一豎就是十！後來又加上一橫，成了今天的十字形。
story:
  topic: { en: 'Ten Fingers, Ten Toes', zh-Hans: 十根手指，十根脚趾, zh-Hant: 十根手指，十根腳趾 }
  hook: { en: 'Wiggle your fingers, wiggle your toes: count them all, and you get ten of each!', zh-Hans: 动动手指，动动脚趾：数一数，各有十个！, zh-Hant: 動動手指，動動腳趾：數一數，各有十個！ }
  early: { en: 'On oracle bones, 十 is mostly a single standing stroke, sometimes with a dot in the middle. Some scholars think it first showed a needle (针) and was borrowed for ten.', zh-Hans: 在甲骨文里，“十”大多是一竖，有时中间还有一个点。有学者认为，它最早画的是一根针，后来被借来表示十。, zh-Hant: 在甲骨文裡，「十」大多是一豎，有時中間還有一個點。有學者認為，它最早畫的是一根針，後來被借來表示十。 }
  turn: { en: 'Later a flat 一 was added across it, making the cross we write today.', zh-Hans: 后来，人们在它上面加了一横，成了今天的十字形。, zh-Hant: 後來，人們在它上面加了一橫，成了今天的十字形。 }
  closer: { en: 'One lying-down line is 一; a standing line with a crossbar is 十, ten!', zh-Hans: 躺着的一横是“一”，站着的一竖加上一横，就是“十”！, zh-Hant: 躺著的一橫是「一」，站著的一豎加上一橫，就是「十」！ }
journey: default
origin:
