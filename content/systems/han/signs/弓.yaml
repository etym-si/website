# yaml-language-server: $schema=../../../_schema/sign.schema.json
id: 弓
status: reviewed
text: { Hans: 弓, Hant: 弓 }
readings: { pinyin: gōng }
meaning: { en: bow, zh-Hans: 弓箭, zh-Hant: 弓箭 }
fact:
  en: 弓 is a bow for shooting arrows. Some of the oldest versions even show the string.
  zh-Hans: “弓”是射箭用的弓，有些最古老的写法还画出了弓弦。
  zh-Hant: 「弓」是射箭用的弓，有些最古老的寫法還畫出了弓弦。
story:
  topic: { en: The Bent Wooden Bow, zh-Hans: 弯弯的射箭长弓, zh-Hant: 彎彎的射箭長弓 }
  hook:
    en: "To scare the tiger away, bend a flexible wooden bow and pull the bowstring taut: twang!"
    zh-Hans: 为了吓跑大老虎，拉满一张富有弹性的木弓——嘣！
    zh-Hant: 為了嚇跑大老虎，拉滿一張富有彈性的木弓——嘣！
  turn:
    en: "The double-curved shape of 弓 is a reflex bow: when unstrung or drawn, its wooden limbs curve like a wave."
    zh-Hans: “弓”那一道道优美的弯折，正是古代反曲弓的形状：弓身弯曲，充满力量。
    zh-Hant: 「弓」那一道道優美的彎折，正是古代反曲弓的形狀：弓身彎曲，充滿力量。
  closer:
    en: With just three winding brush strokes, 弓 still looks like a bent wooden bow ready to launch an arrow!
    zh-Hans: 只用弯弯曲曲的三笔，今天的“弓”看起来依然像一张蓄势待发的良弓！
    zh-Hant: 只用彎彎曲曲的三筆，今天的「弓」看起來依然像一張蓄勢待發的良弓！
journey: default
