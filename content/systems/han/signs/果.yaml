id: 果
text: { Hans: 果, Hant: 果 }
readings: { pinyin: guǒ }
meaning: { en: fruit, zh-Hans: 水果, zh-Hant: 水果 }
fact:
  en: 果 shows fruit growing on a tree. Look for the tree, 木, at the bottom!
  zh-Hans: “果”画的是长在树上的果子。找一找，下面就是树“木”！
  zh-Hant: 「果」畫的是長在樹上的果子。找一找，下面就是樹「木」！
story:
  topic: { en: Apple-Picking Day, zh-Hans: 摘苹果的日子, zh-Hant: 摘蘋果的日子 }
  hook: { en: 'Reach, pick, plop! You stretch up into the apple tree and drop shiny red apples into your basket.', zh-Hans: 伸手，摘下，放好！你踮起脚，从苹果树上摘下红彤彤的苹果，放进篮子里。, zh-Hant: 伸手，摘下，放好！你踮起腳，從蘋果樹上摘下紅通通的蘋果，放進籃子裡。 }
  early: { en: The oldest 果 shows a tree with fruit on its branches., zh-Hans: 最早的“果”画的是一棵树，树枝上结着果子。, zh-Hant: 最早的「果」畫的是一棵樹，樹枝上結著果子。 }
  closer: { en: 'Fruit up top, tree 木 below: that is 果, as in 水果!', zh-Hans: 上面是果子，下面是树“木”：这就是水果的“果”！, zh-Hant: 上面是果子，下面是樹「木」：這就是水果的「果」！ }
journey: default
origin:
  type: pictogram
status: draft
sources:
  - { title: 'Wiktionary: 果', url: 'https://en.wiktionary.org/wiki/%E6%9E%9C' }
