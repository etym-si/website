id: 旁
text: { Hans: 旁, Hant: 旁 }
readings: { pinyin: páng }
meaning: { en: side; beside, zh-Hans: 旁边, zh-Hant: 旁邊 }
fact:
  en: "The bottom of 旁 is 方, the sound part. The top is a puzzle: scholars still aren't sure what it meant."
  zh-Hans: “旁”下面的“方”表示读音。上面的部分是个谜，学者们到现在还说不清它的意思。
  zh-Hant: 「旁」下面的「方」表示讀音。上面的部分是個謎，學者們到現在還說不清它的意思。
story:
  topic: { en: Saving a Seat for a Friend, zh-Hans: 给好朋友留个座位, zh-Hant: 幫好朋友留個座位 }
  hook: { en: 'Over here! Yoyo pats the empty seat right beside her on the school bus, and her best friend hurries over.', zh-Hans: 这边，这边！悠悠拍拍校车上自己旁边的空座位，好朋友赶紧跑了过来。, zh-Hant: 這邊，這邊！悠悠拍拍校車上自己旁邊的空座位，好朋友趕緊跑了過來。 }
  turn: { en: "That top part kept changing shape: first 冖, then 同, then other forms, until today's 旁 grew out of clerical script.", zh-Hans: 上面这部分一直在变：先是“冖”，后来是“同”，还有别的样子，今天的“旁”是从隶书演变来的。, zh-Hant: 上面這部分一直在變：先是「冖」，後來是「同」，還有別的樣子，今天的「旁」是從隸書演變來的。 }
  closer: { en: "Side by side, close together: that's 旁, beside!", zh-Hans: 肩并肩，挨在一起，这就是旁边的“旁”！, zh-Hant: 肩並肩，挨在一起，這就是旁邊的「旁」！ }
journey: default
origin:
  type: phono-semantic
  parts:
    - { char: 方, role: sound }
status: draft
sources:
