id: 这
text: { Hans: 这, Hant: 這 }
readings: { pinyin: zhè }
meaning: { en: this, zh-Hans: 这个, zh-Hant: 這個 }
fact:
  en: 这 (這) was first a verb meaning 'to meet', with 辶 for walking and 言 for the sound. Later it was borrowed to mean 'this', after old handwriting mixed it up with 遮.
  zh-Hans: “这”的繁体字“這”，本来是表示“迎接”的动词：“辶”表示走路，“言”表示读音。后来，古时候手写时它跟“遮”弄混了，就被借来表示“这个”。
  zh-Hant: 「這」本來是表示「迎接」的動詞：「辶」表示走路，「言」表示讀音。後來，古時候手寫時它跟「遮」弄混了，就被借來表示「這個」。
story:
  topic: { en: 'This One, Please!', zh-Hans: 我要这一朵！, zh-Hant: 我要這一朵！ }
  hook: { en: 'This one, please! At the flower stall, a girl points to the brightest yellow tulip in the bucket.', zh-Hans: 我要这一朵！在花摊前，小女孩指着桶里最鲜艳的那朵黄色郁金香。, zh-Hant: 我要這一朵！在花攤前，小女孩指著桶裡最鮮豔的那朵黃色鬱金香。 }
  closer: { en: "From 'to meet' to 'this one right here': that's 这 (這), this!", zh-Hans: 从“迎接”变成了“这个”，这就是这里的“这”！, zh-Hant: 從「迎接」變成了「這個」，這就是這裡的「這」！ }
