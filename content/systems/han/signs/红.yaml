id: 红
text: { Hans: 红, Hant: 紅 }
readings: { pinyin: hóng }
meaning: { en: red, zh-Hans: 红色, zh-Hant: 紅色 }
fact:
  en: 红 (紅) has the silk part 糸 on the left for the meaning and 工 on the right for the sound.
  zh-Hans: “红”左边的绞丝旁“纟”表示丝，是意思部分；右边的“工”表示读音。
  zh-Hant: 「紅」左邊的「糸」表示絲，是意思部分；右邊的「工」表示讀音。
story:
  topic: { en: Red Envelopes for New Year, zh-Hans: 过年的红包, zh-Hant: 過年的紅包 }
  hook: { en: 'Happy New Year! Grandma hands out bright red envelopes, and everyone says thank you with a big smile.', zh-Hans: 新年快乐！奶奶给大家发红彤彤的红包，大家都开开心心地说谢谢。, zh-Hant: 新年快樂！奶奶給大家發紅通通的紅包，大家都開開心心地說謝謝。 }
  closer: { en: 'Silk for the meaning and 工 for the sound: 红 (紅) is red, the color of happy holidays!', zh-Hans: 绞丝旁加上“工”，就是红红火火的“红”！, zh-Hant: 「糸」加上「工」，就是紅紅火火的「紅」！ }
journey: default
origin:
  type: phono-semantic
  parts:
    - { char: 糸, role: meaning, gloss: { en: silk, zh-Hans: 丝, zh-Hant: 絲 } }
    - { char: 工, role: sound }
status: draft
sources:
  - { title: 'Wiktionary: 红', url: 'https://en.wiktionary.org/wiki/%E7%BA%A2' }
  - { title: 'Wiktionary: 紅', url: 'https://en.wiktionary.org/wiki/%E7%B4%85' }
