id: 户
text: { Hans: 户, Hant: 戶 }
readings: { pinyin: hù }
meaning: { en: door; household, zh-Hans: 窗户, zh-Hant: 窗戶 }
fact:
  en: '户 (戶) is a single door: one half of the double gate 門 (门).'
  zh-Hans: “户”就是一扇门。繁体的“門”有两扇门，“户”就是它的一半。
  zh-Hant: 「戶」就是一扇門。「門」有兩扇門，「戶」就是它的一半。
story:
  topic: { en: The Cat's Little Door, zh-Hans: 猫咪的小木门, zh-Hant: 貓咪的小木門 }
  hook: { en: 'Good morning! The little wooden door swings open, and out trots the family cat.', zh-Hans: 早上好！小木门打开了，家里的猫咪迈着小碎步走了出来。, zh-Hant: 早安！小木門打開了，家裡的貓咪踩著小碎步走了出來。 }
  closer: { en: 'One door instead of two: that is 户 (戶) — the 户 in 窗户, window!', zh-Hans: 两扇门少了一扇：这就是窗户的“户”！, zh-Hant: 兩扇門少了一扇：這就是窗戶的「戶」！ }
