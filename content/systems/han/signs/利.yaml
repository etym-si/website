id: 利
text: { Hans: 利, Hant: 利 }
readings: { pinyin: lì }
meaning: { en: benefit; going smoothly, zh-Hans: 顺利, zh-Hant: 順利 }
fact:
  en: '利 has grain 禾 on the left and a knife 刂 (刀) on the right: reaping grain with a knife.'
  zh-Hans: “利”左边是“禾”（庄稼），右边的“刂”就是“刀”：用刀收割庄稼。
  zh-Hant: 「利」左邊是「禾」（莊稼），右邊的「刂」就是「刀」：用刀收割莊稼。
story:
  topic: { en: The Perfect Pudding, zh-Hans: 顺利脱模的布丁, zh-Hant: 順利脫模的布丁 }
  hook: { en: 'Wobble, wobble… plop! The pudding slides out of its mold perfectly, without a single crack.', zh-Hans: 晃一晃……啵！布丁顺顺利利地从模子里滑了出来，一条裂缝都没有。, zh-Hant: 晃一晃……啵！布丁順順利利地從模子裡滑了出來，一條裂縫都沒有。 }
  closer: { en: "Grain 禾 and a knife 刂: that's 利, as in 顺利, when everything goes smoothly!", zh-Hans: “禾”加上“刂”——这就是顺利的“利”！, zh-Hant: 「禾」加上「刂」——這就是順利的「利」！ }
journey: default
origin:
  type: compound-ideogram
  parts:
    - { char: 禾, role: meaning, gloss: { en: grain, zh-Hans: 庄稼, zh-Hant: 莊稼 } }
    - { char: 刀, role: meaning, gloss: { en: knife, zh-Hans: 刀子, zh-Hant: 刀子 } }
status: draft
sources:
