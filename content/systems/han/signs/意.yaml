id: 意
text: { Hans: 意, Hant: 意 }
readings: { pinyin: yì }
meaning: { en: meaning; idea; wish, zh-Hans: 意思, zh-Hant: 意思 }
fact:
  en: Today 意 looks like 音 (sound) sitting on 心 (heart), but its top part actually has nothing to do with 音.
  zh-Hans: 今天的“意”看起来像“音”坐在“心”上面，可是它上面的部分其实和“音”没有关系。
  zh-Hant: 今天的「意」看起來像「音」坐在「心」上面，可是它上面的部分其實和「音」沒有關係。
story:
  topic: { en: The Mystery Note, zh-Hans: 神秘的小纸条, zh-Hant: 神祕的小紙條 }
  hook: { en: 'A note on the fridge shows only a heart and a cookie: what could it mean?', zh-Hans: 冰箱上贴着一张小纸条，上面只画了一颗爱心和一块饼干。这是什么意思呢？, zh-Hant: 冰箱上貼著一張小紙條，上面只畫了一顆愛心和一塊餅乾。這是什麼意思呢？ }
  early: { en: 'So where did it come from? No one is completely sure, but one scholar thought a bronze-inscription character made of 言 and 中 was the same as 意.', zh-Hans: 那它是从哪里来的呢？还没有定论。有学者认为，青铜器铭文里一个由“言”和“中”组成的字，就是“意”。, zh-Hant: 那它是從哪裡來的呢？還沒有定論。有學者認為，青銅器銘文裡一個由「言」和「中」組成的字，就是「意」。 }
  closer: { en: "Open the cookie jar: it's a treat for you! Figuring out what a message means is all about 意, meaning.", zh-Hans: 打开饼干罐看看：原来是送给你的点心！读懂纸条想说什么，就是明白了它的意思——意思的“意”。, zh-Hant: 打開餅乾罐看看：原來是送給你的點心！讀懂紙條想說什麼，就是明白了它的意思——意思的「意」。 }
