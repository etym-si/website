id: 桌
text: { Hans: 桌, Hant: 桌 }
readings: { pinyin: zhuō }
meaning: { en: table; desk, zh-Hans: 桌子, zh-Hant: 桌子 }
fact:
  en: '桌 is 卓 (high) plus 木 (wood): a table! 卓 (zhuó) also helps with the sound.'
  zh-Hans: “桌”是“卓”（高）加上“木”（木头），意思是桌子！“卓”（zhuó）同时也表示读音。
  zh-Hant: 「桌」是「卓」（高）加上「木」（木頭），意思是桌子！「卓」（zhuó）同時也表示讀音。
story:
  topic: { en: The Secret Fort Under the Table, zh-Hans: 桌子底下的秘密基地, zh-Hant: 桌子底下的祕密基地 }
  hook: { en: 'Lift the tablecloth and peek: Bobo and her cat are hiding in a secret fort under the table!', zh-Hans: 掀开桌布瞧一瞧：波波和小猫正躲在桌子底下的秘密基地里！, zh-Hant: 掀開桌巾瞧一瞧：波波和小貓正躲在桌子底下的祕密基地裡！ }
  turn: { en: "The 十 at the bottom of 卓 merged with 木, or was replaced by it. An old variant that's no longer used, 棹, keeps the two parts apart.", zh-Hans: “卓”底下的“十”和“木”合在了一起，或者说被“木”代替了。有一个已经不用的老写法“棹”，还把两部分分开写。, zh-Hant: 「卓」底下的「十」和「木」合在了一起，或者說被「木」代替了。有一個已經不用的老寫法「棹」，還把兩部分分開寫。 }
  closer: { en: 'High 卓 and wooden 木 together make 桌, a table for dinner, homework and secret forts!', zh-Hans: 高高的“卓”加上木头的“木”，就是能吃饭、写作业，还能当秘密基地的“桌”！, zh-Hant: 高高的「卓」加上木頭的「木」，就是能吃飯、寫功課，還能當祕密基地的「桌」！ }
