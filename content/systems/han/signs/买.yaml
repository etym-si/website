id: 买
text: { Hans: 买, Hant: 買 }
readings: { pinyin: mǎi }
meaning: { en: to buy, zh-Hans: 买东西, zh-Hant: 買東西 }
fact:
  en: 买 (買) is a net 网 above a cowrie shell 贝 (貝), the kind used as money. Some scholars think the net was chosen for its sound instead.
  zh-Hans: “买”的繁体字“買”，上面是网“网”，下面是当钱用的贝壳“贝”。也有学者认为，上面的“网”是用来表示读音的。
  zh-Hant: 「買」上面是網「网」，下面是當錢用的貝殼「貝」。也有學者認為，上面的「网」是用來表示讀音的。
story:
  topic: { en: The Yellow Yo-Yo, zh-Hans: 黄色的溜溜球, zh-Hant: 黃色的溜溜球 }
  hook: { en: 'One, two, three coins! At the toy shop, a girl counts out her money and buys a bright yellow yo-yo.', zh-Hans: 一枚、两枚、三枚！在玩具店里，小女孩数好硬币，买下了一个亮黄色的溜溜球。, zh-Hant: 一枚、兩枚、三枚！在玩具店裡，小女孩數好硬幣，買下了一個亮黃色的溜溜球。 }
  closer: { en: "A net 网 and a money shell 贝: that's 买 (買), to buy!", zh-Hans: 上面是网，下面是贝壳钱，这就是买东西的“买”！, zh-Hant: 上面是網，下面是貝殼錢，這就是買東西的「買」！ }
journey: default
origin:
