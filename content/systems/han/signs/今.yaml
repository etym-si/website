id: 今
text: { Hans: 今, Hant: 今 }
readings: { pinyin: jīn }
meaning: { en: 'now, today', zh-Hans: 今天, zh-Hant: 今天 }
fact:
  en: '今 means now, as in 今天 (today). Many scholars think its old shape is an upside-down 曰 (to speak): a mouth turned over, meaning “not speaking”.'
  zh-Hans: “今”的意思是现在，比如“今天”。很多学者认为，它古时候的样子是倒过来的“曰”（说话）：嘴巴翻过来，表示“不说话”。
  zh-Hant: 「今」的意思是現在，比如「今天」。很多學者認為，它古時候的樣子是倒過來的「曰」（說話）：嘴巴翻過來，表示「不說話」。
story:
  topic: { en: Today Is Pajama Day, zh-Hans: 今天是睡衣日, zh-Hant: 今天是睡衣日 }
  hook: { en: 'Yippee, today is Pajama Day! Everyone comes to class in their fuzziest pajamas and slippers.', zh-Hans: 耶，今天是睡衣日！大家都穿着毛茸茸的睡衣和拖鞋来上学。, zh-Hant: 耶，今天是睡衣日！大家都穿著毛茸茸的睡衣和拖鞋來上學。 }
  early: { en: Other scholars think the old 今 shows something being held in the mouth., zh-Hans: 也有学者认为，古时候的“今”画的是嘴里含着东西。, zh-Hant: 也有學者認為，古時候的「今」畫的是嘴裡含著東西。 }
  closer: { en: "Not yesterday, not tomorrow, but right now: that's 今!", zh-Hans: 不是昨天，也不是明天，就是现在——这就是今天的“今”！, zh-Hant: 不是昨天，也不是明天，就是現在——這就是今天的「今」！ }
journey: default
origin:
  type: ideogram
status: draft
sources:
