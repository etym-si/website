id: 谷
text: { Hans: 谷, Hant: 谷 }
readings: { pinyin: gǔ }
meaning: { en: valley, zh-Hans: 山谷, zh-Hant: 山谷 }
fact:
  en: 谷 is a valley. The 口 at the bottom is the valley itself, and the strokes above are the mountain walls on either side.
  zh-Hans: “谷”就是山谷：下面的“口”是山谷，上面的笔画是两边的山壁。
  zh-Hant: 「谷」就是山谷：下面的「口」是山谷，上面的筆畫是兩邊的山壁。
story:
  topic: { en: Echo in the Valley, zh-Hans: 山谷里的回声, zh-Hant: 山谷裡的回聲 }
  hook: { en: 'Hello-o-o! You shout into the valley, and the mountains shout right back: hello-o-o!', zh-Hans: 喂——！你对着山谷大喊，大山也跟着喊回来：喂——！, zh-Hant: 喂——！你對著山谷大喊，大山也跟著喊回來：喂——！ }
  closer: { en: "A valley 口 between two mountain walls: that is 谷 — the echo's favorite playground!", zh-Hans: 夹在两道山壁中间的“口”：这就是山谷的“谷”——回声最爱在这里玩！, zh-Hant: 夾在兩道山壁中間的「口」：這就是山谷的「谷」——回聲最愛在這裡玩！ }
journey: default
origin:
  type: pictogram
status: draft
sources:
  - { title: 'Wiktionary: 谷', url: 'https://en.wiktionary.org/wiki/%E8%B0%B7' }
