id: 夫
status: reviewed
text: { Hans: 夫, Hant: 夫 }
readings: { pinyin: fū }
meaning: { en: grown-up man, zh-Hans: 农夫, zh-Hant: 農夫 }
fact:
  en: "夫 is 大 (a grown-up) with a line through the hair: a hairpin! Grown-up men in ancient China pinned up their hair."
  zh-Hans: “夫”是“大”（一个大人）头上加一横——那是发簪！古时候，男子长大后要把头发束起来，插上簪子。
  zh-Hant: 「夫」是「大」（一個大人）頭上加一橫——那是髮簪！古時候，男子長大後要把頭髮束起來，插上簪子。
story:
  topic: { en: The Grown-Up’s Hairpin, zh-Hans: 束发插簪的大人, zh-Hant: 束髮插簪的大人 }
  hook:
    en: "In ancient China, when a boy grew up into a man, his family held a special ceremony: they tied his hair into a topknot and slid a pin through it."
    zh-Hans: 在古代中国，男孩长大成人时要行“冠礼”：把长发束在头顶，庄重地插上一根发簪。
    zh-Hant: 在古代中國，男孩長大成人時要行「冠禮」：把長髮束在頭頂，莊重地插上一根髮簪。
  early:
    en: "Look at the bronze inscription on the Da Yu ding: a standing person (大) with one horizontal bar — the hairpin — right across the top!"
    zh-Hans: 看大盂鼎铭文上的字形：一个张开双臂站立的大人（大），头顶正中横穿一根发簪！
    zh-Hant: 看大盂鼎銘文上的字形：一個張開雙臂站立的大人（大），頭頂正中橫穿一根髮簪！
  turn:
    en: In seal and regular scripts, the person’s arms became the lower horizontal stroke, and the hairpin became the top stroke.
    zh-Hans: 到了篆书和楷书里，张开的双臂变成了下面一横，头顶的发簪则是上面那一横。
    zh-Hant: 到了篆書和楷書裡，張開的雙臂變成了下面一橫，頭頂的髮簪則是上面那一橫。
  closer:
    en: Write 大 for a big person, push a hairpin stroke through the top, and you have 夫 — a grown man!
    zh-Hans: 先写一个大人的“大”，头顶再加一根发簪，就是长大成人的“夫”！
    zh-Hant: 先寫一個大人的「大」，頭頂再加一根髮簪，就是長大成人的「夫」！
