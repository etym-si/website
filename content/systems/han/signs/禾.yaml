id: 禾
text: { Hans: 禾, Hant: 禾 }
readings: { pinyin: hé }
meaning: { en: grain plant, zh-Hans: 禾苗, zh-Hant: 禾苗 }
fact:
  en: 禾 is a picture of the stalk of a grain plant. It's even easier to recognize in the older forms.
  zh-Hans: “禾”画的是谷物的禾秆，在古老的字形里更容易认出来。
  zh-Hant: 「禾」畫的是穀物的禾稈，在古老的字形裡更容易認出來。
story:
  topic: { en: Wind Over the Rice Field, zh-Hans: 风吹稻田, zh-Hant: 風吹稻田 }
  hook: { en: 'Rustle, rustle! A breeze ripples across the rice field, and thousands of green stalks bow together.', zh-Hans: 沙沙沙！一阵微风吹过稻田，成千上万根绿色的禾苗一起弯下了腰。, zh-Hant: 沙沙沙！一陣微風吹過稻田，成千上萬根綠色的禾苗一起彎下了腰。 }
  closer: { en: 'One stalk of grain swaying in the field: that is 禾, as in 禾苗!', zh-Hans: 田里摇摆的一根禾秆：这就是禾苗的“禾”！, zh-Hant: 田裡搖擺的一根禾稈：這就是禾苗的「禾」！ }
journey: default
origin:
  type: pictogram
status: draft
sources:
