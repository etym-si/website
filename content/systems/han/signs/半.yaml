id: 半
text: { Hans: 半, Hant: 半 }
readings: { pinyin: bàn }
meaning: { en: half, zh-Hans: 一半, zh-Hant: 一半 }
fact:
  en: '半 is 八 (to divide) on top of 牛 (an ox): split one big ox into two halves, and you get half!'
  zh-Hans: “半”是“八”（分开）在上、“牛”在下：把一头大牛分成两半，就是一半！
  zh-Hant: 「半」是「八」（分開）在上、「牛」在下：把一頭大牛分成兩半，就是一半！
story:
  topic: { en: Sharing a Chocolate Bar, zh-Hans: 分一块巧克力, zh-Hant: 分一塊巧克力 }
  hook: { en: Snap! You break a chocolate bar right down the middle and give half to your best friend., zh-Hans: 咔！你把一块巧克力从中间掰开，分一半给好朋友。, zh-Hant: 喀！你把一塊巧克力從中間掰開，分一半給好朋友。 }
  early: { en: 'The old 半 shows 八, meaning to divide, above 牛, an ox: one big animal cut into two halves.', zh-Hans: 古老的“半”上面是表示分开的“八”，下面是“牛”：把一头大牛分成两半。, zh-Hant: 古老的「半」上面是表示分開的「八」，下面是「牛」：把一頭大牛分成兩半。 }
  closer: { en: '八 to divide, 牛 to share: one ox split in two makes 半, half!', zh-Hans: “八”是分开，“牛”是大牛，把一头牛分成两份，就是一半的“半”！, zh-Hant: 「八」是分開，「牛」是大牛，把一頭牛分成兩份，就是一半的「半」！ }
