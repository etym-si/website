id: 车
text: { Hans: 车, Hant: 車 }
readings: { pinyin: chē }
meaning: { en: 'vehicle, car', zh-Hans: 汽车, zh-Hant: 汽車 }
fact:
  en: 车 (車) means vehicle. It began as a carriage seen from above.
  zh-Hans: “车”就是车子。它最早画的是从上面看下去的一辆车。
  zh-Hant: 「車」就是車子。它最早畫的是從上面看下去的一輛車。
story:
  topic: { en: The Toy Car Crash, zh-Hans: 玩具车撞积木, zh-Hant: 玩具車撞積木 }
  hook: { en: Vroom! Your toy car zooms down the ramp and crashes right into the block tower., zh-Hans: 呜——！你的玩具汽车冲下斜坡，砰的一声撞倒了积木塔。, zh-Hant: 嗚——！你的玩具汽車衝下斜坡，砰的一聲撞倒了積木塔。 }
  early: { en: 'On oracle bones, 車 has big wheels on both sides and a shaft in the middle, sticking out in front.', zh-Hans: 在甲骨文里，“车”两边是大大的轮子，中间有一根向前伸出的车辕。, zh-Hant: 在甲骨文裡，「車」兩邊是大大的輪子，中間有一根向前伸出的車轅。 }
  turn: { en: 'Simplified 车 comes from the quick cursive way of writing 車, just like 东 comes from 東.', zh-Hans: 简体的“车”来自“車”的草书写法，就像“东”来自“東”一样。, zh-Hant: 簡體字是從「車」的草書寫法變來的，「東」的簡體字也是這樣來的。 }
  closer: { en: 'Wheels on both sides, a shaft in the middle: that is 车 (車), as in 汽车!', zh-Hans: 两边是轮子，中间是车辕：这就是汽车的“车”！, zh-Hant: 兩邊是輪子，中間是車轅：這就是汽車的「車」！ }
