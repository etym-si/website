id: 古
text: { Hans: 古, Hant: 古 }
readings: { pinyin: gǔ }
meaning: { en: 'old, ancient', zh-Hans: 古代, zh-Hant: 古代 }
fact:
  en: 古 means old or ancient. Many scholars think its top part was once a shield, and the whole character first meant “strong and firm”, like a shield.
  zh-Hans: “古”的意思是古老、古代。很多学者认为，它上面的部分原来是一面盾牌，整个字起初表示“坚固”，像盾牌一样结实。
  zh-Hant: 「古」的意思是古老、古代。很多學者認為，它上面的部分原來是一面盾牌，整個字起初表示「堅固」，像盾牌一樣結實。
story:
  topic: { en: Bricks on the Great Wall, zh-Hans: 长城上的老城砖, zh-Hant: 長城上的老城磚 }
  hook: { en: 'Whoa! Walking along the Great Wall, Sam runs his hand over bricks that are hundreds of years old.', zh-Hans: 哇！走在长城上，小山摸了摸几百年前的老城砖。, zh-Hant: 哇！走在長城上，小山摸了摸幾百年前的老城磚。 }
  early: { en: 'Another scholar has a funnier idea: the 十 on top was a bite of food, and 古 showed someone spitting it out because it tasted bad!', zh-Hans: 还有一位学者的想法更有趣：上面的“十”是一口食物，“古”画的是有人觉得太难吃，把它吐了出来！, zh-Hant: 還有一位學者的想法更有趣：上面的「十」是一口食物，「古」畫的是有人覺得太難吃，把它吐了出來！ }
  closer: { en: 'Strong shield or yucky bite? No one is completely sure, but today 古 means old and ancient!', zh-Hans: 是结实的盾牌，还是难吃的一口？谁也说不准。不过今天，“古”的意思就是古老！, zh-Hant: 是結實的盾牌，還是難吃的一口？誰也說不準。不過今天，「古」的意思就是古老！ }
journey: default
origin:
