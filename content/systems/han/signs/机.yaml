id: 机
text: { Hans: 机, Hant: 機 }
readings: { pinyin: jī }
meaning: { en: machine, zh-Hans: 机器, zh-Hant: 機器 }
fact:
  en: 'In 机 (機), 木 (wood) gives the meaning, and 几 (幾 in traditional writing) gives the sound: jǐ, a lot like jī.'
  zh-Hans: “机”左边的“木”表示意思，右边的“几”（jǐ）表示读音，和“机”（jī）读起来很像。
  zh-Hant: 「機」左邊的「木」表示意思，右邊的「幾」（jǐ）表示讀音，和「機」（jī）讀起來很像。
story:
  topic: { en: The Spinning Washing Machine, zh-Hans: 转个不停的洗衣机, zh-Hant: 轉個不停的洗衣機 }
  hook: { en: 'Glug, slosh, spin! The washing machine whirls, and muddy socks swirl inside like a whirlpool.', zh-Hans: 轰轰轰！洗衣机转个不停，沾满泥巴的袜子在里面像漩涡一样打转。, zh-Hant: 轟轟轟！洗衣機轉個不停，沾滿泥巴的襪子在裡面像漩渦一樣打轉。 }
  closer: { en: 'From a weaving machine to washing machines and airplanes: 机 (機) means machine!', zh-Hans: 从织布机到洗衣机、飞机，“机”就是机器的“机”！, zh-Hant: 從織布機到洗衣機、飛機，「機」就是機器的「機」！ }
journey: default
origin:
  type: phono-semantic
  parts:
    - { char: 木, role: meaning, gloss: { en: tree; wood, zh-Hans: 木头, zh-Hant: 木頭 } }
    - { char: 幾, role: sound }
