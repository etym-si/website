id: 海
text: { Hans: 海, Hant: 海 }
readings: { pinyin: hǎi }
meaning: { en: sea; ocean, zh-Hans: 大海, zh-Hant: 大海 }
fact:
  en: 海 has 氵 (water) on the left for meaning and 每 on the right for sound. Some very big lakes are called 海 too!
  zh-Hans: “海”左边的“氵”表示意思，右边的“每”表示读音。有些特别大的湖，也叫“海”呢！
  zh-Hant: 「海」左邊的「氵」表示意思，右邊的「每」表示讀音。有些特別大的湖，也叫「海」呢！
story:
  topic: { en: Blue All the Way to the Sky, zh-Hans: 蓝到天边的大海, zh-Hant: 藍到天邊的大海 }
  hook: { en: 'Salty spray on her cheeks, Huahua stands at the front of the boat and sees nothing but blue water, all the way to the sky.', zh-Hans: 咸咸的浪花扑在脸上，花花站在船头，眼前全是蓝蓝的海水，一直连到天边。, zh-Hant: 鹹鹹的浪花撲在臉上，花花站在船頭，眼前全是藍藍的海水，一直連到天邊。 }
  closer: { en: "Water as far as your eyes can see: that's 海, the sea!", zh-Hans: 一眼望不到边的水，就是大海的“海”！, zh-Hant: 一眼望不到邊的水，就是大海的「海」！ }
journey: default
origin:
  type: phono-semantic
  parts:
    - { char: 氵, role: meaning, gloss: { en: water, zh-Hans: 水, zh-Hant: 水 } }
    - { char: 每, role: sound }
status: draft
sources:
