id: 毛
text: { Hans: 毛, Hant: 毛 }
readings: { pinyin: máo }
meaning: { en: 'hair, fur, feather', zh-Hans: 毛毛虫, zh-Hant: 毛毛蟲 }
fact:
  en: 毛 is a picture of a feather or a hair. Today it means hair, fur or feathers.
  zh-Hans: “毛”画的是一根羽毛或者一根毛发。今天它指毛发、皮毛和羽毛。
  zh-Hant: 「毛」畫的是一根羽毛或者一根毛髮。今天它指毛髮、皮毛和羽毛。
story:
  topic: { en: Snuggling the Puppy, zh-Hans: 抱抱小狗, zh-Hant: 抱抱小狗 }
  hook: { en: "So fluffy! You bury your hands in your puppy's soft, warm fur.", zh-Hans: 好软呀！你把双手埋进小狗暖乎乎的软毛里。, zh-Hant: 好軟喔！你把雙手埋進小狗暖呼呼的軟毛裡。 }
  closer: { en: 'One soft wisp of hair or feather: that is 毛 — puppies, chicks and caterpillars all have it!', zh-Hans: 一根软软的毛：这就是“毛”——小狗、小鸡和毛毛虫身上都有！, zh-Hant: 一根軟軟的毛：這就是「毛」——小狗、小雞和毛毛蟲身上都有！ }
journey: default
origin:
  type: pictogram
