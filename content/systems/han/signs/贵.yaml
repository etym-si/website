id: 贵
text: { Hans: 贵, Hant: 貴 }
readings: { pinyin: guì }
meaning: { en: expensive; precious, zh-Hans: 宝贵, zh-Hant: 寶貴 }
fact:
  en: 贵 (貴) has a money shell 贝 (貝) at the bottom for the meaning. The top is a shortened 臾, which gives the sound.
  zh-Hans: “贵”下面是当钱用的贝壳“贝”，表示意思；上面是简化了的“臾”，表示读音。
  zh-Hant: 「貴」下面是當錢用的貝殼「貝」，表示意思；上面是簡化了的「臾」，表示讀音。
story:
  topic: { en: The Shiny Red Bike, zh-Hans: 闪亮的红色自行车, zh-Hant: 閃亮的紅色腳踏車 }
  hook: { en: "Whoa, look at that price tag! The shiny red bike in the shop window costs way more than everything in Jamie's piggy bank.", zh-Hans: 哇，看那个价签！橱窗里那辆闪亮的红色自行车，比小杰存钱罐里的钱多得多。, zh-Hant: 哇，看那個標價！櫥窗裡那輛閃亮的紅色腳踏車，比小傑撲滿裡的錢多得多。 }
  turn: { en: Simplified 贵 writes the shell 貝 more simply as 贝., zh-Hans: 简化字把下面的“貝”写成了更简单的“贝”。, zh-Hant: 簡化字則把下面的「貝」寫得更簡單。 }
  closer: { en: "A money shell for the meaning, 臾 for the sound: that's 贵 (貴), expensive and precious!", zh-Hans: 贝壳钱管意思，“臾”管读音，这就是宝贵的“贵”！, zh-Hant: 貝殼錢管意思，「臾」管讀音，這就是寶貴的「貴」！ }
journey: default
origin:
