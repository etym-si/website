id: 几-幾
text: { Hans: 几, Hant: 幾 }
readings: { pinyin: jǐ }
meaning: { en: how many, zh-Hans: 几个, zh-Hant: 幾個 }
fact:
  en: '幾 joins 𢆶 (tiny silk threads) and 戍 (to guard): keeping watch over the fine details. Its simplified form 几 is also a character of its own, a small table.'
  zh-Hans: 繁体的“幾”由“𢆶”（细细的丝线）和“戍”（防守）组成，表示留心细小的地方。简化字“几”本身也是一个字，指小桌子。
  zh-Hant: 「幾」由「𢆶」（細細的絲線）和「戍」（防守）組成，表示留心細小的地方。簡化字「几」本身也是一個字，指小桌子。
story:
  topic: { en: Sparrows on the Wire, zh-Hans: 电线上的麻雀, zh-Hant: 電線上的麻雀 }
  hook: { en: How many sparrows are perched on the wire? You point and count them one by one., zh-Hans: 电线上停着几只小麻雀？你伸出手指，一只一只地数。, zh-Hant: 電線上停著幾隻小麻雀？你伸出手指，一隻一隻地數。 }
  early: { en: '幾 is built from 𢆶, little silk threads, and 戍, to stand guard: watching over the fine details.', zh-Hans: “幾”由表示细丝、小东西的“𢆶”，加上表示防守的“戍”组成：仔细看守细小的地方。, zh-Hant: 「幾」由表示細絲、小東西的「𢆶」，加上表示防守的「戍」組成：仔細看守細小的地方。 }
  turn: { en: 'The simplified form 几 looks just like another character, 几, a little stool or table seen from the side, so simplified 几 writes more than one word.', zh-Hans: 简化字“几”和另一个字“几”长得一样，那个“几”画的是从侧面看的小凳子或小桌子，所以简体的“几”能写好几个词。, zh-Hant: 簡化字「几」和另一個字「几」長得一樣，那個「几」畫的是從側面看的小凳子或小桌子，所以簡體的「几」能寫好幾個詞。 }
  closer: { en: 'How many stars, how many sweets? Ask with 几 (幾)!', zh-Hans: 有几颗星星？有几颗糖？都用“几”来问！, zh-Hant: 有幾顆星星？有幾顆糖？都用「幾」來問！ }
journey: default
origin:
  type: compound-ideogram
  parts:
