id: 找
text: { Hans: 找, Hant: 找 }
readings: { pinyin: zhǎo }
meaning: { en: to look for, zh-Hans: 找到, zh-Hant: 找到 }
fact:
  en: 找 has 扌 (hand) for meaning and 戈 for sound. People sometimes say it's 'a hand looking for a 戈 (a long weapon)', but that's only a memory trick, not where 找 comes from!
  zh-Hans: “找”左边的“扌”表示意思，右边的“戈”表示读音。有人说它是“一只手在找一把戈（一种长兵器）”，其实这只是帮助记忆的说法，并不是“找”字真正的来历！
  zh-Hant: 「找」左邊的「扌」表示意思，右邊的「戈」表示讀音。有人說它是「一隻手在找一把戈（一種長兵器）」，其實這只是幫助記憶的說法，並不是「找」字真正的來歷！
story:
  topic: { en: Grandpa's Missing Glasses, zh-Hans: 爷爷的眼镜不见了, zh-Hant: 爺爺的眼鏡不見了 }
  hook: { en: "Where are my glasses? Grandpa searches the whole house, and Zhizhi giggles: they're on top of his head!", zh-Hans: 我的眼镜呢？爷爷满屋子找，智智咯咯笑：眼镜就在爷爷的头顶上呀！, zh-Hant: 我的眼鏡呢？爺爺滿屋子找，智智咯咯笑：眼鏡就在爺爺的頭頂上呀！ }
  closer: { en: "Looking high and low until you find it: that's 找!", zh-Hans: 东找找，西找找，终于找到啦！这就是“找”。, zh-Hant: 東找找，西找找，終於找到囉！這就是「找」。 }
journey: []
origin:
  type: phono-semantic
  parts:
    - { char: 扌, role: meaning, gloss: { en: hand, zh-Hans: 手, zh-Hant: 手 } }
    - { char: 戈, role: sound }
