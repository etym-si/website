id: 鼠
text: { Hans: 鼠, Hant: 鼠 }
readings: { pinyin: shǔ }
meaning: { en: 'mouse, rat', zh-Hans: 老鼠, zh-Hant: 老鼠 }
fact:
  en: 鼠 means mouse or rat, and it really looks like one! Find its toothy mouth on top and its feet and tail below.
  zh-Hans: “鼠”就是老鼠，而且长得真像老鼠！上面是露出牙齿的嘴，下面是脚和尾巴。
  zh-Hant: 「鼠」就是老鼠，而且長得真像老鼠！上面是露出牙齒的嘴，下面是腳和尾巴。
story:
  topic: { en: The Midnight Cheese Thief, zh-Hans: 半夜偷奶酪的小老鼠, zh-Hant: 半夜偷起司的小老鼠 }
  hook: { en: 'Squeak, squeak! At midnight, a little mouse tiptoes into the kitchen to nibble the cheese.', zh-Hans: 吱吱吱！半夜里，一只小老鼠悄悄溜进厨房，啃起了奶酪。, zh-Hant: 吱吱吱！半夜裡，一隻小老鼠悄悄溜進廚房，啃起了起司。 }
  turn: { en: 'Our 鼠 comes from seal script: the top, shaped like 臼, is an open mouth with teeth, and the bottom is two feet on the left and a tail on the right.', zh-Hans: 今天的“鼠”来自篆书：上面像“臼”的部分是张开的嘴和牙齿，下面左边是两只脚，右边是尾巴。, zh-Hant: 今天的「鼠」來自篆書：上面像「臼」的部分是張開的嘴和牙齒，下面左邊是兩隻腳，右邊是尾巴。 }
  closer: { en: 'Teeth on top, feet and a tail below: that is 鼠, as in 老鼠!', zh-Hans: 上面是牙齿，下面是脚和尾巴：这就是老鼠的“鼠”！, zh-Hant: 上面是牙齒，下面是腳和尾巴：這就是老鼠的「鼠」！ }
journey: default
