id: 外
text: { Hans: 外, Hant: 外 }
readings: { pinyin: wài }
meaning: { en: outside, zh-Hans: 外面, zh-Hant: 外面 }
fact:
  en: 外 means outside. It is built from 卜, a fortune-telling sign, for the meaning and 月 (moon) for the sound.
  zh-Hans: “外”的意思是外面。它由表示占卜的“卜”和表示读音的“月”组成。
  zh-Hant: 「外」的意思是外面。它由表示占卜的「卜」和表示讀音的「月」組成。
story:
  topic: { en: Recess Time!, zh-Hans: 下课啦, zh-Hant: 下課囉 }
  hook: { en: 'Recess! The classroom door bursts open, and everyone races outside into the sunshine.', zh-Hans: 下课啦！教室门一打开，大家都冲到外面晒太阳去了。, zh-Hant: 下課囉！教室門一打開，大家都衝到外面曬太陽去了。 }
  early: { en: 'On oracle bones, 外 looked just like 卜. The only difference was a little side stroke pointing toward the outside of the tortoise shell!', zh-Hans: 在甲骨文里，“外”和“卜”长得一模一样，唯一的不同是：“外”旁边的小横画朝着龟甲的外边！, zh-Hant: 在甲骨文裡，「外」和「卜」長得一模一樣，唯一的不同是：「外」旁邊的小橫畫朝著龜甲的外邊！ }
  turn: { en: 'Later, 月 joined 卜 as the sound part, giving the 外 we write today.', zh-Hans: 后来，“月”作为表示读音的部分加到了“卜”旁边，就成了今天的“外”。, zh-Hant: 後來，「月」作為表示讀音的部分加到了「卜」旁邊，就成了今天的「外」。 }
  closer: { en: "Step out the door and you're outside: that's 外!", zh-Hans: 走出家门，就到了外面——这就是“外”！, zh-Hant: 走出家門，就到了外面——這就是「外」！ }
journey: default
origin:
  type: phono-semantic
  parts:
    - { char: 卜, role: meaning, gloss: { en: divination, zh-Hans: 占卜, zh-Hant: 占卜 } }
    - { char: 月, role: sound }
