id: 山
status: reviewed
text: { Hans: 山, Hant: 山 }
readings: { pinyin: shān }
meaning: { en: mountain, zh-Hans: 高山, zh-Hant: 高山 }
fact:
  en: Three peaks side by side make 山. The middle one is the tallest!
  zh-Hans: 三座山峰并排站着，就是“山”。中间那座最高！
  zh-Hant: 三座山峰並排站著，就是「山」。中間那座最高！
story:
  topic: { en: Three Peaks in the Clouds, zh-Hans: 云端的三座山峰, zh-Hant: 雲端的三座山峰 }
  hook:
    en: "Look out at the horizon: three rocky peaks stand shoulder to shoulder, with the tallest peak right in the middle."
    zh-Hans: 往远处望去：三座山峰肩并着肩立在大地上，中间的主峰最高。
    zh-Hant: 往遠處望去：三座山峰肩並著肩立在大地上，中間的主峰最高。
  early:
    en: On oracle bones and bronze pots, the three peaks were drawn like a crown of stone.
    zh-Hans: 在甲骨和青铜器上，三座山峰被刻得像一顶石头王冠。
    zh-Hant: 在甲骨和青銅器上，三座山峰被刻得像一頂石頭王冠。
  turn:
    en: Over time, each peak became a clean vertical stroke standing on one solid base.
    zh-Hans: 慢慢地，三座山峰简化成三根挺拔的竖画，稳稳地立在一条底线上。
    zh-Hant: 慢慢地，三座山峰簡化成三根挺拔的豎畫，穩穩地立在一條底線上。
  closer:
    en: "Three upright strokes connected at the bottom: that is 山, mountain!"
    zh-Hans: 三根竖画连着底座，这就是高山的“山”！
    zh-Hant: 三根豎畫連著底座，這就是高山的「山」！
