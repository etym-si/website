id: 为
text: { Hans: 为, Hant: 為 }
readings: { pinyin: wèi }
meaning: { en: for; because of, zh-Hans: 为什么, zh-Hant: 為什麼 }
fact:
  en: On oracle bones, 為 is a hand 又 holding an elephant 象. What a big job for one hand!
  zh-Hans: 在甲骨文里，“为”是一只手“又”抓着一头大象“象”。一只手要管一头大象，真不容易！
  zh-Hant: 在甲骨文裡，「為」是一隻手「又」抓著一頭大象「象」。一隻手要管一頭大象，真不容易！
story:
  topic: { en: Breakfast for Mom, zh-Hans: 为妈妈做早餐, zh-Hant: 為媽媽做早餐 }
  hook: { en: 'Breakfast is served! Ming makes Mom a slightly burnt toast with a jam smiley face, all for her.', zh-Hans: 早餐来喽！小明为妈妈做了一片有点烤焦的吐司，还用果酱画了个笑脸。, zh-Hant: 早餐來囉！小明為媽媽做了一片有點烤焦的吐司，還用果醬畫了個笑臉。 }
  turn: { en: 'Later, the hand 又 changed into 爪. Simplified 为 comes from the quick cursive way of writing 為.', zh-Hans: 后来，那只手“又”变成了“爪”。简体字“为”是从“為”的草书写法简化来的。, zh-Hant: 後來，那隻手「又」變成了「爪」。簡體字「为」是從「為」的草書寫法簡化來的。 }
  closer: { en: "From a hand holding an elephant to the 为 in 为什么: that's 为 (為), for!", zh-Hans: 从一只手抓着大象，到“为什么”的“为”——这就是“为”！, zh-Hant: 從一隻手抓著大象，到「為什麼」的「為」——這就是「為」！ }
journey: default
origin:
  type: compound-ideogram
  parts:
