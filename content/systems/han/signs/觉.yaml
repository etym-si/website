id: 觉
text: { Hans: 觉, Hant: 覺 }
readings: { pinyin: jué }
meaning: { en: 'to feel, to think', zh-Hans: 觉得, zh-Hant: 覺得 }
fact:
  en: 觉 (覺) has 见 (見), “to see”, at the bottom for the meaning, and a top part chosen for its sound.
  zh-Hans: “觉”下面的“见”表示意思（看见），上面的部分表示读音。
  zh-Hant: 「覺」下面的「見」表示意思（看見），上面的部分表示讀音。
story:
  topic: { en: Who's Tickling My Cheek?, zh-Hans: 谁在蹭我的脸？, zh-Hant: 誰在蹭我的臉？ }
  hook: { en: "Tickle, tickle! Something soft brushes Noah's cheek, and before he even opens his eyes, he feels it: the kitten is here!", zh-Hans: 痒痒的！有个软软的东西蹭着诺亚的脸，他还没睁开眼睛就觉得——是小猫来了！, zh-Hant: 癢癢的！有個軟軟的東西蹭著諾亞的臉，他還沒睜開眼睛就覺得——是小貓來了！ }
  turn: { en: 'Simplified 觉 made both parts lighter: the busy top got fewer strokes, and 見 became 见.', zh-Hans: 简体字“觉”把两部分都简化了：上面复杂的部分少了很多笔画，“見”也变成了“见”。, zh-Hant: 簡體字「觉」把兩部分都簡化了：上面複雜的部分少了很多筆畫，「見」也變成了「见」。 }
  closer: { en: "See it, notice it, feel it: that's 觉 (覺), as in 觉得, to feel!", zh-Hans: 看见了、发觉了、感觉到了——这就是觉得的“觉”！, zh-Hant: 看見了、發覺了、感覺到了——這就是覺得的「覺」！ }
journey: default
origin:
  type: phono-semantic
  parts:
    - { char: 見, role: meaning, gloss: { en: to see, zh-Hans: 看见, zh-Hant: 看見 } }
    - { char: 𦥯, role: sound }
status: draft
sources:
