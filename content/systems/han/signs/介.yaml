id: 介
text: { Hans: 介, Hant: 介 }
readings: { pinyin: jiè }
meaning: { en: between; to introduce, zh-Hans: 介绍, zh-Hant: 介紹 }
fact:
  en: 介 is 人 (a person) with two marks around them. The marks show someone right in the middle, in between.
  zh-Hans: “介”是一个“人”，旁边加了两笔把他围在中间，表示“在中间”。
  zh-Hant: 「介」是一個「人」，旁邊加了兩筆把他圍在中間，表示「在中間」。
story:
  topic: { en: The Friend in the Middle, zh-Hans: 站在中间的好朋友, zh-Hant: 站在中間的好朋友 }
  hook: { en: "Lele stands between two new friends and grins: 'This is Xiaoming, and this is Xiaomei!'", zh-Hans: 乐乐站在两个新朋友中间，笑着说：“这是小明，这是小美！”, zh-Hant: 樂樂站在兩個新朋友中間，笑著說：「這是小明，這是小美！」 }
  closer: { en: 'A person in the middle, linking two friends: that is 介, as in 介绍 (to introduce)!', zh-Hans: 站在中间、把两个朋友连起来的人：这就是介绍的“介”！, zh-Hant: 站在中間、把兩個朋友連起來的人：這就是介紹的「介」！ }
journey: default
origin:
  type: compound-ideogram
  parts:
    - { char: 人, role: meaning, gloss: { en: person, zh-Hans: 一个人, zh-Hant: 一個人 } }
status: draft
sources:
