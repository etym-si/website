id: 力
text: { Hans: 力, Hant: 力 }
readings: { pinyin: lì }
meaning: { en: 'strength, power', zh-Hans: 力气, zh-Hant: 力氣 }
fact:
  en: "力 means strength. Scholars aren't sure what its picture shows: a bent arm or a wooden plough?"
  zh-Hans: “力”就是力气。学者们还不确定它画的是什么：是弯曲的手臂，还是木犁？
  zh-Hant: 「力」就是力氣。學者們還不確定它畫的是什麼：是彎曲的手臂，還是木犁？
story:
  topic: { en: Tug-of-War!, zh-Hans: 拔河比赛, zh-Hant: 拔河比賽 }
  hook: { en: 'Heave-ho! In the tug-of-war, both teams pull the rope with all their strength.', zh-Hans: 嘿哟，嘿哟！拔河比赛开始了，两队都使出全身的力气拉绳子。, zh-Hant: 嘿喲，嘿喲！拔河比賽開始了，兩隊都使出全身的力氣拉繩子。 }
  early: { en: Some see an arm bending out from the side of the body in the oldest 力. Others see a wooden plough., zh-Hans: 有人觉得最早的“力”是从身体旁边弯出来的手臂，也有人觉得那是一把木犁。, zh-Hant: 有人覺得最早的「力」是從身體旁邊彎出來的手臂，也有人覺得那是一把木犁。 }
  closer: { en: 'A flexing arm or a plough pushing through soil — either way, it takes muscle! That is 力, strength.', zh-Hans: 不管是用力的手臂，还是翻土的木犁，都要花力气！这就是力气的“力”。, zh-Hant: 不管是用力的手臂，還是翻土的木犁，都要花力氣！這就是力氣的「力」。 }
journey: default
origin:
  type: pictogram
status: draft
sources:
