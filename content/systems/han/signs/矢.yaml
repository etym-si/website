id: 矢
text: { Hans: 矢, Hant: 矢 }
readings: { pinyin: shǐ }
meaning: { en: arrow, zh-Hans: 弓箭, zh-Hant: 弓箭 }
fact:
  en: 矢 is a picture of an arrow. It's much easier to recognize in the older forms.
  zh-Hans: “矢”画的是一支箭，在古老的字形里更容易认出来。
  zh-Hant: 「矢」畫的是一支箭，在古老的字形裡更容易認出來。
story:
  topic: { en: Bull's-Eye!, zh-Hans: 正中靶心！, zh-Hant: 正中靶心！ }
  hook: { en: Whiz — thwack! The arrow flies straight and hits the red center of the target., zh-Hans: 嗖——啪！箭直直地飞出去，正中红色的靶心。, zh-Hant: 咻——啪！箭直直地飛出去，正中紅色的靶心。 }
  closer: { en: 'Straight and fast: that is 矢, an arrow!', zh-Hans: 又直又快：这就是“矢”，一支箭！, zh-Hant: 又直又快：這就是「矢」，一支箭！ }
