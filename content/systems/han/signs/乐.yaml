id: 乐
text: { Hans: 乐, Hant: 樂 }
readings: { pinyin: lè }
meaning: { en: 'happy, joyful', zh-Hans: 快乐, zh-Hant: 快樂 }
fact:
  en: "乐 (樂) began as strings 絲 on a piece of wood 木: a wooden musical instrument! Read yuè, the same character means 'music'."
  zh-Hans: “乐”的繁体字“樂”，最早是木头“木”上拉着琴弦“丝”：一件木头做的乐器！读作 yuè 的时候，它的意思就是“音乐”。
  zh-Hant: 「樂」最早是木頭「木」上拉著琴弦「絲」：一件木頭做的樂器！讀作 yuè 的時候，它的意思就是「音樂」。
story:
  topic: { en: Songs in the Living Room, zh-Hans: 客厅里的歌声, zh-Hant: 客廳裡的歌聲 }
  hook: { en: 'Strum, strum! Uncle plays his guitar in the living room, and the whole family claps and sings along.', zh-Hans: 叮叮咚咚！叔叔在客厅里弹吉他，全家人跟着拍手唱歌。, zh-Hant: 叮叮咚咚！叔叔在客廳裡彈吉他，全家人跟著拍手唱歌。 }
  early: { en: 'On oracle bones, you can see two strings connected to a piece of wood.', zh-Hans: 在甲骨文里，可以看到两根弦连在一块木头上。, zh-Hant: 在甲骨文裡，可以看到兩根弦連在一塊木頭上。 }
  turn: { en: 'On bronze, 白 appeared between the strings: maybe a thumb plucking them, maybe a sound part. Simplified 乐 comes from an old, unofficial shortcut for writing 樂.', zh-Hans: 到了金文，两根弦中间多了一个“白”：也许是拨弦的大拇指，也许是表示读音的部分。简化字“乐”来自民间流传的“樂”的简便写法。, zh-Hant: 到了金文，兩根弦中間多了一個「白」：也許是撥弦的大拇指，也許是表示讀音的部分。簡化字則來自民間流傳的「樂」的簡便寫法。 }
  closer: { en: 'Strings on wood: 乐 (樂) is music when you read it yuè, and happy when you read it lè, as in 快乐!', zh-Hans: 木头上拉着琴弦：读 yuè 是音乐，读 lè 就是快乐的“乐”！, zh-Hant: 木頭上拉著琴弦：讀 yuè 是音樂，讀 lè 就是快樂的「樂」！ }
journey: default
origin:
  type: compound-ideogram
  parts:
    - { char: 絲, role: meaning, gloss: { en: strings, zh-Hans: 琴弦, zh-Hant: 琴弦 } }
    - { char: 木, role: meaning, gloss: { en: wood, zh-Hans: 木头, zh-Hant: 木頭 } }
