id: 夜
text: { Hans: 夜, Hant: 夜 }
readings: { pinyin: yè }
meaning: { en: night, zh-Hans: 夜晚, zh-Hant: 夜晚 }
fact:
  en: 夜 has 夕, a moon, for the meaning and 亦 for the sound.
  zh-Hans: “夜”里的“夕”（月亮）表示意思，“亦”表示读音。
  zh-Hant: 「夜」裡的「夕」（月亮）表示意思，「亦」表示讀音。
story:
  topic: { en: The Night Owl, zh-Hans: 夜里的猫头鹰, zh-Hant: 夜裡的貓頭鷹 }
  hook: { en: 'Hoo-hoo! In the middle of the night, an owl hoots softly while the whole town sleeps.', zh-Hans: 咕咕——咕咕——！夜深了，整个小镇都睡着了，只有猫头鹰在轻轻地叫。, zh-Hant: 咕咕——咕咕——！夜深了，整個小鎮都睡著了，只有貓頭鷹在輕輕地叫。 }
  turn: { en: "In today's 夜, 亦 got squeezed into 亠, 亻 and one long sweeping stroke that joins the 夕.", zh-Hans: 在今天的“夜”里，“亦”被挤成了“亠”“亻”和长长的一捺，这一捺还和“夕”连在了一起。, zh-Hant: 在今天的「夜」裡，「亦」被擠成了「亠」「亻」和長長的一捺，這一捺還和「夕」連在了一起。 }
  closer: { en: "A moon 夕 tucked inside: that's 夜, night!", zh-Hans: 里面藏着一个“夕”（月亮）——这就是夜晚的“夜”！, zh-Hant: 裡面藏著一個「夕」（月亮）——這就是夜晚的「夜」！ }
journey: default
origin:
  type: phono-semantic
  parts:
    - { char: 夕, role: meaning, gloss: { en: moon, zh-Hans: 月亮, zh-Hant: 月亮 } }
    - { char: 亦, role: sound }
