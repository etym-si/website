id: 好
text: { Hans: 好, Hant: 好 }
readings: { pinyin: hǎo }
meaning: { en: 'good, well', zh-Hans: 你好, zh-Hant: 你好 }
fact:
  en: 好 puts 女 (woman) next to 子 (child). The most widely accepted idea is that a mother and her child together stood for something good.
  zh-Hans: “好”是把“女”（女子）和“子”（孩子）放在一起。最多人认同的说法是：妈妈和孩子在一起，就代表美好的事。
  zh-Hant: 「好」是把「女」（女子）和「子」（孩子）放在一起。最多人認同的說法是：媽媽和孩子在一起，就代表美好的事。
story:
  topic: { en: A Job Well Done, zh-Hans: 做得真好！, zh-Hant: 做得真好！ }
  hook: { en: 'Wow, good job! Rosie has tidied her whole room, and every toy is back on its shelf.', zh-Hans: 哇，做得真好！萝西把房间收拾得干干净净，每个玩具都回到了架子上。, zh-Hant: 哇，做得真好！蘿西把房間收拾得乾乾淨淨，每個玩具都回到了架子上。 }
  early: { en: 'In some oracle bone and bronze writing, the 子 is drawn smaller, which fits this idea, though scholars have other theories too.', zh-Hans: 在一些甲骨文和金文里，“子”写得比较小，正好符合这个说法；不过，学者们也有别的看法。, zh-Hant: 在一些甲骨文和金文裡，「子」寫得比較小，正好符合這個說法；不過，學者們也有別的看法。 }
  closer: { en: "A woman 女 and a child 子 side by side: that's 好, good!", zh-Hans: “女”和“子”在一起，就是“好”！, zh-Hant: 「女」和「子」在一起，就是「好」！ }
journey: default
origin:
  type: compound-ideogram
  parts:
    - { char: 女, role: meaning, gloss: { en: woman, zh-Hans: 女子, zh-Hant: 女子 } }
    - { char: 子, role: meaning, gloss: { en: child, zh-Hans: 孩子, zh-Hant: 孩子 } }
