id: 燕
status: reviewed
text: { Hans: 燕, Hant: 燕 }
readings: { pinyin: yàn }
meaning: { en: swallow, zh-Hans: 燕子, zh-Hant: 燕子 }
fact:
  en: 燕 is a swallow flying with its wings spread wide and its forked tail behind.
  zh-Hans: “燕”是一只张开翅膀飞翔的燕子，后面还有分叉的尾巴。
  zh-Hant: 「燕」是一隻張開翅膀飛翔的燕子，後面還有分叉的尾巴。
story:
  topic: { en: The Fork-Tailed Swallow, zh-Hans: 剪刀尾巴的春燕, zh-Hant: 剪刀尾巴的春燕 }
  hook:
    en: "Skimming low over the water flies a spring swallow: open beak in front, wide wings on left and right, and a scissor-like forked tail behind!"
    zh-Hans: 一只春燕贴着水面掠过：前头是张开的小嘴，左右是展开的翅膀，后面拖着剪刀似的分叉尾巴！
    zh-Hant: 一隻春燕貼著水面掠過：前頭是張開的小嘴，左右是展開的翅膀，後面拖著剪刀似的分叉尾巴！
  turn:
    en: Seen from above as it soars upward, every part of the swallow stayed in place from oracle bone to seal script.
    zh-Hans: 从上往下看这只向上飞翔的燕子，从甲骨文到篆书，它的头、身、翅、尾全都一一对应。
    zh-Hant: 從上往下看這隻向上飛翔的燕子，從甲骨文到篆書，牠的頭、身、翅、尾全都一一對應。
  closer:
    en: Even in today’s 燕, the top is the head, 北 on the sides are the two wings, and the four dots below are the tail!
    zh-Hans: 就算在今天的“燕”字里，顶上依然是燕头，两边的“北”是双翅，底下四点就是燕尾！
    zh-Hant: 就算在今天的「燕」字裡，頂上依然是燕頭，兩邊的「北」是雙翅，底下四點就是燕尾！
journey: [ oracle, seal ]
