id: 儿
text: { Hans: 儿, Hant: 兒 }
readings: { pinyin: ér }
meaning: { en: child, zh-Hans: 儿童, zh-Hant: 兒童 }
fact:
  en: 儿 (兒) means child, and the old form 兒 is a picture of a baby.
  zh-Hans: “儿”就是儿童、孩子。它的繁体“兒”画的是一个小宝宝。
  zh-Hant: 「兒」就是兒童、孩子。它最早畫的是一個小寶寶。
story:
  topic: { en: 'Shh, the Baby Is Sleeping', zh-Hans: 嘘，小宝宝在睡觉, zh-Hant: 噓，小寶寶在睡覺 }
  hook: { en: "Shh! Baby cousin is napping, and Grandma whispers, 'Gently — a baby's head still has a soft spot on top.'", zh-Hans: 嘘！小表弟在睡午觉。奶奶小声说：“轻一点，小宝宝的头顶上还有一块软软的地方呢。”, zh-Hant: 噓！小表弟在睡午覺。奶奶小聲說：「輕一點，小寶寶的頭頂上還有一塊軟軟的地方呢。」 }
  early: { en: The oldest 兒 is a little baby whose head isn't quite closed on top yet — that soft spot!, zh-Hans: 最早的“儿”是一个小宝宝，头顶还没有完全长合——就是那块软软的地方！, zh-Hant: 最早的「兒」是一個小寶寶，頭頂還沒有完全長合——就是那塊軟軟的地方！ }
  turn: { en: 'Simplified 儿 dropped the top part, 臼, and kept the bottom, which on its own is a standing person, a form of 人.', zh-Hans: 简体的“儿”去掉了上面的“臼”，只留下下面的部分；单独来看，它是一个站着的人，是“人”的一种写法。, zh-Hant: 簡體字去掉了上面的「臼」，只留下下面的部分；單獨來看，它是一個站著的人，是「人」的一種寫法。 }
  closer: { en: 'A tiny baby with a soft little head: that is 儿 (兒), child — just like you were once!', zh-Hans: 头顶软软的小宝宝：这就是儿童的“儿”——你小时候也是这样哦！, zh-Hant: 頭頂軟軟的小寶寶：這就是兒童的「兒」——你小時候也是這樣喔！ }
