id: 豕
status: reviewed
text: { Hans: 豕, Hant: 豕 }
readings: { pinyin: shǐ }
meaning: { en: pig, zh-Hans: 猪, zh-Hant: 豬 }
fact:
  en: "豕 is a pig standing up, with a round belly and a short tail. Find 豕 inside 家 (home): a pig under a roof!"
  zh-Hans: “豕”是一头竖起来的猪，肚子圆圆，尾巴短短。“家”字里面就有“豕”——屋顶下养着猪！
  zh-Hant: 「豕」是一頭豎起來的豬，肚子圓圓，尾巴短短。「家」字裡面就有「豕」——屋頂下養著豬！
story:
  topic: { en: The Plump Little Pig, zh-Hans: 圆肚子短尾巴的猪, zh-Hant: 圓肚子短尾巴的豬 }
  hook:
    en: Oink, oink! Around the farmyard trots a plump pig with a big snout, a round belly, four short legs, and a stubby tail.
    zh-Hans: 哼哼哼！院子里跑着一头胖乎乎的小猪，长鼻子、圆肚子、四条短腿，加上一根小短尾。
    zh-Hant: 哼哼哼！院子裡跑著一頭胖乎乎的小豬，長鼻子、圓肚子、四條短腿，加上一根小短尾。
  turn:
    en: Stood upright in oracle bone and bronze scripts, the pig’s round belly curves out on one side while its legs kick out on the other.
    zh-Hans: 在甲骨文和金文里，竖起来的小猪一边鼓着圆滚滚的肚皮，另一边伸着小短腿。
    zh-Hant: 在甲骨文和金文裡，豎起來的小豬一邊鼓著圓滾滾的肚皮，另一邊伸著小短腿。
  closer:
    en: Put a roof 宀 over 豕 (pig) and you get 家 — home! Having a pig under your roof meant a well-fed family.
    zh-Hans: 在“豕”（猪）头顶盖上屋顶“宀”，就是“家”！屋里有猪，就代表一家人丰衣足食。
    zh-Hant: 在「豕」（豬）頭頂蓋上屋頂「宀」，就是「家」！屋裡有豬，就代表一家人豐衣足食。
journey: [ oracle, bronze, seal ]
