id: 秋
text: { Hans: 秋, Hant: 秋 }
readings: { pinyin: qiū }
meaning: { en: 'autumn, fall', zh-Hans: 秋天, zh-Hant: 秋天 }
fact:
  en: The oldest 秋 is a picture of a cricket or a locust, sometimes with fire 火 underneath. Later it became grain 禾 plus a sound part.
  zh-Hans: 最早的“秋”画的是一只蟋蟀或蝗虫，有时下面还有一个“火”。后来，它变成了禾苗“禾”加上表示读音的部分。
  zh-Hant: 最早的「秋」畫的是一隻蟋蟀或蝗蟲，有時下面還有一個「火」。後來，它變成了禾苗「禾」加上表示讀音的部分。
story:
  topic: { en: Crickets Under the Falling Leaves, zh-Hans: 落叶下的蟋蟀, zh-Hant: 落葉下的蟋蟀 }
  hook: { en: 'Chirp, chirp! On a cool evening, golden leaves drift down and crickets sing in the grass.', zh-Hans: 唧唧，唧唧！凉爽的傍晚，金黄的树叶飘落下来，蟋蟀在草丛里唱个不停。, zh-Hant: 唧唧，唧唧！涼爽的傍晚，金黃的樹葉飄落下來，蟋蟀在草叢裡唱個不停。 }
  early: { en: 'On oracle bones and bronze, 秋 shows a cricket or a locust, sometimes with a fire 火 drawn underneath.', zh-Hans: 在甲骨文和金文里，“秋”是一只蟋蟀或蝗虫，有时下面还画着一个“火”。, zh-Hant: 在甲骨文和金文裡，「秋」是一隻蟋蟀或蝗蟲，有時下面還畫著一個「火」。 }
  turn: { en: Later 秋 became grain 禾 for the meaning plus a shortened sound part. That's why today you see 禾 and 火 side by side., zh-Hans: 后来，“秋”变成了表示意思的“禾”，再加上一个简化了的表示读音的部分。所以今天我们看到的是“禾”和“火”肩并肩。, zh-Hant: 後來，「秋」變成了表示意思的「禾」，再加上一個簡化了的表示讀音的部分。所以今天我們看到的是「禾」和「火」肩並肩。 }
  closer: { en: "Grain 禾 on the left, fire 火 on the right: that's 秋, autumn, the harvest season!", zh-Hans: 左边是“禾”，右边是“火”，这就是秋天的“秋”，收获的季节！, zh-Hant: 左邊是「禾」，右邊是「火」，這就是秋天的「秋」，收穫的季節！ }
