id: 纸
text: { Hans: 纸, Hant: 紙 }
readings: { pinyin: zhǐ }
meaning: { en: paper, zh-Hans: 白纸, zh-Hant: 白紙 }
fact:
  en: 紙 (纸) has the silk part 糸 on the left for the meaning and 氏 on the right for the sound.
  zh-Hans: “纸”左边的绞丝旁“纟”表示丝，是意思部分；右边的“氏”表示读音。
  zh-Hant: 「紙」左邊的「糸」表示絲，是意思部分；右邊的「氏」表示讀音。
story:
  topic: { en: The Paper Airplane Contest, zh-Hans: 纸飞机比赛, zh-Hant: 紙飛機比賽 }
  hook: { en: "Nose up, wings flat, let go! Oscar's paper airplane glides across the whole classroom and lands on the teacher's desk.", zh-Hans: 机头朝上，机翼放平，放手！奥斯卡的纸飞机滑过整个教室，落在了老师的讲台上。, zh-Hant: 機頭朝上，機翼放平，放手！奧斯卡的紙飛機滑過整個教室，落在了老師的講桌上。 }
  closer: { en: 'Silk part plus 氏 makes 纸 (紙), paper that can even fly!', zh-Hans: 绞丝旁加上“氏”，就是能折成飞机的“纸”！, zh-Hant: 「糸」加上「氏」，就是能摺成飛機的「紙」！ }
journey: default
origin:
  type: phono-semantic
  parts:
    - { char: 糸, role: meaning, gloss: { en: silk, zh-Hans: 丝, zh-Hant: 絲 } }
    - { char: 氏, role: sound }
