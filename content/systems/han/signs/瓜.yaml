id: 瓜
text: { Hans: 瓜, Hant: 瓜 }
readings: { pinyin: guā }
meaning: { en: melon, zh-Hans: 西瓜, zh-Hant: 西瓜 }
fact:
  en: 瓜 is a picture of a melon hanging from its vine, like a lantern on a string.
  zh-Hans: “瓜”画的是挂在藤上的一个瓜，就像挂在绳子上的灯笼。
  zh-Hant: 「瓜」畫的是掛在藤上的一個瓜，就像掛在繩子上的燈籠。
story:
  topic: { en: Knocking on the Watermelon, zh-Hans: 敲敲大西瓜, zh-Hant: 敲敲大西瓜 }
  hook: { en: "Knock, knock! At the market, the fruit seller taps a big striped watermelon: 'Hear that? It's ripe!'", zh-Hans: 笃笃笃！水果摊的老板敲了敲带花纹的大西瓜：“听，这个熟透了！”, zh-Hant: 叩叩叩！水果攤的老闆敲了敲有花紋的大西瓜：「聽，這個熟透了！」 }
  closer: { en: 'A melon dangling from its vine: that is 瓜 — round ones like 西瓜 (watermelon), long ones like 黄瓜 (cucumber)!', zh-Hans: 挂在藤上的瓜：这就是“瓜”——有圆圆的西瓜，也有长长的黄瓜！, zh-Hant: 掛在藤上的瓜：這就是「瓜」——有圓圓的西瓜，也有長長的黃瓜！ }
