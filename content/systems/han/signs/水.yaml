id: 水
status: reviewed
text: { Hans: 水, Hant: 水 }
readings: { pinyin: shuǐ }
meaning: { en: water, zh-Hans: 河水, zh-Hant: 河水 }
fact:
  en: The wavy line in the middle is a flowing river, and the dots on each side are splashes of water.
  zh-Hans: 中间弯弯的线是流动的河水，两边的点是溅起的水花。
  zh-Hant: 中間彎彎的線是流動的河水，兩邊的點是濺起的水花。
story:
  topic: { en: The Rushing Mountain Stream, zh-Hans: 哗哗流淌的溪水, zh-Hant: 嘩嘩流淌的溪水 }
  hook:
    en: Listen — splash, gurgle! Melted snow tumbles down the valley in a winding stream, kicking up droplets on both sides.
    zh-Hans: 听——哗啦啦！山上融化的雪水顺着山谷蜿蜒流下，两边溅起晶莹的水花。
    zh-Hant: 聽——嘩啦啦！山上融化的雪水順著山谷蜿蜒流下，兩邊濺起晶瑩的水花。
  early:
    en: The center wave is the deep current, and the short ticks on left and right are the splashes.
    zh-Hans: 中间弯弯曲曲的一道是湍急的主流，左右两边的小短线就是飞溅的水滴。
    zh-Hant: 中間彎彎曲曲的一道是湍急的主流，左右兩邊的小短線就是飛濺的水滴。
  turn:
    en: In brush writing, the middle current straightened into a hooked vertical spine, while the splashes joined into side strokes.
    zh-Hans: 到了毛笔字里，中间的水流拉直成挺拔的竖钩，两边的水花也连成了撇和捺。
    zh-Hant: 到了毛筆字裡，中間的水流拉直成挺拔的豎鉤，兩邊的水花也連成了撇和捺。
  closer:
    en: Whenever you see 水 — or its three-drop sidekick 氵 — something wet and flowing is nearby!
    zh-Hans: 看到“水”或者三点水，就知道一定和水流有关啦！
    zh-Hant: 看到「水」或者三點水，就知道一定和水流有關啦！
