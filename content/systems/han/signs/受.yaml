id: 受
text: { Hans: 受, Hant: 受 }
readings: { pinyin: shòu }
meaning: { en: 'to receive, to accept', zh-Hans: 接受, zh-Hant: 接受 }
fact:
  en: 'No one is completely sure, but 受 may be made of two hands, 爪 and 又, and a boat 舟: something being handed over.'
  zh-Hans: 没有人能完全确定，不过“受”可能是由两只手（“爪”和“又”）和一条船“舟”组成的，表示把东西交给别人。
  zh-Hant: 沒有人能完全確定，不過「受」可能是由兩隻手（「爪」和「又」）和一條船「舟」組成的，表示把東西交給別人。
story:
  topic: { en: A Parcel for Hannah, zh-Hans: 汉娜的包裹, zh-Hant: 漢娜的包裹 }
  hook: { en: "Ding-dong! The mail carrier holds out a big box with Hannah's name on it, and she reaches out both hands to take it.", zh-Hans: 叮咚！邮递员递过来一个写着汉娜名字的大箱子，汉娜伸出双手接了过来。, zh-Hant: 叮咚！郵差遞過來一個寫著漢娜名字的大箱子，漢娜伸出雙手接了過來。 }
  closer: { en: "One hand gives, the other hand takes: that's 受, to receive!", zh-Hans: 一只手递过来，一只手接过去——这就是接受的“受”！, zh-Hant: 一隻手遞過來，一隻手接過去——這就是接受的「受」！ }
journey: default
origin:
  type: compound-ideogram
  parts:
    - { char: 爪, role: meaning, gloss: { en: hand, zh-Hans: 手, zh-Hant: 手 } }
    - { char: 舟, role: meaning, gloss: { en: boat, zh-Hans: 小船, zh-Hant: 小船 } }
    - { char: 又, role: meaning, gloss: { en: hand, zh-Hans: 手, zh-Hant: 手 } }
status: draft
sources:
  - { title: 'Wiktionary: 受', url: 'https://en.wiktionary.org/wiki/%E5%8F%97' }
