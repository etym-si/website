id: 先
text: { Hans: 先, Hant: 先 }
readings: { pinyin: xiān }
meaning: { en: 'first, before', zh-Hans: 首先, zh-Hant: 首先 }
fact:
  en: '先 is a foot 止 on top of a person 儿: someone striding forward.'
  zh-Hans: “先”是一个人“儿”上面加一只脚“止”：一个人迈开脚步往前走。
  zh-Hant: 「先」是一個人「儿」上面加一隻腳「止」：一個人邁開腳步往前走。
story:
  topic: { en: The Tortoise Wins the Race, zh-Hans: 乌龟先到终点, zh-Hant: 烏龜先到終點 }
  hook: { en: 'Slow and steady! In the story, the tortoise reaches the finish line first while the speedy hare snoozes under a tree.', zh-Hans: 慢慢来！故事里，乌龟先到了终点，跑得飞快的兔子却还在树下呼呼大睡。, zh-Hant: 慢慢來！故事裡，烏龜先到了終點，跑得飛快的兔子卻還在樹下呼呼大睡。 }
  closer: { en: "A foot stepping out in front of the person: that's 先, first!", zh-Hans: 脚步迈在最前面，这就是首先的“先”！, zh-Hant: 腳步邁在最前面，這就是首先的「先」！ }
journey: default
origin:
  type: compound-ideogram
  parts:
    - { char: 止, role: meaning, gloss: { en: foot, zh-Hans: 脚, zh-Hant: 腳 } }
    - { char: 儿, role: meaning, gloss: { en: person, zh-Hans: 人, zh-Hant: 人 } }
