id: 蛇
text: { Hans: 蛇, Hant: 蛇 }
readings: { pinyin: shé }
meaning: { en: snake, zh-Hans: 小蛇, zh-Hant: 小蛇 }
fact:
  en: 蛇 puts 虫 (snake, bug) on the left for meaning and 它 on the right for sound. And 它 itself began as a picture of a snake!
  zh-Hans: “蛇”左边的“虫”表示意思，右边的“它”表示读音。而“它”本身最早就是一条蛇的图画！
  zh-Hant: 「蛇」左邊的「虫」表示意思，右邊的「它」表示讀音。而「它」本身最早就是一條蛇的圖畫！
story:
  topic: { en: Hiss in the Grass, zh-Hans: 草丛里的嘶嘶声, zh-Hant: 草叢裡的嘶嘶聲 }
  hook: { en: 'Hiss! A little green snake slides through the grass, flicking its forked tongue.', zh-Hans: 嘶嘶！一条小青蛇在草丛里游过，一伸一缩地吐着分叉的舌头。, zh-Hant: 嘶嘶！一條小青蛇在草叢裡游過，一伸一縮地吐著分岔的舌頭。 }
  closer: { en: 'Bug-snake 虫 for meaning, 它 for sound: together they make 蛇, the snake!', zh-Hans: “虫”管意思，“它”管读音，合起来就是小蛇的“蛇”！, zh-Hant: 「虫」管意思，「它」管讀音，合起來就是小蛇的「蛇」！ }
