# yaml-language-server: $schema=../../../_schema/sign.schema.json
id: 马
status: reviewed
text: { Hans: 马, Hant: 馬 }
readings: { pinyin: mǎ }
meaning: { en: horse, zh-Hans: 骏马, zh-Hant: 駿馬 }
fact:
  en: The ancient 马 is a horse standing up on its tail! Writers turned animals sideways to fit them into narrow columns. You can still see the mane and legs in 馬.
  zh-Hans: 古代的“马”是一匹竖起来的马！为了写进窄窄的竖行，古人常把动物竖着写。繁体“馬”里还能看到马鬃和马腿。
  zh-Hant: 古代的「馬」是一匹豎起來的馬！為了寫進窄窄的豎行，古人常把動物豎著寫。「馬」字裡還能看到馬鬃和馬腿。
story:
  topic: { en: The Galloping Steed, zh-Hans: 迎风奔跑的骏马, zh-Hant: 迎風奔跑的駿馬 }
  hook:
    en: Clip-clop, clip-clop! A spirited horse gallops across the plain, its thick mane and long tail streaming in the wind.
    zh-Hans: 得儿驾！一匹骏马在原野上飞奔，浓密的马鬃和长长的马尾在风中飞扬。
    zh-Hant: 得兒駕！一匹駿馬在原野上飛奔，濃密的馬鬃和長長的馬尾在風中飛揚。
  rotate:
    en: Just like the elephant, the horse was stood upright on its tail so it could fit into a vertical column of writing!
    zh-Hans: 跟大象一样，为了写进窄窄的竖行里，骏马也竖着站了起来！
    zh-Hant: 跟大象一樣，為了寫進窄窄的豎行裡，駿馬也豎著站了起來！
  early:
    en: In the ancient carvings, you can spot its big eye, flowing mane along the back, four hooves, and sweeping tail.
    zh-Hans: 在古老的字形里，你能看到它大大的眼睛、脖子后一排马鬃、四条腿和长尾巴。
    zh-Hant: 在古老的字形裡，你能看到牠大大的眼睛、脖子後一排馬鬃、四條腿和長尾巴。
  turn:
    en: In regular script 馬, the mane became three horizontal strokes, and the four hooves turned into four dots at the bottom.
    zh-Hans: 到了楷书“馬”，马鬃变成了上面的横画，四只马蹄变成了底下的四个点。
    zh-Hant: 到了楷書「馬」，馬鬃變成了上面的橫畫，四隻馬蹄變成了底下的四個點。
  closer:
    en: And in simplified 马, the four galloping hooves are swept together into one fast horizontal stroke!
    zh-Hans: 而在简化字“马”里，奔跑的四只马蹄一笔连成了一道飞快的横画！
    zh-Hant: 而在簡化字「马」裡，奔跑的四隻馬蹄一筆連成了一道飛快的橫畫！
