id: 狼
text: { Hans: 狼, Hant: 狼 }
readings: { pinyin: láng }
meaning: { en: wolf, zh-Hans: 大灰狼, zh-Hant: 大野狼 }
fact:
  en: 狼 has the dog part 犭 (犬) on the left for the meaning and 良 on the right for the sound.
  zh-Hans: “狼”左边的“犭”就是“犬”，表示意思；右边的“良”表示读音。
  zh-Hant: 「狼」左邊的「犭」就是「犬」，表示意思；右邊的「良」表示讀音。
story:
  topic: { en: Howling at the Moon, zh-Hans: 对着月亮嚎叫, zh-Hant: 對著月亮嚎叫 }
  hook: { en: 'Awooo! On a snowy hilltop, a gray wolf lifts its nose to the full moon and howls.', zh-Hans: 嗷呜——！雪白的山顶上，一只灰狼抬起鼻子，对着圆圆的月亮长嚎。, zh-Hant: 嗷嗚——！雪白的山頂上，一隻灰狼抬起鼻子，對著圓圓的月亮長嚎。 }
  closer: { en: "The dog part 犭 plus 良 for the sound: that's 狼, the wolf!", zh-Hans: “犭”加上“良”，就是大灰狼的“狼”！, zh-Hant: 「犭」加上「良」，就是大野狼的「狼」！ }
journey: default
origin:
  type: phono-semantic
  parts:
    - { char: 犭, role: meaning, gloss: { en: dog, zh-Hans: 狗, zh-Hant: 狗 } }
    - { char: 良, role: sound }
