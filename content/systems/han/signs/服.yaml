id: 服
text: { Hans: 服, Hant: 服 }
readings: { pinyin: fú }
meaning: { en: clothes, zh-Hans: 衣服, zh-Hant: 衣服 }
fact:
  en: "服 was built to mean 'to serve': 凡 (a tray) on the left, and a sound part on the right. Today it's the 服 in 衣服, clothes."
  zh-Hans: “服”本来是“服侍”的意思：左边是“凡”（托盘），右边是表示读音的部分。今天它是衣服的“服”。
  zh-Hant: 「服」本來是「服侍」的意思：左邊是「凡」（托盤），右邊是表示讀音的部分。今天它是衣服的「服」。
story:
  topic: { en: What Shall I Wear Today?, zh-Hans: 今天穿什么？, zh-Hant: 今天穿什麼？ }
  hook: { en: Dinosaur T-shirt or striped sweater? Ivy pulls everything out of the closet and still can't decide., zh-Hans: 恐龙T恤还是条纹毛衣？艾薇把衣柜里的衣服全翻了出来，还是拿不定主意。, zh-Hant: 恐龍T恤還是條紋毛衣？艾薇把衣櫃裡的衣服全翻了出來，還是拿不定主意。 }
  turn: { en: 'At first the character was just the right-hand part; 凡 was added later. Over time 凡 got bent into 舟 (boat) and then 月, which is why 服 has 月 on the left today.', zh-Hans: 一开始，这个字只有右边那部分，“凡”是后来才加上的。慢慢地，“凡”被写成了“舟”，后来又变成了“月”，所以今天“服”的左边是“月”。, zh-Hant: 一開始，這個字只有右邊那部分，「凡」是後來才加上的。慢慢地，「凡」被寫成了「舟」，後來又變成了「月」，所以今天「服」的左邊是「月」。 }
  closer: { en: 'The left side changed from 凡 to 舟 to 月, and today 服 means clothes!', zh-Hans: 左边从“凡”变成“舟”，又变成“月”，今天的“服”就是衣服的“服”！, zh-Hant: 左邊從「凡」變成「舟」，又變成「月」，今天的「服」就是衣服的「服」！ }
