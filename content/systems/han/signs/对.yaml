  parts:
    - { char: 丵, role: meaning, gloss: { en: digging tool, zh-Hans: 挖土的工具, zh-Hant: 挖土的工具 } }
    - { char: 土, role: meaning, gloss: { en: earth, zh-Hans: 泥土, zh-Hant: 泥土 } }
    - { char: 又, role: meaning, gloss: { en: hand, zh-Hans: 手, zh-Hant: 手 } }
