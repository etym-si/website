id: 肉
text: { Hans: 肉, Hant: 肉 }
readings: { pinyin: ròu }
meaning: { en: meat, zh-Hans: 肉包, zh-Hant: 肉包 }
fact:
  en: 肉 is a picture of meat. Scholars aren't sure whether it shows a slice of meat or an animal's ribs.
  zh-Hans: “肉”画的是肉。学者们还不确定，它画的是一块肉，还是动物的肋骨。
  zh-Hant: 「肉」畫的是肉。學者們還不確定，它畫的是一塊肉，還是動物的肋骨。
story:
  topic: { en: Sizzling on the Grill, zh-Hans: 烤架上滋滋响, zh-Hant: 烤架上滋滋響 }
  hook: { en: 'Sizzle, sizzle! Dad flips slices of meat on the grill, and the smell makes your tummy rumble.', zh-Hans: 滋滋滋！爸爸在烤架上翻着肉片，香味让你的肚子咕咕叫。, zh-Hant: 滋滋滋！爸爸在烤架上翻著肉片，香味讓你的肚子咕咕叫。 }
  turn: { en: 'When it sits beside a sound part, 肉 shrinks into 月, so some 月 in characters is really meat, not the moon!', zh-Hans: 当它站在表示读音的部分旁边时，“肉”会缩成“月”。所以有些字里的“月”其实是肉，不是月亮！, zh-Hant: 當它站在表示讀音的部分旁邊時，「肉」會縮成「月」。所以有些字裡的「月」其實是肉，不是月亮！ }
  closer: { en: 'A juicy slice (or a row of ribs): that is 肉, meat — as in 肉包, a meat bun!', zh-Hans: 一块香喷喷的肉（或是一排肋骨）：这就是肉包的“肉”！, zh-Hant: 一塊香噴噴的肉（或是一排肋骨）：這就是肉包的「肉」！ }
journey: default
origin:
  type: pictogram
status: draft
sources:
  - { title: 'Wiktionary: 肉', url: 'https://en.wiktionary.org/wiki/%E8%82%89' }
