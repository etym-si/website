id: 是
text: { Hans: 是, Hant: 是 }
readings: { pinyin: shì }
meaning: { en: to be; is, zh-Hans: 是的, zh-Hant: 是的 }
fact:
  en: No one is completely sure where 是 comes from. Some scholars think it may come from an oracle-bone way of writing 智, made of 子, 止 and 册.
  zh-Hans: “是”是从哪里来的，谁也说不准。有学者认为，它可能来自甲骨文里“智”的一种写法，由“子”“止”和“册”组成。
  zh-Hant: 「是」是從哪裡來的，誰也說不準。有學者認為，它可能來自甲骨文裡「智」的一種寫法，由「子」「止」和「冊」組成。
story:
  topic: { en: The Guessing Game, zh-Hans: 猜一猜，是什么？, zh-Hant: 猜一猜，是什麼？ }
  hook: { en: 'Grandpa hides something behind his back: is it a pear? Yes, a big juicy one!', zh-Hans: 爷爷把一样东西藏在背后：是梨吗？是的，是一个水灵灵的大梨！, zh-Hant: 爺爺把一樣東西藏在背後：是梨嗎？是的，是一個水靈靈的大梨！ }
  closer: { en: 'This is me, that is you: whenever you say what something is, 是 is there!', zh-Hans: 这是我，那是你：说“什么是什么”的时候，总少不了“是”！, zh-Hant: 這是我，那是你：說「什麼是什麼」的時候，總少不了「是」！ }
