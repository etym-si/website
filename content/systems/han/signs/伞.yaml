id: 伞
status: reviewed
text: { Hans: 伞, Hant: 傘 }
readings: { pinyin: sǎn }
meaning: { en: umbrella, zh-Hans: 雨伞, zh-Hant: 雨傘 }
fact:
  en: 伞 is a “young” character, so there are no oracle-bone or bronze versions. But it still looks like an open umbrella!
  zh-Hans: “伞”是一个“年轻”的字，没有甲骨文和金文。可它看起来还是像一把撑开的伞！
  zh-Hant: 「傘」是一個「年輕」的字，沒有甲骨文和金文。可它看起來還是像一把撐開的傘！
story:
  topic: { en: Pop Open the Umbrella!, zh-Hans: 撑开一把小雨伞, zh-Hant: 撐開一把小雨傘 }
  hook:
    en: When the rain pours down, pop! Up goes a wide round canopy held up by ribs on a central handle.
    zh-Hans: 大雨哗哗下起来，啪！一把圆圆的雨伞撑开了，伞骨支着伞面，中间立着伞柄。
    zh-Hant: 大雨嘩嘩下起來，啪！一把圓圓的雨傘撐開了，傘骨支著傘面，中間立著傘柄。
  closer:
    en: 伞 has no oracle-bone or bronze carvings because folding umbrellas were invented later — yet the character itself looks just like an open umbrella!
    zh-Hans: 因为折叠伞发明得比较晚，“伞”没有甲骨文和金文——可你看它的样子，活脱脱就是一把撑开的伞！
    zh-Hant: 因為折疊傘發明得比較晚，「傘」沒有甲骨文和金文——可你看它的樣子，活脫脫就是一把撐開的傘！
