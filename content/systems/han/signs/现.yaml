id: 现
text: { Hans: 现, Hant: 現 }
readings: { pinyin: xiàn }
meaning: { en: to appear; now, zh-Hans: 现在, zh-Hant: 現在 }
fact:
  en: The part of 现 (現) that looks like 王 is really 玉 (jade), for the meaning, and 见 (見) gives the sound. It means “to appear”, and also “now”.
  zh-Hans: “现”左边像“王”的部分其实是“玉”，表示意思；右边的“见”表示读音。它的意思是出现，也表示现在。
  zh-Hant: 「現」左邊像「王」的部分其實是「玉」，表示意思；右邊的「見」表示讀音。它的意思是出現，也表示現在。
story:
  topic: { en: The Magician's Rabbit, zh-Hans: 魔术师的小白兔, zh-Hant: 魔術師的小白兔 }
  hook: { en: 'Abracadabra! The magician waves his wand, and a white rabbit suddenly appears in his hat.', zh-Hans: 变！魔术师挥了挥魔法棒，帽子里突然出现了一只小白兔。, zh-Hant: 變！魔術師揮了揮魔法棒，帽子裡突然出現了一隻小白兔。 }
  closer: { en: 'Something popping into sight is 现 (現), to appear, and this very moment is 现在, now!', zh-Hans: 东西突然冒出来，是出现的“现”；就在这一刻，是现在的“现”！, zh-Hant: 東西突然冒出來，是出現的「現」；就在這一刻，是現在的「現」！ }
