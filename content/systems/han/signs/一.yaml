id: 一
text: { Hans: 一, Hant: 一 }
readings: { pinyin: yī }
meaning: { en: one, zh-Hans: 一个, zh-Hant: 一個 }
fact:
  en: 一 is just one flat line, standing for the number one.
  zh-Hans: “一”就是平平的一横，表示数字一。
  zh-Hant: 「一」就是平平的一橫，表示數字一。
story:
  topic: { en: One Tiny Candle, zh-Hans: 一根小蜡烛, zh-Hant: 一根小蠟燭 }
  hook: { en: 'Happy birthday, little cousin! Her very first birthday cake has just one tiny candle.', zh-Hans: 小表妹，生日快乐！她的第一个生日蛋糕上，只插着一根小蜡烛。, zh-Hant: 小表妹，生日快樂！她的第一個生日蛋糕上，只插著一根小蠟燭。 }
  early: { en: 'The old 一 is a single horizontal stroke: one line for one thing.', zh-Hans: 古老的“一”就是一道横画：一条线，代表一个。, zh-Hant: 古老的「一」就是一道橫畫：一條線，代表一個。 }
  closer: { en: "One line, one candle, one year old: that's 一!", zh-Hans: 一横、一根蜡烛、一岁，这就是“一”！, zh-Hant: 一橫、一根蠟燭、一歲，這就是「一」！ }
