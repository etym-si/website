<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Cinnabar seal stamp base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#d93829" stroke="#8f1d14" stroke-width="4"/>
  <!-- Inner carved parchment border -->
  <rect x="15" y="15" width="98" height="98" rx="20" fill="#fff8ec" stroke="#e8453c" stroke-width="3"/>
  <!-- Warm sun halo in upper right -->
  <circle cx="90" cy="36" r="13" fill="#f5b82e" stroke="#b8321f" stroke-width="3.5"/>
  <circle cx="90" cy="36" r="3.5" fill="#b8321f"/>
  <!-- Oracle-bone / seal-script inspired roof + child (字) in cinnabar & ink -->
  <g fill="none" stroke="#2b2522" stroke-linecap="round" stroke-linejoin="round">
    <!-- Roof crown (宀) -->
    <path d="M 60 22 L 60 31" stroke-width="7"/>
    <path d="M 28 44 C 28 32, 34 31, 60 31 C 86 31, 92 32, 92 44" stroke-width="7"/>
    <!-- Child (子) head & arms -->
    <circle cx="60" cy="54" r="10.5" fill="#fff8ec" stroke="#b8321f" stroke-width="6.5"/>
    <path d="M 34 74 C 46 68, 74 68, 86 74" stroke="#b8321f" stroke-width="6.5"/>
    <path d="M 60 65 C 63 80, 62 94, 56 103 C 52 108, 46 104, 44 99" stroke="#2b2522" stroke-width="7"/>
  </g>
  <!-- Little Gugu turtle shell badge in bottom-right corner -->
  <g transform="translate(82, 82)">
    <path d="M -16 14 C -16 -6, -6 -16, 6 -16 C 18 -16, 26 -6, 26 14 Z" fill="#2fb67c" stroke="#2b2522" stroke-width="4" stroke-linejoin="round"/>
    <path d="M -2 2 L 5 -6 L 13 2 L 10 11 L 1 11 Z" fill="#a8e092" stroke="#2b2522" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
</svg>
